<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .err { color: red; font-size: 12px; display: none; margin-top: -10px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>用户注册 (1/3)</h2>
        
        <input type="text" id="username" placeholder="请输入名称">
        <div id="err-user" class="err">名称已被占用，请重试</div>

        <input type="password" id="password" placeholder="请输入密码">
        <div id="err-pass" class="err">密码已被占用，请更换</div>
        <div style="font-size: 12px; color: #666; margin-bottom: 10px;">要求：6位纯数字</div>

        <button onclick="check()">下一步</button>
    </div>

    <script>
        function check() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errUser = document.getElementById('err-user');
            const errPass = document.getElementById('err-pass');

            errUser.style.display = 'none';
            errPass.style.display = 'none';

            if (user.trim() !== '') {
                errUser.style.display = 'block';
                return;
            }

            if (pass.trim() !== '') {
                errPass.style.display = 'block';
                return;
            }

            window.location.href = "zc2";
        }
    </script>
</body>
</html>
