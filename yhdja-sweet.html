<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>银行大劫案 · 网页试玩版</title>
<style>
  html,body{margin:0;height:100%;background:#070b14;color:#94a3b8;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}
  #boot{display:flex;height:100%;align-items:center;justify-content:center;
    flex-direction:column;gap:14px;font-size:14px;}
  .spin{width:34px;height:34px;border:3px solid #1e293b;border-top-color:#f5b942;
    border-radius:50%;animation:r .8s linear infinite;}
  @keyframes r{to{transform:rotate(360deg)}}
  #err{color:#f87171;font-size:12px;max-width:560px;text-align:center;line-height:1.7;padding:0 20px;}
</style>
</head>
<body>
<div id="boot"><div class="spin"></div><div>正在加载试玩版…</div><div id="err"></div></div>
<script>
(function(){
  var SHARDS = 4;
  function fail(m){ document.getElementById('err').textContent = m; }
  function toBytes(b){
    var bin=atob(b), n=bin.length, o=new Uint8Array(n);
    for(var i=0;i<n;i++) o[i]=bin.charCodeAt(i);
    return o;
  }
  function grab(i){
    // 用 fetch + no-store 直接取分片，绕开浏览器脚本缓存
    return fetch('yhdja-sweet-' + i + '.js?t=' + Date.now(), {cache:'no-store'})
      .then(function(r){
        if(!r.ok) throw new Error('分片 ' + i + ' 加载失败 (' + r.status + ')');
        return r.text();
      })
      .then(function(t){
        var m = t.match(/'([^']*)'\s*;?\s*$/);
        if(!m) throw new Error('分片 ' + i + ' 格式异常');
        return m[1];
      });
  }
  var jobs = [];
  for (var i = 1; i <= SHARDS; i++) jobs.push(grab(i));
  Promise.all(jobs).then(function(parts){
    var b64 = parts.join('');
    if(!b64) throw new Error('资源为空');
    if(typeof DecompressionStream === 'undefined')
      throw new Error('浏览器不支持解压，请使用新版 Chrome / Edge / Safari');
    var ds = new DecompressionStream('gzip');
    var st = new Blob([toBytes(b64)]).stream().pipeThrough(ds);
    return new Response(st).text();
  }).then(function(html){
    document.open(); document.write(html); document.close();
  }).catch(function(e){
    fail('试玩版启动失败：' + e.message);
  });
})();
</script>
</body>
</html>
