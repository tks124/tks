<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>禁止访问</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #111418;
    color: #e6e8eb;
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    text-align: center;
    padding: 24px;
  }
  .box { max-width: 480px; }
  .code {
    font-size: 80px;
    font-weight: 700;
    letter-spacing: 4px;
    color: #ff4d4f;
    line-height: 1;
  }
  .title {
    margin-top: 20px;
    font-size: 22px;
    font-weight: 600;
  }
  .desc {
    margin-top: 12px;
    font-size: 14px;
    color: #9aa3ad;
    line-height: 1.7;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="code">403</div>
    <div class="title">该网页已被禁止访问</div>
    <div class="desc">您没有权限查看此页面，如需访问请联系管理员。</div>
  </div>
</body>
</html>
