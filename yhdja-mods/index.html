<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>制作模组 - 银行大劫案</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg:#070b14; --panel:#0f172a; --panel2:#131c2e; --line:#1e293b;
    --gold:#f5b942; --red:#e11d48; --blue:#3b82f6; --green:#22c55e;
    --txt:#e2e8f0; --dim:#94a3b8;
  }
  body {
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--txt); min-height:100vh; overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .bg-fx { position:fixed; inset:0; z-index:0; pointer-events:none; }
  .bg-fx::before {
    content:''; position:absolute; width:800px; height:800px; border-radius:50%;
    background:radial-gradient(circle, rgba(245,185,66,0.13), transparent 65%);
    top:-360px; right:-240px; filter:blur(20px);
  }
  .bg-fx::after {
    content:''; position:absolute; width:700px; height:700px; border-radius:50%;
    background:radial-gradient(circle, rgba(59,130,246,0.13), transparent 65%);
    bottom:-320px; left:-200px; filter:blur(20px);
  }
  .wrap { position:relative; z-index:1; max-width:1180px; margin:0 auto; padding:0 20px 60px; }
  header {
    position:sticky; top:0; z-index:50; backdrop-filter:blur(14px);
    background:rgba(7,11,20,0.82); border-bottom:1px solid var(--line);
  }
  .nav { display:flex; align-items:center; justify-content:space-between; height:62px; }
  .logo { display:flex; align-items:center; gap:10px; font-weight:800; font-size:16px; }
  .logo-mark {
    width:30px; height:30px; border-radius:8px; display:grid; place-items:center;
    background:linear-gradient(135deg,var(--gold),#b45309); font-size:15px;
  }
  .nav a { color:var(--dim); text-decoration:none; font-size:13px; }
  .nav a:hover { color:var(--gold); }
  .page-head { padding:34px 0 22px; }
  .page-head h1 { font-size:28px; font-weight:900; letter-spacing:-0.6px; margin-bottom:8px; }
  .page-head p { font-size:13px; color:var(--dim); line-height:1.8; }
  .layout { display:grid; grid-template-columns:1fr 340px; gap:18px; align-items:start; }
  @media (max-width:900px){ .layout { grid-template-columns:1fr; } }
  .panel {
    background:linear-gradient(165deg, rgba(15,23,42,0.96), rgba(15,23,42,0.62));
    border:1px solid var(--line); border-radius:14px; padding:20px;
  }
  .tabs { display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
  .tab {
    padding:9px 16px; border-radius:9px; font-size:12.5px; font-weight:700; cursor:pointer;
    background:#1e293b; color:var(--dim); border:1px solid transparent; transition:all .16s;
    font-family:inherit;
  }
  .tab:hover { color:var(--txt); }
  .tab.active { background:linear-gradient(135deg,var(--gold),#d97706); color:#1a1206; }
  .pane { display:none; }
  .pane.active { display:block; }
  .field { margin-bottom:12px; }
  .field label { display:block; font-size:11.5px; color:var(--dim); margin-bottom:5px; font-weight:600; }
  .field input, .field select {
    width:100%; padding:9px 11px; border-radius:8px; font-size:12.5px;
    background:#0b1220; border:1px solid #334155; color:var(--txt);
    font-family:inherit; outline:none; transition:border-color .16s;
  }
  .field input:focus, .field select:focus { border-color:var(--gold); }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .row3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
  .chk { display:flex; align-items:center; gap:7px; font-size:12px; color:var(--txt); cursor:pointer; }
  .chk input { width:15px; height:15px; accent-color:var(--gold); cursor:pointer; }
  .btn {
    display:inline-flex; align-items:center; justify-content:center; gap:7px;
    padding:10px 18px; border-radius:9px; font-size:12.5px; font-weight:800;
    cursor:pointer; border:none; font-family:inherit; transition:all .16s;
  }
  .btn-gold { background:linear-gradient(135deg,var(--gold),#d97706); color:#1a1206; }
  .btn-gold:hover { transform:translateY(-1px); box-shadow:0 6px 20px rgba(245,185,66,0.3); }
  .btn-green { background:linear-gradient(135deg,#16a34a,#15803d); color:#fff; }
  .btn-green:hover { transform:translateY(-1px); box-shadow:0 6px 20px rgba(34,197,94,0.3); }
  .btn-red { background:linear-gradient(135deg,#dc2626,#991b1b); color:#fff; }
  .btn-ghost { background:#1e293b; color:var(--txt); border:1px solid #334155; }
  .btn-ghost:hover { background:#273449; }
  .btn-sm { padding:5px 10px; font-size:11px; border-radius:6px; }
  .list { display:flex; flex-direction:column; gap:8px; margin-top:14px; max-height:340px; overflow-y:auto; }
  .item {
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 12px; border-radius:9px; background:#0b1220; border:1px solid #1e293b;
    font-size:12px;
  }
  .item:hover { border-color:#334155; }
  .item .name { font-weight:700; color:#fff; }
  .item .meta { font-size:10.5px; color:var(--dim); margin-top:2px; }
  .empty { font-size:11.5px; color:#64748b; padding:14px; text-align:center; border:1px dashed #334155; border-radius:9px; }
  .export-panel { position:sticky; top:78px; }
  .export-panel h3 { font-size:14px; font-weight:800; margin-bottom:4px; }
  .export-panel .hint { font-size:11px; color:var(--dim); line-height:1.7; margin-bottom:14px; }
  .sel-group { margin-bottom:12px; }
  .sel-group .ghead {
    display:flex; align-items:center; justify-content:space-between;
    font-size:11.5px; font-weight:800; color:var(--gold); margin-bottom:6px;
  }
  .sel-group .ghead button {
    background:none; border:none; color:var(--blue); font-size:10.5px; cursor:pointer;
    font-family:inherit; padding:0;
  }
  .sel-list { display:flex; flex-direction:column; gap:4px; max-height:150px; overflow-y:auto; }
  .sel-list label {
    display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--txt);
    padding:4px 6px; border-radius:5px; cursor:pointer;
  }
  .sel-list label:hover { background:#0b1220; }
  .sel-list input { width:14px; height:14px; accent-color:var(--gold); cursor:pointer; }
  .summary {
    font-size:11.5px; color:#60a5fa; padding:9px 11px; border-radius:8px;
    background:rgba(59,130,246,0.09); border:1px solid rgba(59,130,246,0.25);
    margin:12px 0; text-align:center; font-weight:700;
  }
  .toast {
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px);
    background:#1e293b; color:#fff; padding:11px 20px; border-radius:9px; font-size:12.5px;
    border:1px solid #334155; opacity:0; pointer-events:none; transition:all .25s; z-index:300;
    box-shadow:0 10px 30px rgba(0,0,0,0.5);
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.ok { border-color:rgba(34,197,94,0.5); }
  .toast.err { border-color:rgba(220,38,38,0.5); }
</style>
</head>
<body>
<div class="bg-fx"></div>

<header>
  <div class="wrap nav">
    <div class="logo"><div class="logo-mark">🧩</div>制作模组</div>
    <a href="../yhdja/">← 返回官网</a>
  </div>
</header>

<div class="wrap">
  <div class="page-head">
    <h1>模组制作器</h1>
    <p>自定义武器、单位与势力，勾选要导出的内容，生成 <b style="color:#f5b942;">.yhdja</b> 模组包。<br>
       在完整版游戏侧滑栏「加载模组」中导入即可使用。</p>
  </div>

  <div class="layout">
    <div class="panel">
      <div class="tabs">
        <button class="tab active" data-pane="weapon">🔫 武器</button>
        <button class="tab" data-pane="unit">👤 单位</button>
        <button class="tab" data-pane="faction">🏳️ 势力</button>
      </div>

      <div class="pane active" id="pane-weapon">
        <div class="row2">
          <div class="field"><label>武器名称</label><input id="wName" value="新武器"></div>
          <div class="field"><label>伤害</label><input id="wDmg" type="number" value="20"></div>
        </div>
        <div class="row3">
          <div class="field"><label>弹容</label><input id="wMag" type="number" value="20"></div>
          <div class="field"><label>射速(秒)</label><input id="wRate" type="number" step="0.01" value="0.2"></div>
          <div class="field"><label>换弹(秒)</label><input id="wReload" type="number" step="0.1" value="1.5"></div>
        </div>
        <div class="row2">
          <div class="field"><label>射程(米)</label><input id="wRange" type="number" step="0.5" value="4"></div>
          <div class="field"><label>散布</label><input id="wSpread" type="number" step="0.01" value="0.1"></div>
        </div>
        <label class="chk" style="margin-bottom:14px;"><input type="checkbox" id="wSniper"> 设为狙击枪（低散布、移速减半）</label>
        <button class="btn btn-green" onclick="addWeapon()">＋ 添加武器</button>
        <div class="list" id="weaponList"></div>
      </div>

      <div class="pane" id="pane-unit">
        <div class="row2">
          <div class="field"><label>单位名字</label><input id="uName" value="新单位"></div>
          <div class="field"><label>图标</label>
            <select id="uIcon">
              <option value="none">无</option>
              <option value="star">★ 星形</option>
              <option value="bar">— 横条</option>
              <option value="soldier">✮ 士兵</option>
              <option value="square">■ 方块</option>
            </select>
          </div>
        </div>
        <div class="row3">
          <div class="field"><label>血量</label><input id="uHp" type="number" value="50"></div>
          <div class="field"><label>速度</label><input id="uSpeed" type="number" step="0.05" value="0.4"></div>
          <div class="field"><label>视野</label><input id="uView" type="number" value="260"></div>
        </div>
        <div class="row2">
          <div class="field"><label>所属势力</label><select id="uFaction"></select></div>
          <div class="field"><label>携带武器</label><select id="uWeapon"></select></div>
        </div>
        <div class="row2">
          <div class="field"><label>行为逻辑</label>
            <select id="uBehavior">
              <option value="attack">主动进攻</option>
              <option value="defend">防守</option>
              <option value="safe">安全 / 逃跑</option>
            </select>
          </div>
          <div class="field"><label>制作人</label><input id="uAuthor" value="Anonymous"></div>
        </div>
        <button class="btn btn-green" onclick="addUnit()">＋ 添加单位</button>
        <div class="list" id="unitList"></div>
      </div>

      <div class="pane" id="pane-faction">
        <div class="row2">
          <div class="field"><label>势力名称</label><input id="fName" value="新势力"></div>
          <div class="field"><label>敌对势力（可多选）</label><select id="fEnemies" multiple size="4" style="height:auto;"></select></div>
        </div>
        <div style="font-size:11px;color:#94a3b8;margin-bottom:12px;">按住 Ctrl / Cmd 可多选。敌对关系为双向生效。</div>
        <button class="btn btn-green" onclick="addFaction()">＋ 添加势力</button>
        <div class="list" id="factionList"></div>
      </div>
    </div>

    <div class="panel export-panel">
      <h3>📦 导出模组</h3>
      <div class="hint">勾选要包含在模组包里的内容。未勾选的不会导出。</div>
      <div class="field"><label>文件名</label><input id="exName" value="my-mod"></div>
      <div class="row2">
        <div class="field"><label>作者</label><input id="exAuthor" value="Admin"></div>
        <div class="field"><label>版本</label><input id="exVersion" value="1.0.0"></div>
      </div>
      <div class="sel-group">
        <div class="ghead"><span>武器</span><button onclick="selAll('weapons',true)">全选</button></div>
        <div class="sel-list" id="selWeapons"></div>
      </div>
      <div class="sel-group">
        <div class="ghead"><span>单位</span><button onclick="selAll('units',true)">全选</button></div>
        <div class="sel-list" id="selUnits"></div>
      </div>
      <div class="sel-group">
        <div class="ghead"><span>势力</span><button onclick="selAll('factions',true)">全选</button></div>
        <div class="sel-list" id="selFactions"></div>
      </div>
      <div class="summary" id="exSummary">已选：0 项</div>
      <button class="btn btn-gold" style="width:100%;" onclick="exportMod()">⬇ 导出 .yhdja</button>
      <button class="btn btn-ghost" style="width:100%;margin-top:8px;" onclick="clearAll()">清空全部</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var BASE_FACTIONS = { police:'政府', robber:'帮派', security:'保安公司', neutral:'中立' };
var BASE_WEAPONS = {
  pistol:{name:'手枪',mag:12,dmg:12,rate:0.35,reload:1.8,range:3,spread:0.07,speedMod:1,isSniper:false},
  responder_gun:{name:'改装手枪',mag:15,dmg:8,rate:0.15,reload:1.8,range:2.5,spread:0.2,speedMod:1,isSniper:false},
  smg:{name:'冲锋枪',mag:30,dmg:10,rate:0.08,reload:2.0,range:3.5,spread:0.15,speedMod:1,isSniper:false},
  rifle:{name:'步枪',mag:30,dmg:8,rate:0.12,reload:4.6,range:4,spread:0.25,speedMod:0.9,isSniper:false},
  sniper:{name:'狙击枪',mag:4,dmg:80,rate:1.5,reload:3.6,range:8,spread:0.01,speedMod:0.54,isSniper:true},
  gang_rifle:{name:'帮派步枪',mag:30,dmg:8,rate:0.12,reload:2.0,range:4,spread:0.2,speedMod:0.95,isSniper:false},
  military_rifle:{name:'军用步枪',mag:80,dmg:4,rate:0.1,reload:1.3,range:5,spread:0.3,speedMod:0.9,isSniper:false},
  boss_rifle:{name:'改装军用步枪',mag:100,dmg:7,rate:0.08,reload:1.2,range:6,spread:0.18,speedMod:1,isSniper:false},
  shield_item:{name:'防弹盾牌',mag:0,dmg:0,rate:0,reload:0,range:0,spread:0,speedMod:0.5,isSniper:false,isShield:true}
};

var customWeapons = {};
var customUnits = {};
var customFactions = {};
var factionNames = Object.assign({}, BASE_FACTIONS);
var selection = { weapons:{}, units:{}, factions:{} };

function toast(msg, type){
  var t = document.getElementById('toast');
  t.innerText = msg;
  t.className = 'toast show ' + (type||'');
  clearTimeout(t._tm);
  t._tm = setTimeout(function(){ t.className = 'toast'; }, 2400);
}
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

document.querySelectorAll('.tab').forEach(function(tab){
  tab.onclick = function(){
    document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
    document.querySelectorAll('.pane').forEach(function(p){ p.classList.remove('active'); });
    tab.classList.add('active');
    document.getElementById('pane-' + tab.getAttribute('data-pane')).classList.add('active');
  };
});

function addWeapon(){
  var name = document.getElementById('wName').value.trim() || '自定义武器';
  var key = 'custom_w_' + Date.now();
  var isSniper = document.getElementById('wSniper').checked;
  customWeapons[key] = {
    name: name,
    mag: parseInt(document.getElementById('wMag').value) || 20,
    dmg: parseFloat(document.getElementById('wDmg').value) || 20,
    rate: parseFloat(document.getElementById('wRate').value) || 0.2,
    reload: parseFloat(document.getElementById('wReload').value) || 1.5,
    range: parseFloat(document.getElementById('wRange').value) || 4,
    spread: parseFloat(document.getElementById('wSpread').value) || 0.1,
    speedMod: isSniper ? 0.5 : 1,
    isSniper: isSniper
  };
  selection.weapons[key] = true;
  renderAll();
  toast('武器「' + name + '」已添加', 'ok');
}
function delWeapon(k){ delete customWeapons[k]; delete selection.weapons[k]; renderAll(); }

function addUnit(){
  var name = document.getElementById('uName').value.trim() || '自定义单位';
  var key = 'custom_u_' + Date.now();
  var wKey = document.getElementById('uWeapon').value || null;
  var u = {
    name: name,
    icon: document.getElementById('uIcon').value,
    hp: parseInt(document.getElementById('uHp').value) || 50,
    armor: 0,
    speed: parseFloat(document.getElementById('uSpeed').value) || 0.4,
    r: 8,
    color: '#' + Math.floor(Math.random()*0xffffff).toString(16).padStart(6,'0'),
    team: document.getElementById('uFaction').value,
    view: parseInt(document.getElementById('uView').value) || 260,
    weaponKey: wKey,
    behavior: document.getElementById('uBehavior').value,
    author: document.getElementById('uAuthor').value.trim() || 'Anonymous'
  };
  if (wKey === 'shield_item') u.shield = true;
  customUnits[key] = u;
  selection.units[key] = true;
  renderAll();
  toast('单位「' + name + '」已添加', 'ok');
}
function delUnit(k){ delete customUnits[k]; delete selection.units[k]; renderAll(); }

function addFaction(){
  var name = document.getElementById('fName').value.trim();
  if (!name) { toast('请输入势力名称', 'err'); return; }
  var key = 'custom_f_' + Date.now();
  factionNames[key] = name;
  var sel = document.getElementById('fEnemies');
  var enemies = [];
  for (var i=0;i<sel.options.length;i++) if (sel.options[i].selected) enemies.push(sel.options[i].value);
  customFactions[key] = enemies;
  enemies.forEach(function(e){
    if (!customFactions[e]) customFactions[e] = [];
    if (customFactions[e].indexOf(key) < 0) customFactions[e].push(key);
  });
  selection.factions[key] = true;
  renderAll();
  toast('势力「' + name + '」已添加', 'ok');
}
function delFaction(k){
  delete customFactions[k]; delete factionNames[k]; delete selection.factions[k];
  for (var f in customFactions) {
    customFactions[f] = customFactions[f].filter(function(x){ return x !== k; });
  }
  renderAll();
}

function renderAll(){
  renderWeaponList();
  renderUnitList();
  renderFactionList();
  renderSelects();
  renderSelection();
}

function renderWeaponList(){
  var box = document.getElementById('weaponList');
  var keys = Object.keys(customWeapons);
  if (!keys.length) { box.innerHTML = '<div class="empty">还没有自定义武器</div>'; return; }
  box.innerHTML = keys.map(function(k){
    var w = customWeapons[k];
    return '<div class="item"><div><div class="name">' + esc(w.name) + '</div>' +
      '<div class="meta">伤害 ' + w.dmg + ' · 弹容 ' + w.mag + ' · 射速 ' + w.rate + 's · 射程 ' + w.range + 'm' + (w.isSniper?' · 狙击':'') + '</div></div>' +
      '<button class="btn btn-red btn-sm" onclick="delWeapon(\'' + k + '\')">删除</button></div>';
  }).join('');
}

function renderUnitList(){
  var box = document.getElementById('unitList');
  var keys = Object.keys(customUnits);
  if (!keys.length) { box.innerHTML = '<div class="empty">还没有自定义单位</div>'; return; }
  box.innerHTML = keys.map(function(k){
    var u = customUnits[k];
    var w = u.weaponKey ? (customWeapons[u.weaponKey] || BASE_WEAPONS[u.weaponKey]) : null;
    return '<div class="item"><div><div class="name">' + esc(u.name) + '</div>' +
      '<div class="meta">' + esc(factionNames[u.team]||u.team) + ' · 血量 ' + u.hp + ' · 速度 ' + u.speed +
      ' · ' + (w ? esc(w.name) : '无武器') + '</div></div>' +
      '<button class="btn btn-red btn-sm" onclick="delUnit(\'' + k + '\')">删除</button></div>';
  }).join('');
}

function renderFactionList(){
  var box = document.getElementById('factionList');
  var keys = Object.keys(customFactions);
  if (!keys.length) { box.innerHTML = '<div class="empty">还没有自定义势力</div>'; return; }
  box.innerHTML = keys.map(function(k){
    var enemies = (customFactions[k]||[]).map(function(e){ return factionNames[e]||e; }).join('、') || '无';
    return '<div class="item"><div><div class="name">' + esc(factionNames[k]||k) + '</div>' +
      '<div class="meta">敌对：' + esc(enemies) + '</div></div>' +
      '<button class="btn btn-red btn-sm" onclick="delFaction(\'' + k + '\')">删除</button></div>';
  }).join('');
}

function renderSelects(){
  var fSel = document.getElementById('uFaction');
  var curF = fSel.value;
  fSel.innerHTML = Object.keys(factionNames).map(function(k){
    return '<option value="' + k + '">' + esc(factionNames[k]) + '</option>';
  }).join('');
  if (curF) fSel.value = curF;

  var wSel = document.getElementById('uWeapon');
  var curW = wSel.value;
  var opts = '<option value="">无武器</option>';
  Object.keys(BASE_WEAPONS).forEach(function(k){
    opts += '<option value="' + k + '">' + esc(BASE_WEAPONS[k].name) + '</option>';
  });
  Object.keys(customWeapons).forEach(function(k){
    opts += '<option value="' + k + '">' + esc(customWeapons[k].name) + '（自定义）</option>';
  });
  wSel.innerHTML = opts;
  if (curW) wSel.value = curW;

  var eSel = document.getElementById('fEnemies');
  var curE = Array.from(eSel.selectedOptions || []).map(function(o){ return o.value; });
  eSel.innerHTML = Object.keys(factionNames).map(function(k){
    return '<option value="' + k + '">' + esc(factionNames[k]) + '</option>';
  }).join('');
  Array.from(eSel.options).forEach(function(o){ if (curE.indexOf(o.value) >= 0) o.selected = true; });
}

function renderSelection(){
  function build(cat, data, labelFn){
    var keys = Object.keys(data);
    if (!keys.length) return '<div style="font-size:10.5px;color:#64748b;padding:4px 6px;">暂无</div>';
    return keys.map(function(k){
      var ck = selection[cat][k] ? 'checked' : '';
      return '<label><input type="checkbox" ' + ck + ' onchange="toggleSel(\'' + cat + '\',\'' + k + '\',this.checked)"> ' + esc(labelFn(k)) + '</label>';
    }).join('');
  }
  document.getElementById('selWeapons').innerHTML = build('weapons', customWeapons, function(k){ return customWeapons[k].name; });
  document.getElementById('selUnits').innerHTML = build('units', customUnits, function(k){ return customUnits[k].name; });
  document.getElementById('selFactions').innerHTML = build('factions', customFactions, function(k){ return factionNames[k]||k; });

  var nw = Object.keys(selection.weapons).length;
  var nu = Object.keys(selection.units).length;
  var nf = Object.keys(selection.factions).length;
  document.getElementById('exSummary').innerText = '已选：' + (nw+nu+nf) + ' 项（武器 ' + nw + ' / 单位 ' + nu + ' / 势力 ' + nf + '）';
}

function toggleSel(cat, key, val){
  if (val) selection[cat][key] = true; else delete selection[cat][key];
  renderSelection();
}
function selAll(cat, val){
  var src = cat === 'weapons' ? customWeapons : cat === 'units' ? customUnits : customFactions;
  selection[cat] = {};
  if (val) Object.keys(src).forEach(function(k){ selection[cat][k] = true; });
  renderSelection();
}

function exportMod(){
  var selW = {}, selU = {}, selF = {};
  Object.keys(selection.weapons).forEach(function(k){ if (customWeapons[k]) selW[k] = customWeapons[k]; });
  Object.keys(selection.units).forEach(function(k){ if (customUnits[k]) selU[k] = customUnits[k]; });
  Object.keys(selection.factions).forEach(function(k){ if (customFactions[k]) selF[k] = customFactions[k]; });

  var total = Object.keys(selW).length + Object.keys(selU).length + Object.keys(selF).length;
  if (total === 0) { toast('请先勾选要导出的内容', 'err'); return; }

  var author = document.getElementById('exAuthor').value.trim() || 'Admin';
  var modVersion = document.getElementById('exVersion').value.trim() || '1.0.0';
  var fileName = document.getElementById('exName').value.trim() || 'my-mod';
  if (!/\.yhdja$/i.test(fileName)) fileName += '.yhdja';

  var modData = {
    'mods.txt': 'Author: ' + author + '\nModVersion: ' + modVersion + '\nSoftVersion: 1.0.0',
    'dy.json': selU,
    'wq.json': selW,
    'sl.json': selF
  };

  var blob = new Blob([JSON.stringify(modData, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = fileName;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1200);
  toast('导出成功：' + fileName + '（' + total + ' 项）', 'ok');
}

function clearAll(){
  if (!confirm('确定清空所有已制作的武器、单位与势力？')) return;
  customWeapons = {}; customUnits = {}; customFactions = {};
  factionNames = Object.assign({}, BASE_FACTIONS);
  selection = { weapons:{}, units:{}, factions:{} };
  renderAll();
  toast('已清空');
}

renderAll();
</script>
</body>
</html>
