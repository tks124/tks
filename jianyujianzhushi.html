<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太空杀124改版内容</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: url('background.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
        }
        .overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 1;
        }
        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 20px;
            width: 90%;
            max-width: 800px;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 40px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .btn-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 30px;
        }
        .btn {
            padding: 15px 35px;
            font-size: 1.1rem;
            text-decoration: none;
            color: #fff;
            background-size: cover;
            background-position: center;
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 50px;
            transition: all 0.3s ease;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            background-color: rgba(255,255,255,0.1);
            cursor: pointer;
        }
        .btn-new {
            background-color: rgba(255, 255, 255, 0.2);
            background-image: none;
        }
        .btn:hover {
            filter: brightness(1.2);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            border-color: #fff;
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="content">
        <h1>太空杀124改版内容</h1>
        
        <div class="btn-container">
            <a href="https://www.7723.cn/ups/2290041" class="btn btn-about">军事</a >
            <a href="https://3g.7723.cn/ups/2312994" class="btn btn-portfolio">整合</a >
            <a href="https://3g.7723.cn/ups/2262828" class="btn btn-blog">普通</a >
            <a href="https://3g.7723.cn/ups/2297704" class="btn btn-contact">微调</a >
            <a href="qita" class="btn btn-contact">其他</a >
        </div>

        <div class="btn-container">
            <a href="mailto:tks124@foxmail.com" class="btn btn-new">邮箱反馈</a >
            <a href="https://b23.tv/A4FGJGl" class="btn btn-new">biibii个人主页</a >
            <a href="SpaceKill124" class="btn btn-new">总网</a >
        </div>
    </div>

    <script>
        const AUTH_KEY = "sk124_auth_token";
        const AUTH_PAGE_URL = "https://tks124.github.io/tks/";
        
        const WHITELIST_DOMAINS = [
            'b23.tv',
            '7723.cn',
            'foxmail.com'
        ];


        function isWhitelisted(url) {
            if (url.startsWith('mailto:')) {
                return true;
            }
            try {
                const urlObj = new URL(url);
                return WHITELIST_DOMAINS.some(domain => urlObj.hostname.includes(domain));
            } catch (e) {
                return false;
            }
        }

        function navigateWithSafetyCheck(url) {
            if (isWhitelisted(url)) {
                window.location.href = url;
                return;
            }

            if (url.startsWith("https://tks124.github.io/")) {
                window.location.replace(url);
                return;
            }

            const isConfirmed = confirm("当前前往的网站并非Space Kill 124名下，注意隐私安全。");
            if (isConfirmed) {
                window.location.href = url;
            }
        }

        
        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.preventDefault(); 
                const targetUrl = this.getAttribute('href');
                if (targetUrl && targetUrl !== '#') {
                    navigateWithSafetyCheck(targetUrl);
                }
            });
        });

        window.onload = function() {
            if (localStorage.getItem(AUTH_KEY) !== "true") {
                window.location.replace(AUTH_PAGE_URL);
            }
        };
    </script>
</body>
</html>
