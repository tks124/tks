<!DOCTYPE html> <html lang="zh-CN"> <head>     <meta charset="UTF-8">     <meta name="viewport" content="width=device-width, initial-scale=1.0">     <title>注册成功</title>     <style>         * { box-sizing: border-box; }         body { font-family: 'Microsoft YaHei', sans-serif; background: #f4f4f4; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; margin: 0; padding: 30px 15px; }         .box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 520px; text-align: center; line-height: 1.6; }         h2 { color: #28a745; margin-top: 0; }         h3 { color: #d9534f; margin-bottom: 10px; }         p { font-size: 14px; color: #333; }         strong { color: #007bff; }         .note { margin-top: 20px; color: #999; font-size: 12px; border-top: 1px solid #eee; padding-top: 15px; }         input, textarea, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; margin-bottom: 10px; font-family: inherit; }         textarea { min-height: 90px; resize: vertical; }         button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; transition: all 0.2s; }         button:hover { background: #0056b3; }         button:disabled { opacity: 0.5; cursor: not-allowed; }         .btn-green { background: #28a745; }         .btn-green:hover { background: #218838; }         .btn-gray { background: #6c757d; }         .btn-gray:hover { background: #5a6268; }         .msg-status { font-size: 13px; margin-top: 6px; min-height: 18px; }          .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #eee; font-size: 13px; }         .topbar-left { color: #666; }         .topbar-left .acc { color: #007bff; font-weight: bold; }         .topbar-right button { padding: 6px 14px; font-size: 13px; margin-left: 6px; }          .messages { margin-top: 25px; text-align: left; max-height: 420px; overflow-y: auto; border-top: 1px solid #eee; padding-top: 15px; }         .message-item { background: #f9f9f9; border-left: 4px solid #ccc; padding: 12px 14px; border-radius: 8px; margin-bottom: 10px; transition: all 0.3s; }         .message-item.mine { background: linear-gradient(135deg, #e0f7ff 0%, #f0e6ff 100%); border-left: 4px solid #8b5cf6; box-shadow: 0 2px 10px rgba(139,92,246,0.15); }         .message-item.mine .message-name { color: #8b5cf6; }         .message-item.mine .message-content { color: #4c1d95; font-weight: 500; }         .message-head { display: flex; justify-content: space-between; font-size: 12px; color: #888; margin-bottom: 6px; gap: 10px; }         .message-name { color: #007bff; font-weight: bold; }         .badge-mine { background: #8b5cf6; color: white; font-size: 10px; padding: 1px 6px; border-radius: 10px; margin-left: 5px; }         .message-content { font-size: 14px; color: #333; word-break: break-word; white-space: pre-wrap; }         .empty { color: #999; font-size: 13px; text-align: center; padding: 20px 0; }          .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(4px); }         .modal-content { background: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 340px; text-align: center; }         .modal-content h3 { color: #333; margin-top: 0; margin-bottom: 20px; }         .modal-buttons { display: flex; gap: 10px; margin-top: 10px; }         .modal-buttons button { flex: 1; }         .btn-cancel { background: #ef4444; }         .btn-cancel:hover { background: #dc2626; }         .login-tabs { display: flex; gap: 8px; margin-bottom: 15px; }         .login-tab { flex: 1; padding: 8px; border: 1px solid #ddd; background: white; color: #666; border-radius: 6px; cursor: pointer; font-size: 13px; }         .login-tab.active { background: #007bff; color: white; border-color: #007bff; }         .code-row { display: flex; gap: 8px; }         .code-row input { margin-bottom: 0; text-align: center; letter-spacing: 2px; }         .code-row button { flex: 0 0 110px; font-size: 13px; padding: 0 8px; }     </style>     <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> </head> <body>     <div class="box">         <div class="topbar">             <div class="topbar-left" id="topbarLeft">未登录</div>             <div class="topbar-right" id="topbarRight">                 <button id="openLoginBtn" class="btn-green">登录</button>             </div>         </div>          <h2>🎉 注册成功！</h2>         <h3>留下你的大名和你要留下的言论</h3>         <p>我们将进行记录，以确保你是第几个被恶搞的人。</p>     <input type="text" id="msgName" placeholder="你的大名">         <textarea id="msgContent" placeholder="你要留下的言论"></textarea>         <button id="submitBtn" class="btn-green">留言</button>         <p class="msg-status" id="msgStatus"></p>          <div class="messages" id="messageList">             <div class="empty">加载留言中...</div>         </div>          <div class="note">*太空杀124注册系统</div>         <button class="btn-gray" onclick="window.location.href='https://www.spacekill124.cn/SpaceKill124'">返回首页</button>     </div>      <div id="loginModal" class="modal-overlay">         <div class="modal-content">             <h3>登录账号</h3>             <div class="login-tabs">                 <button id="tabPwd" class="login-tab active" onclick="switchTab('pwd')">密码登录</button>                 <button id="tabCode" class="login-tab" onclick="switchTab('code')">验证码登录</button>             </div>             <div id="pwdPane">                 <input type="email" id="loginEmail" placeholder="邮箱地址">                 <input type="password" id="loginPassword" placeholder="密码">             </div>             <div id="codePane" style="display:none;">                 <input type="email" id="loginCodeEmail" placeholder="邮箱地址">                 <div class="code-row">                     <input type="text" id="loginCode" placeholder="6位验证码" maxlength="6">                     <button id="sendLoginCodeBtn" class="btn-green">获取验证码</button>                 </div>             </div>             <div class="modal-buttons">                 <button class="btn-cancel" onclick="closeLogin()">取消</button>                 <button class="btn-green" onclick="doLogin()">登录</button>             </div>             <p class="msg-status" id="loginStatus"></p>         </div>     </div>  <script>     const SUPABASE_URL = "https://xryfrqxelzetzkgsaycl.supabase.co";     const SUPABASE_ANON_KEY = "sb_publishable_bV150rxd0EeojJEL53Cgwg_Lc3ZUkoU";     let supabaseClient = null;      if (window.supabase) {         supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);     }      let currentEmail = "";     let currentAccount = "";     let loginMode = "pwd";      function escapeHtml(str) {         return String(str)             .replace(/&/g, "&amp;")             .replace(/</g, "&lt;")             .replace(/>/g, "&gt;")             .replace(/"/g, "&quot;")             .replace(/'/g, "&#39;");     }      function renderTopbar() {         const left = document.getElementById("topbarLeft");         const right = document.getElementById("topbarRight");         if (currentEmail) {             left.innerHTML = '已登录: <span class="acc">' + escapeHtml(currentAccount || currentEmail) + '</span>';             right.innerHTML = '<button class="btn-gray" onclick="doLogout()">退出</button>';             document.getElementById("msgName").value = currentAccount || "";         } else {             left.textContent = "未登录（匿名留言）";             right.innerHTML = '<button id="openLoginBtn" class="btn-green" onclick="openLogin()">登录</button>';         }     }      async function checkLogin() {         if (!supabaseClient) return;         const { data: { session } } = await supabaseClient.auth.getSession();         if (session) {             currentEmail = session.user.email;             currentAccount = (session.user.user_metadata && session.user.user_metadata.account) || session.user.email;         } else {             currentEmail = "";             currentAccount = "";         }         renderTopbar();     }      function openLogin() {         document.getElementById("loginModal").style.display = "flex";         document.getElementById("loginStatus").textContent = "";     }      function closeLogin() {         document.getElementById("loginModal").style.display = "none";     }      function switchTab(mode) {         loginMode = mode;         if (mode === "pwd") {             document.getElementById("tabPwd").classList.add("active");             document.getElementById("tabCode").classList.remove("active");             document.getElementById("pwdPane").style.display = "block";             document.getElementById("codePane").style.display = "none";         } else {             document.getElementById("tabCode").classList.add("active");             document.getElementById("tabPwd").classList.remove("active");             document.getElementById("pwdPane").style.display = "none";             document.getElementById("codePane").style.display = "block";         }     }      document.getElementById("sendLoginCodeBtn").addEventListener("click", async function() {         const email = document.getElementById("loginCodeEmail").value.trim();         const status = document.getElementById("loginStatus");         if (!email) {             status.textContent = "请输入邮箱";             status.style.color = "#dc2626";             return;         }         const btn = this;         btn.disabled = true;         btn.textContent = "发送中...";         const { error } = await supabaseClient.auth.signInWithOtp({ email: email });         btn.disabled = false;         btn.textContent = "重新发送";         if (error) {             status.textContent = "发送失败: " + error.message;             status.style.color = "#dc2626";         } else {             status.textContent = "验证码已发送，请查收邮箱";             status.style.color = "#28a745";         }     });      async function doLogin() {         const status = document.getElementById("loginStatus");         status.textContent = "";         try {             if (loginMode === "pwd") {                 const email = document.getElementById("loginEmail").value.trim();                 const password = document.getElementById("loginPassword").value;                 if (!email || !password) {                     status.textContent = "请填写邮箱和密码";                     status.style.color = "#dc2626";                     return;                 }                 const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });                 if (error) {                     status.textContent = "登录失败: " + error.message;                     status.style.color = "#dc2626";                     return;                 }                 currentEmail = data.user.email;                 currentAccount = (data.user.user_metadata && data.user.user_metadata.account) || data.user.email;             } else {                 const email = document.getElementById("loginCodeEmail").value.trim();                 const token = document.getElementById("loginCode").value.trim();                 if (!email || !token || token.length !== 6) {                     status.textContent = "请输入邮箱和6位验证码";                     status.style.color = "#dc2626";                     return;                 }                 const { data, error } = await supabaseClient.auth.verifyOtp({ email, token, type: "email" });                 if (error) {                     status.textContent = "登录失败: " + error.message;                     status.style.color = "#dc2626";                     return;                 }                 currentEmail = data.user.email;                 currentAccount = (data.user.user_metadata && data.user.user_metadata.account) || data.user.email;             }             localStorage.setItem("account", currentAccount);             localStorage.setItem("email", currentEmail);             closeLogin();             renderTopbar();             await loadMessages();         } catch (err) {             status.textContent = "异常: " + err.message;             status.style.color = "#dc2626";         }     }      async function doLogout() {         await supabaseClient.auth.signOut();         currentEmail = "";         currentAccount = "";         localStorage.removeItem("account");         localStorage.removeItem("email");         renderTopbar();         await loadMessages();     }      async function loadMessages() {         const list = document.getElementById("messageList");         if (!supabaseClient) {             list.innerHTML = '<div class="empty">Supabase 未加载</div>';             return;         }         const { data, error } = await supabaseClient             .from("messages")             .select("*")             .order("created_at", { ascending: false });          if (error) {             list.innerHTML = '<div class="empty">加载失败: ' + escapeHtml(error.message) + '</div>';             return;         }         if (!data || data.length === 0) {             list.innerHTML = '<div class="empty">还没有留言，来抢沙发吧~</div>';             return;         }          list.innerHTML = data.map(function(m) {             const name = escapeHtml(m.account || "匿名");             const content = escapeHtml(m.content || "");             const time = m.created_at ? new Date(m.created_at).toLocaleString("zh-CN") : "";             const isMine = currentEmail && m.user_email && m.user_email === currentEmail;             return '<div class="message-item' + (isMine ? ' mine' : '') + '">' +                 '<div class="message-head">' +                     '<span class="message-name">' + name + (isMine ? '<span class="badge-mine">我</span>' : '') + '</span>' +                     '<span>' + escapeHtml(time) + '</span>' +                 '</div>' +                 '<div class="message-content">' + content + '</div>' +             '</div>';         }).join("");     }      document.getElementById("submitBtn").addEventListener("click", async function() {         const name = document.getElementById("msgName").value.trim();         const content = document.getElementById("msgContent").value.trim();         const status = document.getElementById("msgStatus");         const btn = this;          if (!name) {             status.textContent = "请填写你的大名！";             status.style.color = "#dc2626";             return;         }         if (!content) {             status.textContent = "请填写留言内容！";             status.style.color = "#dc2626";             return;         }          btn.disabled = true;         btn.textContent = "提交中...";         status.textContent = "";          const record = { account: name, content: content, user_email: currentEmail || null };          const { error } = await supabaseClient.from("messages").insert([record]);          btn.disabled = false;         btn.textContent = "留言";          if (error) {             status.textContent = "提交失败: " + error.message;             status.style.color = "#dc2626";             return;         }          status.textContent = "留言成功！";         status.style.color = "#28a745";         document.getElementById("msgContent").value = "";         await loadMessages();     });      window.addEventListener("DOMContentLoaded", async function() {         const savedAccount = localStorage.getItem("account");         if (savedAccount) document.getElementById("msgName").value = savedAccount;         await checkLogin();         await loadMessages();     }); </script> </body> </html>
