<!DOCTYPE html> <html lang="zh-CN"> <head>     <meta charset="UTF-8">     <meta name="viewport" content="width=device-width, initial-scale=1.0">     <title>注册成功</title>     <style>         * { box-sizing: border-box; }         body { font-family: sans-serif; background: #f4f4f4; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; margin: 0; padding: 30px 15px; }         .box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 100%; max-width: 500px; text-align: center; line-height: 1.6; }         h2 { color: #28a745; }         h3 { color: #d9534f; margin-bottom: 10px; }         p { font-size: 14px; color: #333; }         strong { color: #007bff; }         .note { margin-top: 20px; color: #999; font-size: 12px; border-top: 1px solid #eee; padding-top: 15px; }         input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; margin-bottom: 10px; font-family: inherit; }         textarea { min-height: 80px; resize: vertical; }         button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }         button:hover { background: #0056b3; }         button:disabled { opacity: 0.5; cursor: not-allowed; }         .btn-green { background: #28a745; }         .btn-green:hover { background: #218838; }         .msg-status { font-size: 13px; margin-top: 8px; min-height: 18px; }         .messages { margin-top: 25px; text-align: left; max-height: 400px; overflow-y: auto; border-top: 1px solid #eee; padding-top: 15px; }         .message-item { background: #f9f9f9; border-left: 4px solid #007bff; padding: 10px 14px; border-radius: 6px; margin-bottom: 10px; }         .message-head { display: flex; justify-content: space-between; font-size: 12px; color: #888; margin-bottom: 5px; }         .message-name { color: #007bff; font-weight: bold; }         .message-content { font-size: 14px; color: #333; word-break: break-word; }         .empty { color: #999; font-size: 13px; text-align: center; padding: 20px 0; }     </style>     <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> </head> <body>     <div class="box">         <h2>🎉 注册成功！</h2>         <h3>留下你的大名和你要留下的言论</h3>         <p>我们将进行记录，以确保你是第几个被恶搞的人。</p>         <p>当你把格式全部写完之后，请发送邮件至 <strong>tks124@foxmail.com</strong> 官方邮件进行标记。</p>          <input type="text" id="msgName" placeholder="你的大名">         <textarea id="msgContent" placeholder="你要留下的言论"></textarea>         <button id="submitBtn" class="btn-green">留言</button>         <p class="msg-status" id="msgStatus"></p>          <div class="messages" id="messageList">             <div class="empty">加载留言中...</div>         </div>          <div class="note">*太空杀124注册系统</div>         <button onclick="window.location.href='https://www.spacekill124.cn/SpaceKill124'">返回首页</button>     </div>      <script>         const SUPABASE_URL = "https://xryfrqxelzetzkgsaycl.supabase.co";         const SUPABASE_ANON_KEY = "sb_publishable_bV150rxd0EeojJEL53Cgwg_Lc3ZUkoU";         let supabaseClient = null;          if (window.supabase) {             supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);         }          function escapeHtml(str) {             return String(str)                 .replace(/&/g, "&amp;")                 .replace(/</g, "&lt;")                 .replace(/>/g, "&gt;")                 .replace(/"/g, "&quot;")                 .replace(/'/g, "&#39;");         }          async function loadMessages() {             const list = document.getElementById("messageList");             if (!supabaseClient) {                 list.innerHTML = '<div class="empty">Supabase 未加载</div>';                 return;             }             try {                 const { data, error } = await supabaseClient                     .from("messages")                     .select("*")                     .order("created_at", { ascending: false });                  if (error) {                     list.innerHTML = '<div class="empty">加载失败: ' + escapeHtml(error.message) + '</div>';                     return;                 }                  if (!data || data.length === 0) {                     list.innerHTML = '<div class="empty">还没有留言，来抢沙发吧~</div>';                     return;                 }                  list.innerHTML = data.map(function(m) {                     const name = escapeHtml(m.account || "匿名");                     const content = escapeHtml(m.content || "");                     const time = m.created_at ? new Date(m.created_at).toLocaleString("zh-CN") : "";                     return '<div class="message-item">' +                         '<div class="message-head">' +                             '<span class="message-name">' + name + '</span>' +                             '<span>' + escapeHtml(time) + '</span>' +                         '</div>' +                         '<div class="message-content">' + content + '</div>' +                     '</div>';                 }).join("");             } catch (err) {                 list.innerHTML = '<div class="empty">异常: ' + escapeHtml(err.message) + '</div>';             }         }          document.getElementById("submitBtn").addEventListener("click", async function() {             const name = document.getElementById("msgName").value.trim();             const content = document.getElementById("msgContent").value.trim();             const status = document.getElementById("msgStatus");             const btn = document.getElementById("submitBtn");              if (!name) {                 status.textContent = "请填写你的大名！";                 status.style.color = "#d9534f";                 return;             }             if (!content) {                 status.textContent = "请填写留言内容！";                 status.style.color = "#d9534f";                 return;             }              btn.disabled = true;             btn.textContent = "提交中...";             status.textContent = "";              try {                 const { error } = await supabaseClient                     .from("messages")                     .insert([{ account: name, content: content }]);                  if (error) {                     status.textContent = "提交失败: " + error.message;                     status.style.color = "#d9534f";                     btn.disabled = false;                     btn.textContent = "留言";                     return;                 }                  status.textContent = "留言成功！";                 status.style.color = "#28a745";                 document.getElementById("msgContent").value = "";                 btn.disabled = false;                 btn.textContent = "留言";                 await loadMessages();             } catch (err) {                 status.textContent = "异常: " + err.message;                 status.style.color = "#d9534f";                 btn.disabled = false;                 btn.textContent = "留言";             }         });          window.addEventListener("DOMContentLoaded", function() {             const savedAccount = localStorage.getItem("account");             if (savedAccount) {                 document.getElementById("msgName").value = savedAccount;             }             loadMessages();         });     </script> </body> </html>
