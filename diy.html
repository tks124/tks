<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>太空杀124-DIY收集站</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#f5f7fb;--card:#ffffff;--text:#111418;--muted:#6b7280;--line:rgba(17,20,24,.09);--primary:#0a6cff;--primary2:#4a9bff;--shadow:0 6px 20px rgba(16,32,64,.08);--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);}
body.dark{--bg:#0f1115;--card:#181b21;--text:#eceff4;--muted:#98a2b3;--line:rgba(255,255,255,.1);--shadow:0 6px 22px rgba(0,0,0,.45);}
html{scroll-behavior:smooth;}
html,body{width:100%;}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s;}
body.locked{overflow:hidden;}
#topBar{position:fixed;top:0;left:0;right:0;z-index:1000;background:var(--card);border-bottom:1px solid var(--line);padding:calc(8px + var(--sat)) 14px 8px;display:flex;justify-content:space-between;align-items:center;}
#topBar .brand{font-size:15px;font-weight:bold;color:var(--primary);}
#topBar .user{font-size:13px;color:var(--muted);}
#topBar .user span{color:var(--primary);font-weight:bold;}
#progressBar{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,#0a6cff,#4a9bff);z-index:2000;transition:width .3s;}
#menuBtn{position:fixed;top:calc(56px + var(--sat));left:14px;z-index:1200;width:42px;height:42px;border:none;border-radius:12px;background:linear-gradient(140deg,var(--primary),var(--primary2));color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(10,108,255,.35);}
#menuBtn:active{transform:scale(.94);}
#sidebar{position:fixed;top:0;left:0;width:min(280px,82vw);height:100vh;background:linear-gradient(170deg,#0a6cff,#0a3fa8 90%);color:#fff;z-index:1300;padding:calc(28px + var(--sat)) 18px calc(28px + var(--sab));display:flex;flex-direction:column;gap:12px;overflow-y:auto;transform:translateX(-104%);transition:transform .34s cubic-bezier(.22,.75,.3,1);}
#sidebar.open{transform:translateX(0);}
#sidebar h2{font-size:18px;font-weight:600;letter-spacing:2px;margin:4px 6px 12px;}
.side-btn{width:100%;padding:14px 16px;border:none;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;font-size:15px;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
.side-btn:hover{background:rgba(255,255,255,.28);}
.switch{width:44px;height:24px;border-radius:12px;flex:none;background:rgba(255,255,255,.3);position:relative;transition:background .25s;}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .25s;}
.switch.on{background:#39d353;}
.switch.on::after{left:23px;}
#overlay{position:fixed;inset:0;z-index:1250;background:rgba(6,14,30,.42);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;}
#overlay.show{opacity:1;visibility:visible;}
.page{display:none;padding:calc(112px + var(--sat)) calc(20px + var(--sar)) calc(56px + var(--sab)) calc(20px + var(--sal));max-width:900px;margin:0 auto;}
.page.active{display:block;animation:pageIn .4s cubic-bezier(.22,.75,.3,1);}
@keyframes pageIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
h1{font-size:22px;font-weight:700;margin-bottom:8px;}
h2{font-size:18px;font-weight:600;margin-bottom:12px;}
.sub{font-size:14px;color:var(--muted);margin-bottom:22px;}
.big-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;max-width:440px;padding:17px 22px;margin-bottom:14px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;font-size:16px;font-weight:500;cursor:pointer;box-shadow:0 8px 20px rgba(10,108,255,.26);}
.big-btn:hover{transform:translateY(-2px);}
.big-btn:active{transform:scale(.98);}
.back-btn{padding:9px 16px;margin-bottom:22px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font-size:14px;cursor:pointer;box-shadow:var(--shadow);}
.input-box{width:100%;padding:14px 16px;margin-bottom:14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font-size:15px;font-family:inherit;}
.input-box:focus{outline:none;border-color:var(--primary);}
textarea.input-box{min-height:140px;resize:vertical;}
.file-row{display:flex;gap:10px;margin-bottom:14px;}
.file-row button{flex:1;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font-size:14px;cursor:pointer;}
.grid-list{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:520px){.grid-list{grid-template-columns:1fr;}}
.diy-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);position:relative;}
.diy-card img{width:100%;border-radius:10px;margin-bottom:10px;display:block;max-height:320px;object-fit:cover;}
.diy-card .d-title{font-size:15px;font-weight:bold;margin-bottom:4px;word-break:break-word;}
.diy-card .d-game{font-size:12px;color:var(--primary);margin-bottom:6px;}
.diy-card .d-time{font-size:11px;color:var(--muted);}
.diy-card .d-text{font-size:13px;color:var(--text);line-height:1.6;max-height:180px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;background:var(--bg);padding:10px;border-radius:8px;margin-top:8px;}
.diy-card .d-tag{display:inline-block;padding:2px 8px;border-radius:8px;font-size:11px;margin-left:6px;}
.tag-official{background:#fef3c7;color:#92400e;}
.tag-pinned{background:#fee2e2;color:#991b1b;}
body.dark .tag-official{background:#78350f;color:#fde68a;}
body.dark .tag-pinned{background:#7f1d1d;color:#fecaca;}
.diy-card .d-menu{position:absolute;right:10px;bottom:10px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.06);border:none;cursor:pointer;font-size:16px;display:none;}
body.dark .diy-card .d-menu{background:rgba(255,255,255,.1);color:#fff;}
body.admin .diy-card .d-menu{display:flex;align-items:center;justify-content:center;}
.game-row{display:flex;justify-content:space-between;align-items:center;width:100%;padding:16px 18px;margin-bottom:12px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);font-size:16px;cursor:pointer;box-shadow:var(--shadow);}
.game-row:hover{transform:translateX(6px);border-color:rgba(10,108,255,.5);}
.game-row .arr{color:var(--muted);font-size:18px;}
#addGameBtn{position:fixed;top:calc(56px + var(--sat));right:14px;z-index:1200;width:42px;height:42px;border-radius:50%;background:linear-gradient(140deg,#10b981,#059669);color:#fff;border:none;font-size:22px;font-weight:bold;cursor:pointer;box-shadow:0 6px 16px rgba(16,185,129,.4);display:none;}
body.admin #addGameBtn{display:flex;align-items:center;justify-content:center;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1500;justify-content:center;align-items:center;padding:20px;}
.modal-overlay.show{display:flex;}
.modal-content{background:var(--card);border-radius:14px;padding:24px;width:100%;max-width:340px;color:var(--text);}
.modal-content h3{font-size:17px;margin-bottom:16px;text-align:center;}
.modal-content input,.modal-content textarea{width:100%;padding:12px;margin-bottom:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font-size:14px;font-family:inherit;}
.modal-content textarea{min-height:90px;resize:vertical;}
.modal-buttons{display:flex;gap:10px;}
.modal-buttons button{flex:1;padding:11px;border:none;border-radius:10px;font-size:14px;cursor:pointer;font-weight:bold;color:#fff;}
.btn-cancel{background:#64748b;}
.btn-confirm{background:#10b981;}
.btn-danger{background:#ef4444;}
.btn-warn{background:#f59e0b;}
.admin-menu{position:fixed;inset:0;z-index:1600;background:rgba(0,0,0,.7);display:none;justify-content:center;align-items:center;}
.admin-menu.show{display:flex;}
.admin-menu-box{background:var(--card);border-radius:14px;padding:20px;width:100%;max-width:280px;}
.admin-menu-box button{width:100%;padding:14px;margin-bottom:10px;border:none;border-radius:10px;background:var(--bg);color:var(--text);font-size:15px;cursor:pointer;text-align:left;}
.admin-menu-box button:last-child{margin-bottom:0;}
.review-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);}
.review-card img{width:100%;border-radius:10px;margin:10px 0;}
.review-card .r-info{font-size:13px;color:var(--muted);margin-bottom:6px;}
.review-card .r-title{font-size:16px;font-weight:bold;margin-bottom:6px;}
.review-card .r-text{font-size:13px;color:var(--text);line-height:1.6;max-height:200px;overflow-y:auto;white-space:pre-wrap;padding:10px;background:var(--bg);border-radius:8px;margin:10px 0;}
.review-card .r-actions{display:flex;gap:8px;margin-top:10px;}
.review-card .r-actions button{flex:1;padding:10px;border:none;border-radius:8px;font-size:13px;font-weight:bold;color:#fff;cursor:pointer;}
.empty{text-align:center;color:var(--muted);padding:40px 0;font-size:14px;}
#searchBox{width:100%;padding:12px 16px;margin-bottom:16px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font-size:14px;}
#toast{position:fixed;left:50%;bottom:calc(60px + var(--sab));transform:translate(-50%,20px);max-width:80vw;background:rgba(18,22,30,.92);color:#fff;padding:12px 22px;border-radius:12px;font-size:14px;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:2700;}
#toast.show{opacity:1;transform:translate(-50%,0);}
#loadingModal{position:fixed;inset:0;z-index:2600;display:flex;align-items:center;justify-content:center;background:rgba(6,14,30,.5);backdrop-filter:blur(4px);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s;}
#loadingModal.show{opacity:1;visibility:visible;}
.loading-card{background:var(--card);padding:24px;border-radius:18px;width:320px;max-width:86vw;text-align:center;color:var(--text);}
.loading-label{font-size:15px;margin-bottom:16px;}
.loading-track{height:7px;border-radius:99px;background:rgba(10,108,255,.14);overflow:hidden;}
.loading-fill{height:100%;width:0;background:linear-gradient(90deg,#0a6cff,#4a9bff);transition:width .2s;}
.loading-pct{margin-top:10px;font-size:12px;color:var(--muted);}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="progressBar"></div>

<div id="topBar">
  <div class="brand">DIY 收集站</div>
  <div class="user" id="userDisplay">加载中...</div>
</div>

<button id="menuBtn">☰</button>
<button id="addGameBtn" title="添加新游戏">+</button>

<div id="sidebar">
  <h2>菜单</h2>
  <button class="side-btn" onclick="goPage('page-home')">主页</button>
  <button class="side-btn" onclick="goPublic()">已公开的DIY</button>
  <button class="side-btn" onclick="goUpload()">上传DIY</button>
  <button class="side-btn" id="themeBtn"><span>夜间模式</span><span class="switch" id="switchEl"></span></button>
  <button class="side-btn" id="reviewBtn" style="display:none;" onclick="goReview()">审核</button>
</div>

<div id="overlay"></div>

<div class="page active" id="page-home">
  <h1>DIY 收集站</h1>
  <p class="sub">欢迎来到太空杀124 DIY合集</p>
  <button class="big-btn" onclick="window.location.href='SpaceKill124'">返回主站</button>
  <button class="big-btn" onclick="goUpload()">上传DIY</button>
  <button class="big-btn" onclick="goPublic()">已公开的DIY</button>
</div>

<div class="page" id="page-upload">
  <button class="back-btn" onclick="goPage('page-home')">← 返回</button>
  <h1>上传 DIY</h1>
  <input class="input-box" id="upName" placeholder="DIY 名称">
  <input class="input-box" id="upGame" placeholder="所属游戏/分类" list="gameList">
  <datalist id="gameList"></datalist>
  <div class="file-row">
    <button id="pickImgBtn">选择图片</button>
    <button id="pickTxtBtn">选择 TXT</button>
  </div>
  <input type="file" id="imgInput" accept="image/*" style="display:none;">
  <input type="file" id="txtInput" accept=".txt,text/plain" style="display:none;">
  <textarea class="input-box" id="upText" placeholder="文字内容（选择TXT会自动填充到这里）"></textarea>
  <button class="big-btn" id="submitUpload">提交上传</button>
</div>

<div class="page" id="page-public">
  <button class="back-btn" onclick="goPage('page-home')">← 返回</button>
  <h1>已公开的 DIY</h1>
  <p class="sub">选择一个分类查看</p>
  <div id="gameListBox"></div>
</div>

<div class="page" id="page-game">
  <button class="back-btn" onclick="goPublic()">← 返回</button>
  <h1 id="gameTitle"></h1>
  <input id="searchBox" placeholder="模糊搜索 DIY 名称或内容...">
  <div class="grid-list" id="diyGrid"></div>
</div>

<div class="page" id="page-review">
  <button class="back-btn" onclick="goPage('page-home')">← 返回</button>
  <h1>审核</h1>
  <div class="grid-list" id="reviewGrid"></div>
</div>

<div class="modal-overlay" id="addGameModal">
  <div class="modal-content">
    <h3>添加新游戏/分类</h3>
    <input id="newGameName" placeholder="输入名称">
    <div class="modal-buttons">
      <button class="btn-cancel" onclick="closeModal('addGameModal')">取消</button>
      <button class="btn-confirm" onclick="createGame()">确定</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="reasonModal">
  <div class="modal-content">
    <h3 id="reasonTitle">请输入理由</h3>
    <textarea id="reasonInput" placeholder="请填写理由..."></textarea>
    <div class="modal-buttons">
      <button class="btn-cancel" onclick="closeModal('reasonModal')">取消</button>
      <button class="btn-confirm" id="reasonConfirmBtn">确定</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="alertModal">
  <div class="modal-content">
    <h3 id="alertTitle">提示</h3>
    <p id="alertBody" style="font-size:14px;line-height:1.6;margin-bottom:16px;"></p>
    <button class="btn-confirm" style="width:100%;" id="alertOkBtn">我知道了</button>
  </div>
</div>

<div class="admin-menu" id="adminMenu">
  <div class="admin-menu-box">
    <button onclick="adminRemove()">下架/修改内容</button>
    <button onclick="adminPin()">置顶/取消置顶</button>
    <button onclick="adminOfficial()">标记/取消官方推荐</button>
    <button onclick="closeAdminMenu()" style="text-align:center;color:#ef4444;">取消</button>
  </div>
</div>

<div id="loadingModal">
  <div class="loading-card">
    <div class="loading-label" id="loadingLabel">加载中…</div>
    <div class="loading-track"><div class="loading-fill" id="loadingFill"></div></div>
    <div class="loading-pct" id="loadingPct">0%</div>
  </div>
</div>

<div id="toast"></div>

<script>
const SUPABASE_URL = "https://xryfrqxelzetzkgsaycl.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_bV150rxd0EeojJEL53Cgwg_Lc3ZUkoU";
const ADMIN_EMAIL = "qwe18965540810@qq.com";
let supabaseClient = null;
if (window.supabase) supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let myEmail = "";
let myUid = null;
let isAdmin = false;
let currentGame = "";
let currentGameItems = [];
let currentAdminItemId = null;
let pendingReasonAction = null;

function $(id){return document.getElementById(id);}
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmtTime(t){if(!t)return"";return new Date(t).toLocaleString("zh-CN");}
function toast(msg){const el=$("toast");el.textContent=msg;el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),2000);}

function showLoading(label){
  $("loadingLabel").textContent = label || "加载中…";
  $("loadingFill").style.width = "0%";
  $("loadingPct").textContent = "0%";
  $("loadingModal").classList.add("show");
  let v = 0;
  const timer = setInterval(()=>{
    v += Math.random()*8 + 4;
    if(v >= 90){v = 90;clearInterval(timer);}
    $("loadingFill").style.width = v + "%";
    $("loadingPct").textContent = Math.round(v) + "%";
  }, 120);
  $("loadingModal")._timer = timer;
}
function hideLoading(){
  clearInterval($("loadingModal")._timer);
  $("loadingFill").style.width = "100%";
  $("loadingPct").textContent = "100%";
  setTimeout(()=>$("loadingModal").classList.remove("show"), 200);
}

function updateProgressBar(){
  const h = document.documentElement.scrollHeight;
  const wh = window.innerHeight;
  const pct = h > wh ? (window.scrollY / (h - wh)) * 100 : 0;
  $("progressBar").style.width = Math.min(100, Math.max(0, pct)) + "%";
}
window.addEventListener("scroll", updateProgressBar, {passive:true});
window.addEventListener("resize", updateProgressBar);

function goPage(id){
  document.querySelectorAll(".page").forEach(p => p.classList.toggle("active", p.id === id));
  window.scrollTo(0,0);
  closeSidebar();
}
function openSidebar(){$("sidebar").classList.add("open");$("overlay").classList.add("show");}
function closeSidebar(){$("sidebar").classList.remove("open");$("overlay").classList.remove("show");}
$("menuBtn").addEventListener("click", e=>{e.stopPropagation();openSidebar();});
$("overlay").addEventListener("click", closeSidebar);

document.getElementById("themeBtn").addEventListener("click", ()=>{
  const dark = !document.body.classList.contains("dark");
  document.body.classList.toggle("dark", dark);
  $("switchEl").classList.toggle("on", dark);
  localStorage.setItem("diy_dark", dark ? "1" : "0");
});

function openModal(id){$(id).classList.add("show");}
function closeModal(id){$(id).classList.remove("show");}
$("alertOkBtn").addEventListener("click", ()=>closeModal("alertModal"));

async function init(){
  if(!supabaseClient){$("userDisplay").textContent = "未加载";return;}
  const {data:{session}} = await supabaseClient.auth.getSession();
  if(session && session.user){
    myEmail = session.user.email;
    const {data:profile} = await supabaseClient.from("profiles").select("uid,account").eq("email", myEmail).maybeSingle();
    if(profile){myUid = profile.uid;}
    $("userDisplay").innerHTML = "已登录: <span>" + escapeHtml((profile && profile.account) || myEmail) + "</span>";
    isAdmin = (myEmail === ADMIN_EMAIL);
  }else{
    $("userDisplay").textContent = "未登录";
    isAdmin = false;
  }
  if(isAdmin){
    document.body.classList.add("admin");
    $("reviewBtn").style.display = "flex";
  }
  const darkSaved = localStorage.getItem("diy_dark") === "1";
  if(darkSaved){
    document.body.classList.add("dark");
    $("switchEl").classList.add("on");
  }
  await checkNotifications();
  await loadGameList();
}
window.addEventListener("DOMContentLoaded", init);

async function checkNotifications(){
  if(!myEmail)return;
  const {data} = await supabaseClient.from("diy_notifications").select("*").eq("user_email", myEmail).eq("read", false).order("created_at", {ascending:false}).limit(1);
  if(!data || data.length === 0)return;
  const n = data[0];
  showAlert("你的DIY审核结果", 
    "你的 DIY「" + (n.name || "") + "」状态：" + (n.status === "rejected" ? "未过审" : "需要修改") + "\n\n理由：" + (n.reason || "无") + "\n\n点击确定后，将自动打开上传页面并保留你之前填写的内容。",
    () => {
      $("upName").value = n.name || "";
      $("upGame").value = n.game || "";
      $("upText").value = n.text_content || "";
      goPage("page-upload");
      supabaseClient.from("diy_notifications").update({read:true}).eq("id", n.id);
      if(n.diy_id){
        supabaseClient.from("diy").delete().eq("id", n.diy_id);
      }
    });
}

function showAlert(title, body, onOk){
  $("alertTitle").textContent = title;
  $("alertBody").textContent = body;
  $("alertModal").classList.add("show");
  const btn = $("alertOkBtn");
  const clone = btn.cloneNode(true);
  btn.parentNode.replaceChild(clone, btn);
  clone.addEventListener("click", () => {
    closeModal("alertModal");
    if(onOk)onOk();
  });
}

async function loadGameList(){
  const {data} = await supabaseClient.from("diy_games").select("*").order("created_at", {ascending:true});
  const games = data || [];
  const dl = $("gameList");
  dl.innerHTML = games.map(g => '<option value="' + escapeHtml(g.name) + '">').join("");
  const box = $("gameListBox");
  if(games.length === 0){
    box.innerHTML = '<div class="empty">还没有分类，请先由管理员添加</div>';
    return;
  }
  box.innerHTML = games.map(g => 
    '<button class="game-row" data-game="' + escapeHtml(g.name) + '">' +
    '<span>' + escapeHtml(g.name) + '</span><span class="arr">›</span></button>'
  ).join("");
  box.querySelectorAll(".game-row").forEach(btn => {
    btn.addEventListener("click", () => openGame(btn.dataset.game));
  });
}

function goPublic(){
  goPage("page-public");
  loadGameList();
}

function goUpload(){
  goPage("page-upload");
}

function goReview(){
  goPage("page-review");
  loadReview();
}

$("addGameBtn").addEventListener("click", () => {
  $("newGameName").value = "";
  openModal("addGameModal");
});

async function createGame(){
  const name = $("newGameName").value.trim();
  if(!name){toast("请输入名称");return;}
  const {error} = await supabaseClient.from("diy_games").insert([{name:name}]);
  if(error){toast("失败: " + error.message);return;}
  closeModal("addGameModal");
  await loadGameList();
  toast("已添加");
}

async function openGame(game){
  currentGame = game;
  $("gameTitle").textContent = game;
  $("searchBox").value = "";
  goPage("page-game");
  await loadGameItems(game, "");
}

$("searchBox").addEventListener("input", () => {
  loadGameItems(currentGame, $("searchBox").value.trim());
});

async function loadGameItems(game, keyword){
  showLoading("加载中...");
  const {data, error} = await supabaseClient.from("diy").select("*").eq("game", game).eq("status", "approved").order("is_pinned", {ascending:false}).order("created_at", {ascending:false});
  hideLoading();
  if(error){$("diyGrid").innerHTML = '<div class="empty">加载失败</div>';return;}
  let items = data || [];
  if(keyword){
    const kw = keyword.toLowerCase();
    items = items.filter(i =>
      (i.name || "").toLowerCase().includes(kw) ||
      (i.text_content || "").toLowerCase().includes(kw)
    );
  }
  currentGameItems = items;
  renderGameItems(items);
}

function renderGameItems(items){
  const grid = $("diyGrid");
  if(items.length === 0){
    grid.innerHTML = '<div class="empty">还没有 DIY 内容</div>';
    return;
  }
  grid.innerHTML = items.map(item => {
    const tags = 
      (item.is_pinned ? '<span class="d-tag tag-pinned">置顶</span>' : '') +
      (item.is_official ? '<span class="d-tag tag-official">官方推荐</span>' : '');
    const img = item.image_url ? '<img src="' + escapeHtml(item.image_url) + '">' : "";
    const txt = (!item.image_url && item.text_content) ? '<div class="d-text">' + escapeHtml(item.text_content) + '</div>' : "";
    return '<div class="diy-card">' +
      '<div class="d-title">' + escapeHtml(item.name) + tags + '</div>' +
      '<div class="d-game">' + escapeHtml(item.game) + '</div>' +
      img + txt +
      '<div class="d-time">' + fmtTime(item.created_at) + '</div>' +
      '<button class="d-menu" data-id="' + item.id + '">⋮</button>' +
    '</div>';
  }).join("");
  grid.querySelectorAll(".d-menu").forEach(btn => {
    btn.addEventListener("click", e => {
      e.stopPropagation();
      currentAdminItemId = parseInt(btn.dataset.id);
      $("adminMenu").classList.add("show");
    });
  });
}

function closeAdminMenu(){
  $("adminMenu").classList.remove("show");
  currentAdminItemId = null;
}
$("adminMenu").addEventListener("click", e => {
  if(e.target === $("adminMenu"))closeAdminMenu();
});

async function adminRemove(){
  if(!currentAdminItemId){closeAdminMenu();return;}
  const ok = confirm("确定下架这条内容吗？");
  if(!ok){closeAdminMenu();return;}
  const {error} = await supabaseClient.from("diy").delete().eq("id", currentAdminItemId);
  closeAdminMenu();
  if(error){toast("失败: " + error.message);return;}
  toast("已下架");
  loadGameItems(currentGame, $("searchBox").value.trim());
}

async function adminPin(){
  if(!currentAdminItemId){closeAdminMenu();return;}
  const item = currentGameItems.find(i => i.id === currentAdminItemId);
  if(!item){closeAdminMenu();return;}
  const {error} = await supabaseClient.from("diy").update({is_pinned: !item.is_pinned}).eq("id", currentAdminItemId);
  closeAdminMenu();
  if(error){toast("失败: " + error.message);return;}
  toast(item.is_pinned ? "已取消置顶" : "已置顶");
  loadGameItems(currentGame, $("searchBox").value.trim());
}

async function adminOfficial(){
  if(!currentAdminItemId){closeAdminMenu();return;}
  const item = currentGameItems.find(i => i.id === currentAdminItemId);
  if(!item){closeAdminMenu();return;}
  const {error} = await supabaseClient.from("diy").update({is_official: !item.is_official}).eq("id", currentAdminItemId);
  closeAdminMenu();
  if(error){toast("失败: " + error.message);return;}
  toast(item.is_official ? "已取消官方推荐" : "已标记为官方推荐");
  loadGameItems(currentGame, $("searchBox").value.trim());
}

$("pickImgBtn").addEventListener("click", ()=>$("imgInput").click());
$("pickTxtBtn").addEventListener("click", ()=>$("txtInput").click());

$("imgInput").addEventListener("change", function(){
  const f = this.files[0];
  if(!f)return;
  $("upText").value = "";
});

$("txtInput").addEventListener("change", function(){
  const f = this.files[0];
  if(!f)return;
  const reader = new FileReader();
  reader.onload = e => {
    $("upText").value = e.target.result;
  };
  reader.readAsText(f);
});

$("submitUpload").addEventListener("click", async () => {
  if(!myEmail){toast("请先返回主站登录");return;}
  const name = $("upName").value.trim();
  const game = $("upGame").value.trim();
  const imgFile = $("imgInput").files[0];
  const textContent = $("upText").value.trim();
  if(!name){toast("请输入DIY名称");return;}
  if(!game){toast("请输入所属游戏/分类");return;}
  if(!imgFile && !textContent){toast("请上传图片或填写文字内容");return;}

  showLoading("上传中...");

  let imageUrl = "";
  if(imgFile){
    const fileName = Date.now() + "_" + imgFile.name;
    const up = await supabaseClient.storage.from("diy").upload(fileName, imgFile);
    if(up.error){
      hideLoading();
      toast("图片上传失败: " + up.error.message);
      return;
    }
    const pub = supabaseClient.storage.from("diy").getPublicUrl(fileName);
    imageUrl = pub.data.publicUrl;
  }

  const {error} = await supabaseClient.from("diy").insert([{
    name: name,
    game: game,
    content_type: imgFile ? "image" : "txt",
    image_url: imageUrl,
    text_content: textContent,
    uploader_email: myEmail,
    uploader_uid: myUid,
    status: "pending"
  }]);
  hideLoading();
  if(error){toast("提交失败: " + error.message);return;}

  $("upName").value = "";
  $("upGame").value = "";
  $("upText").value = "";
  $("imgInput").value = "";
  $("txtInput").value = "";
  showAlert("已上传", "已上传，请等待审核。", () => goPage("page-home"));
});

async function loadReview(){
  showLoading("加载审核列表...");
  const {data, error} = await supabaseClient.from("diy").select("*").eq("status", "pending").order("created_at", {ascending:true});
  hideLoading();
  const grid = $("reviewGrid");
  if(error){grid.innerHTML = '<div class="empty">加载失败</div>';return;}
  if(!data || data.length === 0){grid.innerHTML = '<div class="empty">暂无待审核内容</div>';return;}
  grid.innerHTML = data.map(item => {
    const img = item.image_url ? '<img src="' + escapeHtml(item.image_url) + '">' : "";
    const txt = (!item.image_url && item.text_content) ? '<div class="r-text">' + escapeHtml(item.text_content) + '</div>' : "";
    return '<div class="review-card">' +
      '<div class="r-title">' + escapeHtml(item.name) + '</div>' +
      '<div class="r-info">分类: ' + escapeHtml(item.game) + '</div>' +
      '<div class="r-info">上传者: ' + escapeHtml(item.uploader_email || "未知") + '</div>' +
      '<div class="r-info">时间: ' + fmtTime(item.created_at) + '</div>' +
      img + txt +
      '<div class="r-actions">' +
        '<button style="background:#10b981;" data-id="' + item.id + '" data-act="approve">过审</button>' +
        '<button style="background:#f59e0b;" data-id="' + item.id + '" data-act="edit">待修改</button>' +
        '<button style="background:#ef4444;" data-id="' + item.id + '" data-act="reject">不过审</button>' +
      '</div>' +
    '</div>';
  }).join("");
  grid.querySelectorAll("button[data-act]").forEach(btn => {
    btn.addEventListener("click", () => handleReview(parseInt(btn.dataset.id), btn.dataset.act));
  });
}

function handleReview(id, act){
  if(act === "approve"){
    approveItem(id);
  }else{
    openReasonModal(id, act);
  }
}

async function approveItem(id){
  const {data, error: findErr} = await supabaseClient.from("diy").select("*").eq("id", id).maybeSingle();
  if(findErr || !data){toast("找不到该内容");return;}
  const {error} = await supabaseClient.from("diy").update({status: "approved"}).eq("id", id);
  if(error){toast("失败: " + error.message);return;}
  toast("已过审");
  loadReview();
}

function openReasonModal(id, act){
  pendingReasonAction = {id: id, act: act};
  $("reasonTitle").textContent = act === "edit" ? "待修改理由" : "不过审理由";
  $("reasonInput").value = "";
  openModal("reasonModal");
}

$("reasonConfirmBtn").addEventListener("click", async () => {
  const reason = $("reasonInput").value.trim();
  if(!reason){toast("请填写理由");return;}
  if(!pendingReasonAction)return;
  const {id, act} = pendingReasonAction;
  const {data} = await supabaseClient.from("diy").select("*").eq("id", id).maybeSingle();
  if(!data){toast("找不到该内容");closeModal("reasonModal");return;}
  const newStatus = act === "edit" ? "needs_edit" : "rejected";
  await supabaseClient.from("diy").update({status: newStatus, reject_reason: reason}).eq("id", id);
  await supabaseClient.from("diy_notifications").insert([{
    user_email: data.uploader_email,
    diy_id: id,
    name: data.name,
    game: data.game,
    content_type: data.content_type,
    image_url: data.image_url,
    text_content: data.text_content,
    status: newStatus,
    reason: reason
  }]);
  closeModal("reasonModal");
  pendingReasonAction = null;
  toast(act === "edit" ? "已通知用户修改" : "已通知用户不过审");
  loadReview();
});
</script>
