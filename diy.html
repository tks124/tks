<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>太空杀124-DIY收集站</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#f5f7fb;--card:#ffffff;--text:#111418;--muted:#6b7280;--line:rgba(17,20,24,.09);--primary:#0a6cff;--primary2:#4a9bff;--shadow:0 6px 20px rgba(16,32,64,.08);--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);}
body.dark{--bg:#0f1115;--card:#181b21;--text:#eceff4;--muted:#98a2b3;--line:rgba(255,255,255,.1);--shadow:0 6px 22px rgba(0,0,0,.45);}
html{scroll-behavior:smooth;}html,body{width:100%;}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s;}
body.locked{overflow:hidden;}
#topBar{position:fixed;top:0;left:0;right:0;z-index:1000;background:var(--card);border-bottom:1px solid var(--line);padding:calc(8px + var(--sat)) 14px 8px;display:flex;justify-content:space-between;align-items:center;}
#topBar .brand{font-size:15px;font-weight:bold;color:var(--primary);}
#topBar .user{font-size:13px;color:var(--muted);}
#topBar .user span{color:var(--primary);font-weight:bold;}
#progressBar{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,#0a6cff,#4a9bff);z-index:2000;transition:width .3s;}
#menuBtn{position:fixed;top:calc(56px + var(--sat));left:14px;z-index:1200;width:42px;height:42px;border:none;border-radius:12px;background:linear-gradient(140deg,var(--primary),var(--primary2));color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(10,108,255,.35);}
#menuBtn:active{transform:scale(.94);}
#sidebar{position:fixed;top:0;left:0;width:min(280px,82vw);height:100vh;background:linear-gradient(170deg,#0a6cff,#0a3fa8 90%);color:#fff;z-index:1300;padding:calc(28px + var(--sat)) 18px calc(28px + var(--sab));display:flex;flex-direction:column;gap:12px;overflow-y:auto;transform:translateX(-104%);transition:transform .34s cubic-bezier(.22,.75,.3,1);}
#sidebar.open{transform:translateX(0);}
#sidebar h2{font-size:18px;font-weight:600;letter-spacing:2px;margin:4px 6px 12px;}
.side-btn{width:100%;padding:14px 16px;border:none;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;font-size:15px;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
.side-btn:hover{background:rgba(255,255,255,.28);}
.switch{width:44px;height:24px;border-radius:12px;flex:none;background:rgba(255,255,255,.3);position:relative;transition:background .25s;}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .25s;}
.switch.on{background:#39d353;}
.switch.on::after{left:23px;}
#overlay{position:fixed;inset:0;z-index:1250;background:rgba(6,14,30,.42);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;}
#overlay.show{opacity:1;visibility:visible;}
.page{display:none;padding:calc(112px + var(--sat)) calc(20px + var(--sar)) calc(56px + var(--sab)) calc(20px + var(--sal));max-width:900px;margin:0 auto;}
.page.active{display:block;animation:pageIn .4s cubic-bezier(.22,.75,.3,1);}
@keyframes pageIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
h1{font-size:22px;font-weight:700;margin-bottom:8px;}
.sub{font-size:14px;color:var(--muted);margin-bottom:22px;}
.big-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;max-width:440px;padding:17px 22px;margin-bottom:14px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;font-size:16px;font-weight:500;cursor:pointer;box-shadow:0 8px 20px rgba(10,108,255,.26);}
.big-btn:hover{transform:translateY(-2px);}
.big-btn:active{transform:scale(.98);}
.back-btn{padding:9px 16px;margin-bottom:22px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font-size:14px;cursor:pointer;box-shadow:var(--shadow);}
.input-box{width:100%;padding:14px 16px;margin-bottom:14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font-size:15px;font-family:inherit;}
.input-box:focus{outline:none;border-color:var(--primary);}
textarea.input-box{min-height:140px;resize:vertical;}
.file-row{display:flex;gap:10px;margin-bottom:14px;}
.file-row button{flex:1;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font-size:14px;cursor:pointer;}
.grid-list{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:520px){.grid-list{grid-template-columns:1fr;}}
.diy-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);position:relative;display:flex;flex-direction:column;}
.diy-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.diy-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#3b82f6);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:15px;flex-shrink:0;overflow:hidden;}
.diy-avatar img{width:100%;height:100%;object-fit:cover;}
.diy-userinfo{flex:1;min-width:0;}
.diy-username{font-size:13px;font-weight:bold;display:flex;align-items:center;gap:4px;flex-wrap:wrap;word-break:break-all;}
.diy-time{font-size:11px;color:var(--muted);}
.follow-btn{padding:5px 12px;border:none;border-radius:14px;background:linear-gradient(135deg,#0a6cff,#4a9bff);color:#fff;font-size:12px;font-weight:bold;cursor:pointer;flex-shrink:0;}
.follow-btn.followed{background:var(--bg);color:var(--muted);border:1px solid var(--line);}
.diy-card img.diy-img{width:100%;border-radius:10px;margin-bottom:10px;display:block;max-height:320px;object-fit:cover;}
.diy-card .d-title{font-size:15px;font-weight:bold;margin-bottom:4px;word-break:break-word;}
.diy-card .d-game{font-size:12px;color:var(--primary);margin-bottom:6px;}
.diy-card .d-text{font-size:13px;color:var(--text);line-height:1.6;max-height:180px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;background:var(--bg);padding:10px;border-radius:8px;margin-top:8px;margin-bottom:8px;}
.diy-card .d-tag{display:inline-block;padding:2px 8px;border-radius:8px;font-size:11px;margin-left:6px;}
.tag-official{background:#fef3c7;color:#92400e;}
.tag-pinned{background:#fee2e2;color:#991b1b;}
body.dark .tag-official{background:#78350f;color:#fde68a;}
body.dark .tag-pinned{background:#7f1d1d;color:#fecaca;}
.diy-actions{display:flex;gap:12px;margin-top:auto;padding-top:10px;border-top:1px solid var(--line);}
.diy-actions .act{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none;padding:4px 6px;border-radius:6px;}
.diy-actions .act:hover{background:var(--bg);}
.diy-actions .act.liked{color:#ef4444;}
.diy-actions .act .heart{font-size:15px;}
.diy-card .d-menu{position:absolute;right:10px;top:10px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.06);border:none;cursor:pointer;font-size:15px;display:none;color:var(--text);}
body.dark .diy-card .d-menu{background:rgba(255,255,255,.1);color:#fff;}
body.admin .diy-card .d-menu{display:flex;align-items:center;justify-content:center;}
.badge{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;font-size:9px;font-weight:700;color:#fff;flex-shrink:0;line-height:1;}
.badge-author{background:#e53935;box-shadow:0 0 4px #ff5722,0 0 8px #ff9800;animation:firePulse 1.6s ease-in-out infinite;}
.badge-z{background:#2196f3;}.badge-s{background:#ffc107;}.badge-a{background:#e53935;}
@keyframes firePulse{0%,100%{box-shadow:0 0 4px #ff5722,0 0 8px #ff9800;}50%{box-shadow:0 0 6px #ff5722,0 0 14px #ff9800,0 0 22px #ff5722;}}
.badge-text{display:inline-block;font-size:11px;font-weight:500;padding:2px 8px;border-radius:10px;background:#f0f7ff;color:#2196f3;margin-left:2px;}
.badge-text-author{background:#fff3e0;color:#e65100;}
.badge-text-z{background:#e3f2fd;color:#1565c0;}
.badge-text-s{background:#fff8e1;color:#b28704;}
.badge-text-a{background:#ffebee;color:#c62828;}
.game-row{display:flex;justify-content:space-between;align-items:center;width:100%;padding:16px 18px;margin-bottom:12px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);font-size:16px;cursor:pointer;box-shadow:var(--shadow);}
.game-row:hover{transform:translateX(6px);border-color:rgba(10,108,255,.5);}
.game-row .arr{color:var(--muted);font-size:18px;}
#addGameBtn{position:fixed;top:calc(56px + var(--sat));right:14px;z-index:1200;width:42px;height:42px;border-radius:50%;background:linear-gradient(140deg,#10b981,#059669);color:#fff;border:none;font-size:22px;font-weight:bold;cursor:pointer;box-shadow:0 6px 16px rgba(16,185,129,.4);display:none;}
body.admin #addGameBtn{display:flex;align-items:center;justify-content:center;}
#grantVerifyBtn{position:fixed;top:calc(56px + var(--sat));right:14px;z-index:1200;width:42px;height:42px;border-radius:50%;background:linear-gradient(140deg,#8b5cf6,#7c3aed);color:#fff;border:none;font-size:22px;font-weight:bold;cursor:pointer;box-shadow:0 6px 16px rgba(139,92,246,.5);display:none;align-items:center;justify-content:center;}
body.admin #grantVerifyBtn{display:flex;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1500;justify-content:center;align-items:center;padding:20px;}
.modal-overlay.show{display:flex;}
.modal-content{background:var(--card);border-radius:14px;padding:24px;width:100%;max-width:380px;color:var(--text);max-height:80vh;overflow-y:auto;}
.modal-content h3{font-size:17px;margin-bottom:16px;text-align:center;}
.modal-content input,.modal-content textarea,.modal-content select{width:100%;padding:12px;margin-bottom:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font-size:14px;font-family:inherit;}
.modal-content textarea{min-height:90px;resize:vertical;}
.modal-buttons{display:flex;gap:10px;}
.modal-buttons button{flex:1;padding:11px;border:none;border-radius:10px;font-size:14px;cursor:pointer;font-weight:bold;color:#fff;}
.btn-cancel{background:#64748b;}.btn-confirm{background:#10b981;}.btn-danger{background:#ef4444;}.btn-warn{background:#f59e0b;}
.modal-status{font-size:12px;text-align:center;margin-top:8px;min-height:16px;}
.comment-list{max-height:400px;overflow-y:auto;margin-bottom:12px;}
.comment-item{background:var(--bg);border-radius:8px;padding:10px 12px;margin-bottom:8px;}
.comment-head{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:4px;}
.comment-name{color:var(--primary);font-weight:bold;}
.comment-text{font-size:13px;line-height:1.5;color:var(--text);word-break:break-word;white-space:pre-wrap;}
.admin-menu{position:fixed;inset:0;z-index:1600;background:rgba(0,0,0,.7);display:none;justify-content:center;align-items:center;}
.admin-menu.show{display:flex;}
.admin-menu-box{background:var(--card);border-radius:14px;padding:20px;width:100%;max-width:280px;}
.admin-menu-box button{width:100%;padding:14px;margin-bottom:10px;border:none;border-radius:10px;background:var(--bg);color:var(--text);font-size:15px;cursor:pointer;text-align:left;}
.admin-menu-box button:last-child{margin-bottom:0;}
.review-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);}
.review-card img{width:100%;border-radius:10px;margin:10px 0;}
.review-card .r-info{font-size:13px;color:var(--muted);margin-bottom:6px;word-break:break-word;}
.review-card .r-title{font-size:16px;font-weight:bold;margin-bottom:6px;word-break:break-word;}
.review-card .r-text{font-size:13px;color:var(--text);line-height:1.6;max-height:200px;overflow-y:auto;white-space:pre-wrap;padding:10px;background:var(--bg);border-radius:8px;margin:10px 0;}
.review-card .r-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.review-card .r-actions button{flex:1;min-width:70px;padding:10px;border:none;border-radius:8px;font-size:13px;font-weight:bold;color:#fff;cursor:pointer;}
.empty{text-align:center;color:var(--muted);padding:40px 0;font-size:14px;}
#searchBox{width:100%;padding:12px 16px;margin-bottom:16px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font-size:14px;}
#toast{position:fixed;left:50%;bottom:calc(60px + var(--sab));transform:translate(-50%,20px);max-width:80vw;background:rgba(18,22,30,.92);color:#fff;padding:12px 22px;border-radius:12px;font-size:14px;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:2700;}
#toast.show{opacity:1;transform:translate(-50%,0);}
#loadingModal{position:fixed;inset:0;z-index:2600;display:flex;align-items:center;justify-content:center;background:rgba(6,14,30,.5);backdrop-filter:blur(4px);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s;}
#loadingModal.show{opacity:1;visibility:visible;}
.loading-card{background:var(--card);padding:24px;border-radius:18px;width:320px;max-width:86vw;text-align:center;color:var(--text);}
.loading-label{font-size:15px;margin-bottom:16px;}
.loading-track{height:7px;border-radius:99px;background:rgba(10,108,255,.14);overflow:hidden;}
.loading-fill{height:100%;width:0;background:linear-gradient(90deg,#0a6cff,#4a9bff);transition:width .2s;}
.loading-pct{margin-top:10px;font-size:12px;color:var(--muted);}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="progressBar"></div>
<div id="topBar">
  <div class="brand">DIY 收集站</div>
  <div class="user" id="userDisplay">加载中...</div>
</div>
<button id="menuBtn">☰</button>
<button id="addGameBtn" title="添加新游戏">+</button>
<button id="grantVerifyBtn" title="授予官方认证">+</button>
<div id="sidebar">
  <h2>菜单</h2>
  <button class="side-btn" onclick="goPage('page-home')">主页</button>
  <button class="side-btn" onclick="goPublic()">已公开的DIY</button>
  <button class="side-btn" onclick="goUpload()">上传DIY</button>
  <button class="side-btn" onclick="goOfficialList()">官方公告</button>
  <button class="side-btn" onclick="openOfficialPost()" id="officialPostBtn" style="display:none;">官号发布</button>
  <button class="side-btn" id="themeBtn"><span>夜间模式</span><span class="switch" id="switchEl"></span></button>
  <button class="side-btn" id="reviewBtn" style="display:none;" onclick="goReview()">审核</button>
</div>
<div id="overlay"></div>

<div class="page active" id="page-home">
  <h1>DIY 收集站</h1>
  <p class="sub">欢迎来到太空杀124 DIY合集</p>
  <button class="big-btn" onclick="window.location.href='SpaceKill124.html'">返回主站</button>
  <button class="big-btn" onclick="goUpload()">上传DIY</button>
  <button class="big-btn" onclick="goPublic()">已公开的DIY</button>
  <button class="big-btn" onclick="goOfficialList()">官方公告</button>
</div>

<div class="page" id="page-upload">
  <button class="back-btn" onclick="goPage('page-home')">← 返回</button>
  <h1>上传 DIY</h1>
  <input class="input-box" id="upName" placeholder="DIY 名称">
  <input class="input-box" id="upGame" placeholder="所属游戏/分类" list="gameList">
  <datalist id="gameList"></datalist>
  <div class="file-row">
    <button id="pickImgBtn">选择图片</button>
    <button id="pickTxtBtn">选择 TXT</button>
  </div>
  <input type="file" id="imgInput" accept="image/*" style="display:none;">
  <input type="file" id="txtInput" accept=".txt,text/plain" style="display:none;">
  <textarea class="input-box" id="upText" placeholder="文字内容（选择TXT会自动填充到这里）"></textarea>
  <button class="big-btn" id="submitUpload">提交上传</button>
</div>

<div class="page" id="page-public">
  <button class="back-btn" onclick="goPage('page-home')">← 返回</button>
  <h1>已公开的 DIY</h1>
  <p class="sub">选择一个分类查看</p>
  <div id="gameListBox"></div>
</div>

<div class="page" id="page-game">
  <button class="back-btn" onclick="goPublic()">← 返回</button>
  <h1 id="gameTitle"></h1>
  <input id="searchBox" placeholder="模糊搜索 DIY 名称或内容...">
  <div class="grid-list" id="diyGrid"></div>
</div>

<div class="page" id="page-official-list">
  <button class="back-btn" onclick="goPage('page-home')">← 返回</button>
  <h1>官方公告</h1>
  <p class="sub">由 SpaceKill124 官方发布</p>
  <div id="officialList"></div>
</div>

<div class="page" id="page-review-select">
  <button class="back-btn" onclick="goPage('page-home')">← 返回</button>
  <h1>审核中心</h1>
  <p class="sub">选择要审核的内容</p>
  <button class="big-btn" onclick="goReviewDiy()">审核 DIY 内容</button>
  <button class="big-btn" onclick="goReviewVerify()">审核认证标识</button>
  <button class="big-btn" onclick="goReviewReport()">审核举报</button>
</div>

<div class="page" id="page-review">
  <button class="back-btn" onclick="goReview()">← 返回</button>
  <h1>审核 DIY 内容</h1>
  <div class="grid-list" id="reviewGrid"></div>
</div>

<div class="page" id="page-verify-review">
  <button class="back-btn" onclick="goReview()">← 返回</button>
  <h1>认证审核</h1>
  <div class="grid-list" id="verifyReviewGrid"></div>
</div>

<div class="page" id="page-report-review">
  <button class="back-btn" onclick="goReview()">← 返回</button>
  <h1>审核举报</h1>
  <div class="grid-list" id="reportReviewGrid"></div>
</div>

<div class="page" id="page-official">
  <button class="back-btn" onclick="goPage('page-home')">← 返回</button>
  <h1>官号发布</h1>
  <input class="input-box" id="offText" placeholder="文字内容">
  <div class="file-row">
    <button id="offPickImg">选择图片</button>
    <button id="offPickFile">选择文件</button>
  </div>
  <input type="file" id="offImgInput" accept="image/*" style="display:none;">
  <input type="file" id="offFileInput" style="display:none;">
  <p id="offFileName" style="font-size:12px;color:var(--muted);margin-bottom:12px;"></p>
  <button class="big-btn" id="offSubmit">发布</button>
</div>

<div class="modal-overlay" id="addGameModal">
  <div class="modal-content">
    <h3>添加新游戏/分类</h3>
    <input id="newGameName" placeholder="输入名称">
    <div class="modal-buttons">
      <button class="btn-cancel" onclick="closeModal('addGameModal')">取消</button>
      <button class="btn-confirm" onclick="createGame()">确定</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="grantVerifyModal">
  <div class="modal-content">
    <h3>授予官方认证</h3>
    <input id="gvUid" placeholder="输入用户 UID" type="number" inputmode="numeric">
    <select id="gvBadge">
      <option value="author">官方认证 · 作者</option>
      <option value="z">10万粉认证</option>
      <option value="s">百万粉认证</option>
      <option value="a">企业认证</option>
    </select>
    <input id="gvText" placeholder="企业/政府名称（仅企业认证需要）" style="display:none;">
    <div class="modal-buttons">
      <button class="btn-cancel" onclick="closeModal('grantVerifyModal')">取消</button>
      <button class="btn-confirm" onclick="doGrantVerify()">确认</button>
    </div>
    <p class="modal-status" id="gvStatus"></p>
  </div>
</div>

<div class="modal-overlay" id="banModal">
  <div class="modal-content">
    <h3>封禁用户</h3>
    <p style="font-size:13px;color:var(--muted);margin-bottom:10px;">快捷选择：</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
      <button type="button" class="btn-warn" data-days="1" style="padding:8px 14px;border:none;border-radius:8px;color:#fff;cursor:pointer;font-size:13px;">1 天</button>

function renderGameItems(items){
  var grid = $("diyGrid");

  var html = "";

    var liked = !!likesCache[item.id];
    var followed = !!followsCache[item.uploader_email];
    var isOwn = myEmail && item.uploader_email === myEmail;
    var tags = "";
    if(item.is_pinned)tags += '<span class="d-tag tag-pinned">置顶</span>';
    if(item.is_official)tags += '<span class="d-tag tag-official">官方推荐</span>';
    var avatarHTML = item.uploader_avatar ? '<img src="'+escapeHtml(item.uploader_avatar)+'">' : escapeHtml((item.uploader_name || "?").charAt(0).toUpperCase());
    var badgeHTML = getBadgeHTML(item.uploader_badge, item.uploader_badge_text);
    var imgHTML = item.image_url ? '<img class="diy-img" src="'+escapeHtml(item.image_url)+'">' : "";

    var followBtnHTML = "";
    if(!isOwn){followBtnHTML = '<button class="follow-btn'+(followed?' followed':'')+'" data-follow="'+escapeHtml(item.uploader_email)+'">'+(followed?'已关注':'关注')+'</button>';}
    html += '<div class="diy-card" data-id="'+item.id+'" data-pos="'+item.position+'">';
    html += '<button class="d-menu" data-id="'+item.id+'">⋮</button>';

    html += followBtnHTML;
    html += '</div>';
    html += '<div class="d-title">'+escapeHtml(item.name)+tags+'</div>';
    html += '<div class="d-game">'+escapeHtml(item.game)+'</div>';
    html += imgHTML + textHTML;
    html += '<div class="diy-actions">';
    html += '<div class="act'+(liked?' liked':'')+'" data-like="'+item.id+'"><span class="heart">'+(liked?'❤️':'🤍')+'</span><span class="like-count">'+(item.likes||0)+'</span></div>';

    html += '</div>';
  });
  grid.innerHTML = html;

function toggleLike(id, el){if(!myEmail){toast("请先登录");return;}var isLiked = !!likesCache[id];var newLiked = !isLiked;likesCache[id] = newLiked;pendingLikes[id] = newLiked;el.classList.toggle("liked", newLiked);el.querySelector(".heart").textContent = newLiked ? "❤️" : "🤍";var countEl = el.querySelector(".like-count");var current = parseInt(countEl.textContent,10) || 0;countEl.textContent = newLiked ? current+1 : Math.max(0,current-1);flushLike(id);}

function toggleFollow(targetEmail, el){if(!myEmail){toast("请先登录");return;}if(targetEmail === myEmail){toast("不能关注自己");return;}var isFollowed = !!followsCache[targetEmail];var newFollowed = !isFollowed;followsCache[targetEmail] = newFollowed;pendingFollows[targetEmail] = newFollowed;el.textContent = newFollowed ? "已关注" : "关注";el.classList.toggle("followed", newFollowed);flushFollow(targetEmail);}

  if(!content){toast("请输入评论内容");return;}
  if(containsBanWord(content)){toast("评论包含违禁词，请修改");return;}
  var res = await supabaseClient.from("diy_comments").insert([{diy_id:currentCommentItemId, user_email:myEmail, user_name:myAccount, content:content}]);
  if(res.error){toast("评论失败: " + res.error.message);return;}
  var r = await supabaseClient.from("diy").select("comments_count").eq("id",currentCommentItemId).maybeSingle();
  if(r.data){await supabaseClient.from("diy").update({comments_count:(r.data.comments_count||0)+1}).eq("id",currentCommentItemId);}
  $("commentInput").value = "";
  loadComments(currentCommentItemId);
  loadGameItems(currentGame, $("searchBox").value.trim());
  toast("评论成功");
}

async function doShare(id){
  var item = currentGameItems.find(function(i){return i.id===id;});
  if(!item){toast("找不到该内容");return;}
  var token = Math.random().toString(36).slice(2) + Date.now().toString(36);
  var expiresAt = new Date(Date.now() + 24*60*60*1000).toISOString();
  var res = await supabaseClient.from("diy_shares").insert([{token:token, diy_id:id, game:item.game, position:item.position, expires_at:expiresAt}]);
  if(res.error){toast("生成失败: " + res.error.message);return;}
  var base = window.location.href.split("?")[0].split("#")[0];
  $("shareLink").value = base + "?share=" + token;
  currentShareItem = item;
  openModal("shareModal");
}
function copyShareLink(){var input = $("shareLink");input.select();input.setSelectionRange(0, 99999);try{if(navigator.clipboard && navigator.clipboard.writeText){navigator.clipboard.writeText(input.value).then(function(){toast("已复制");closeModal("shareModal");});}else{document.execCommand("copy");toast("已复制");closeModal("shareModal");}}catch(e){document.execCommand("copy");toast("已复制");closeModal("shareModal");}}
async function handleShareLink(){var params = new URLSearchParams(window.location.search);var token = params.get("share");if(!token)return;var res = await supabaseClient.from("diy_shares").select("*").eq("token",token).maybeSingle();if(!res.data){toast("链接无效或已过期");return;}var share = res.data;if(new Date(share.expires_at) < new Date()){toast("链接已过期");return;}currentGame = share.game;$("gameTitle").textContent = share.game;goPage("page-game");await loadGameItems(share.game, "");setTimeout(function(){var card = document.querySelector('.diy-card[data-id="'+share.diy_id+'"]');if(card){card.scrollIntoView({behavior:"smooth",block:"center"});card.style.outline="3px solid #0a6cff";}}, 400);}

function closeAdminMenu(){$("adminMenu").classList.remove("show");currentAdminItemId = null;}
$("adminMenu").addEventListener("click", function(e){if(e.target === $("adminMenu"))closeAdminMenu();});
async function adminRemove(){if(!currentAdminItemId){closeAdminMenu();return;}if(!confirm("确定下架这条内容吗？")){closeAdminMenu();return;}var res = await supabaseClient.from("diy").delete().eq("id", currentAdminItemId);closeAdminMenu();if(res.error){toast("失败: " + res.error.message);return;}toast("已下架");loadGameItems(currentGame, $("searchBox").value.trim());}
async function adminPin(){if(!currentAdminItemId){closeAdminMenu();return;}var item = currentGameItems.find(function(i){return i.id===currentAdminItemId;});if(!item){closeAdminMenu();return;}if(item.is_pinned){await supabaseClient.from("diy").update({is_pinned:false}).eq("id",currentAdminItemId);toast("已取消置顶");}else{await supabaseClient.from("diy").update({is_pinned:false}).eq("game", currentGame).eq("is_pinned", true);await supabaseClient.from("diy").update({is_pinned:true}).eq("id",currentAdminItemId);toast("已置顶，原置顶已取消");}closeAdminMenu();loadGameItems(currentGame, $("searchBox").value.trim());}
async function adminOfficial(){if(!currentAdminItemId){closeAdminMenu();return;}var item = currentGameItems.find(function(i){return i.id===currentAdminItemId;});if(!item){closeAdminMenu();return;}await supabaseClient.from("diy").update({is_official: !item.is_official}).eq("id", currentAdminItemId);closeAdminMenu();toast(item.is_official ? "已取消官方推荐" : "已标记为官方推荐");loadGameItems(currentGame, $("searchBox").value.trim());}

$("pickImgBtn").addEventListener("click", function(){$("imgInput").click();});
$("pickTxtBtn").addEventListener("click", function(){$("txtInput").click();});
$("imgInput").addEventListener("change", function(){var f = this.files[0];if(!f)return;$("upText").value = "";});
$("txtInput").addEventListener("change", function(){var f = this.files[0];if(!f)return;var reader = new FileReader();reader.onload = function(e){$("upText").value = e.target.result;};reader.readAsText(f);});

function compressImage(file, maxSize, quality){return new Promise(function(resolve, reject){var reader = new FileReader();reader.onerror = function(){reject(new Error("读取失败"));};reader.onload = function(e){var img = new Image();img.onerror = function(){reject(new Error("解析失败"));};img.onload = function(){var w = img.width, h = img.height;if(w > h && w > maxSize){h = Math.round(h * maxSize / w); w = maxSize;}else if(h > w && h > maxSize){w = Math.round(w * maxSize / h); h = maxSize;}else if(w === h && w > maxSize){w = h = maxSize;}var canvas = document.createElement("canvas");canvas.width = w;canvas.height = h;var ctx = canvas.getContext("2d");ctx.drawImage(img, 0, 0, w, h);canvas.toBlob(function(blob){if(blob)resolve(blob);else reject(new Error("压缩失败"));}, "image/jpeg", quality);};img.src = e.target.result;};reader.readAsDataURL(file);});}
function safeFileName(original){var ext = String(original||"").split(".").pop().toLowerCase();if(!/^[a-z0-9]+$/.test(ext))ext = "jpg";return Date.now() + "_" + Math.random().toString(36).slice(2,10) + "." + ext;}

$("submitUpload").addEventListener("click", async function(){
  if(!myEmail){toast("请先返回主站登录");return;}
  var name = $("upName").value.trim();
  var game = $("upGame").value.trim();
  var imgFile = $("imgInput").files[0];
  var textContent = $("upText").value.trim();
  if(!name){toast("请输入DIY名称");return;}
  if(!game){toast("请输入所属游戏/分类");return;}
  if(!imgFile && !textContent){toast("请上传图片或填写文字内容");return;}
  if(textContent && containsBanWord(textContent)){toast("内容包含违禁词");return;}
  showLoading("处理中...");
  var uploadFile = imgFile;
  var uploadName = "";
  if(imgFile){try{var compressed = await compressImage(imgFile, 1600, 0.8);uploadFile = compressed;uploadName = safeFileName(imgFile.name);}catch(e){uploadFile = imgFile;uploadName = safeFileName(imgFile.name);}}
  var imageUrl = "";
  if(uploadFile){$("loadingLabel").textContent = "上传图片中...";var up = await supabaseClient.storage.from("diy").upload(uploadName, uploadFile);if(up.error){hideLoading();toast("图片上传失败: " + up.error.message);return;}var pub = supabaseClient.storage.from("diy").getPublicUrl(uploadName);imageUrl = pub.data.publicUrl;}
  $("loadingLabel").textContent = "写入数据...";
  var ins = await supabaseClient.from("diy").insert([{name: name, game: game,content_type: uploadFile ? "image" : "txt",image_url: imageUrl,text_content: textContent,uploader_email: myEmail,uploader_uid: myUid,uploader_name: myAccount || myEmail,status: "pending"}]);
  hideLoading();
  if(ins.error){toast("提交失败: " + ins.error.message);return;}
  $("upName").value="";$("upGame").value="";$("upText").value="";$("imgInput").value="";$("txtInput").value="";
  showAlert("已上传", "已上传，请等待审核。", function(){goPage("page-home");});
});

$("offPickImg").addEventListener("click", function(){$("offImgInput").click();});

  var text = $("offText").value.trim();

  var fileFile = $("offFileInput").files[0];

  if(fileFile){var fname = safeFileName(fileFile.name);var up2 = await supabaseClient.storage.from("official").upload(fname, fileFile);if(!up2.error){var pub2 = supabaseClient.storage.from("official").getPublicUrl(fname);fileUrl = pub2.data.publicUrl;fileName = fileFile.name;}}
  var res = await supabaseClient.from("official_posts").insert([{content_type: fileFile ? "file" : (imgFile ? "image" : "text"),text_content: text,image_url: imageUrl,file_url: fileUrl,file_name: fileName}]);

async function loadReview(){
  showLoading("加载审核列表...");
  var res = await supabaseClient.from("diy").select("*").eq("status", "pending").order("created_at", {ascending:true});
  hideLoading();
  var grid = $("reviewGrid");
  if(res.error){grid.innerHTML = '<div class="empty">加载失败</div>';return;}
  if(!res.data || res.data.length === 0){grid.innerHTML = '<div class="empty">暂无待审核内容</div>';return;}
  grid.innerHTML = res.data.map(function(item){
    var img = item.image_url ? '<img src="' + escapeHtml(item.image_url) + '">' : "";
    var txt = (!item.image_url && item.text_content) ? '<div class="r-text">' + escapeHtml(item.text_content) + '</div>' : "";
    return '<div class="review-card"><div class="r-title">' + escapeHtml(item.name) + '</div><div class="r-info">分类: ' + escapeHtml(item.game) + '</div><div class="r-info">上传者: ' + escapeHtml(item.uploader_email || "未知") + '</div><div class="r-info">时间: ' + fmtTime(item.created_at) + '</div>' + img + txt + '<div class="r-actions"><button style="background:#10b981;" data-id="' + item.id + '" data-act="approve">过审</button><button style="background:#f59e0b;" data-id="' + item.id + '" data-act="edit">待修改</button><button style="background:#ef4444;" data-id="' + item.id + '" data-act="reject">不过审</button></div></div>';
  }).join("");
  grid.querySelectorAll("button[data-act]").forEach(function(btn){btn.addEventListener("click", function(){handleReview(parseInt(btn.dataset.id,10), btn.dataset.act);});});
}

function handleReview(id, act){if(act === "approve"){approveItem(id);}else{openReasonModal(id, act);}}
async function approveItem(id){await supabaseClient.from("diy").update({status: "approved"}).eq("id", id);toast("已过审");loadReview();}
function openReasonModal(id, act){pendingVerifyRejectId = null;pendingReasonAction = {id:id, act:act};$("reasonTitle").textContent = act === "edit" ? "待修改理由" : "不过审理由";$("reasonInput").value = "";openModal("reasonModal");}

async function loadVerifyReview(){
  showLoading("加载认证申请...");
  var res = await supabaseClient.from("verify_requests").select("*").eq("status","pending").order("created_at",{ascending:true});
  hideLoading();
  var grid = $("verifyReviewGrid");
  if(res.error){grid.innerHTML = '<div class="empty">加载失败</div>';return;}
  if(!res.data || res.data.length === 0){grid.innerHTML = '<div class="empty">暂无待审核认证</div>';return;}
  var badgeNameMap = {z:"10万粉认证",s:"百万粉认证",a:"企业认证"};
  grid.innerHTML = res.data.map(function(item){
    return '<div class="review-card"><div class="r-title">' + escapeHtml(item.user_account || item.user_email) + '</div><div class="r-info">UID: ' + (item.user_uid || "—") + '</div><div class="r-info">申请认证: ' + escapeHtml(badgeNameMap[item.badge] || item.badge) + '</div><div class="r-info">当前粉丝数: ' + (item.followers || 0) + '</div><div class="r-info">申请时间: ' + fmtTime(item.created_at) + '</div><div class="r-actions"><button style="background:#10b981;" data-vid="' + item.id + '" data-vact="approve">同意</button><button style="background:#ef4444;" data-vid="' + item.id + '" data-vact="reject">拒绝</button></div></div>';
  }).join("");
  grid.querySelectorAll("button[data-vact]").forEach(function(btn){btn.addEventListener("click", function(){handleVerifyReview(parseInt(btn.dataset.vid,10), btn.dataset.vact);});});
}

function handleVerifyReview(id, act){if(act === "approve"){approveVerify(id);}else{openVerifyRejectModal(id);}}

async function approveVerify(id){
  var r = await supabaseClient.from("verify_requests").select("*").eq("id",id).maybeSingle();
  if(!r.data){toast("找不到申请");return;}
  var req = r.data;
  await supabaseClient.from("profiles").update({badge:req.badge, badge_text:req.badge_text||""}).eq("email",req.user_email);
  await supabaseClient.from("verify_requests").update({status:"approved"}).eq("id",id);
  await supabaseClient.from("verify_notifications").insert([{user_email:req.user_email, badge:req.badge, status:"approved"}]);
  toast("已通过");
  loadVerifyReview();
}

function openVerifyRejectModal(id){pendingReasonAction = null;pendingVerifyRejectId = id;$("reasonTitle").textContent = "拒绝理由";$("reasonInput").value = "";openModal("reasonModal");}

async function loadReportReview(){
  showLoading("加载举报列表...");
  var res = await supabaseClient.from("reports").select("*").eq("status","pending").order("created_at",{ascending:true});
  hideLoading();
  var grid = $("reportReviewGrid");
  if(res.error){grid.innerHTML = '<div class="empty">加载失败: ' + escapeHtml(res.error.message) + '</div>';return;}
  if(!res.data || res.data.length === 0){grid.innerHTML = '<div class="empty">暂无待审核举报</div>';return;}
  grid.innerHTML = res.data.map(function(item){
    return '<div class="review-card">' +
      '<div class="r-title">举报 #' + item.id + '</div>' +
      '<div class="r-info">举报人: ' + escapeHtml(item.reporter_email || "—") + '</div>' +
      '<div class="r-info">被举报人 UID: ' + (item.target_uid || "—") + '</div>' +
      '<div class="r-info">被举报人邮箱: ' + escapeHtml(maskedEmail(item.target_email)) + '</div>' +
      '<div class="r-info">时间: ' + fmtTime(item.created_at) + '</div>' +
      '<div class="r-text">举报理由: ' + escapeHtml(item.reason || "无") + '</div>' +
      '<div class="r-actions">' +
        '<button style="background:#ef4444;" data-rid="' + item.id + '" data-r-uid="' + (item.target_uid||'') + '" data-r-email="' + escapeHtml(item.target_email||'') + '" data-r-act="ban">封禁</button>' +
        '<button style="background:#64748b;" data-rid="' + item.id + '" data-r-act="dismiss">驳回</button>' +
      '</div>' +
    '</div>';
  }).join("");
  grid.querySelectorAll("button[data-r-act]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var rid = parseInt(btn.dataset.rid,10);
      var act = btn.dataset.rAct;
      if(act === "ban"){
        pendingBanReportId = rid;
        pendingBanTargetUid = parseInt(btn.dataset.rUid,10) || null;
        $("banDays").value = "1";
        $("banReason").value = "";
        $("banStatus").textContent = "";
        openModal("banModal");
      }else{
        dismissReport(rid);
      }
    });
  });
}

document.querySelectorAll("#banModal button[data-days]").forEach(function(btn){
  btn.addEventListener("click", function(){
    $("banDays").value = btn.dataset.days;
  });
});

async function doBan(){
  if(!isAdmin){toast("仅管理员可用");return;}
  var days = parseInt($("banDays").value, 10);
  var reason = $("banReason").value.trim() || "违反社区规范";
  var status = $("banStatus");
  if(isNaN(days) || days < 0){status.textContent="请输入有效的天数（0 表示永久）";status.style.color="#ef4444";return;}
  if(!pendingBanTargetUid){status.textContent="无法获取被举报用户";status.style.color="#ef4444";return;}
  status.textContent="处理中...";status.style.color="#94a3b8";

  var banType = days === 0 ? "permanent" : (days + "day");
  var expiresAt = days === 0 ? null : new Date(Date.now() + days*24*60*60*1000).toISOString();

  var ins = await supabaseClient.from("bans").insert([{
    target_uid: pendingBanTargetUid,
    ban_type: banType,
    reason: reason,
    expires_at: expiresAt
  }]);
  if(ins.error){status.textContent="封禁失败: " + ins.error.message;status.style.color="#ef4444";return;}

  if(pendingBanReportId){
    await supabaseClient.from("reports").update({status:"resolved"}).eq("id", pendingBanReportId);
  }

  status.textContent="已封禁";status.style.color="#10b981";
  toast(days === 0 ? "已永久封禁" : ("已封禁 " + days + " 天"));
  pendingBanTargetUid = null;
  pendingBanReportId = null;
  setTimeout(function(){closeModal("banModal");loadReportReview();}, 800);
}

async function dismissReport(rid){
  var ok = confirm("确定驳回该举报吗？");
  if(!ok)return;
  var r = await supabaseClient.from("reports").update({status:"dismissed"}).eq("id", rid);
  if(r.error){toast("驳回失败: " + r.error.message);return;}
  toast("已驳回");
  loadReportReview();
}

$("reasonConfirmBtn").addEventListener("click", async function(){
  var reason = $("reasonInput").value.trim();
  if(!reason){toast("请填写理由");return;}
  if(pendingVerifyRejectId){
    var r = await supabaseClient.from("verify_requests").select("*").eq("id",pendingVerifyRejectId).maybeSingle();
    if(r.data){await supabaseClient.from("verify_requests").update({status:"rejected", reject_reason:reason}).eq("id",pendingVerifyRejectId);await supabaseClient.from("verify_notifications").insert([{user_email:r.data.user_email, badge:r.data.badge, status:"rejected", reason:reason}]);}
    pendingVerifyRejectId = null;
    closeModal("reasonModal");
    toast("已拒绝");
    loadVerifyReview();
    return;
  }
  if(!pendingReasonAction)return;
  var id = pendingReasonAction.id, act = pendingReasonAction.act;
  var dr = await supabaseClient.from("diy").select("*").eq("id",id).maybeSingle();
  if(!dr.data){toast("找不到该内容");closeModal("reasonModal");return;}
  var newStatus = act === "edit" ? "needs_edit" : "rejected";
  await supabaseClient.from("diy").update({status:newStatus, reject_reason:reason}).eq("id",id);
  await supabaseClient.from("diy_notifications").insert([{user_email:dr.data.uploader_email,diy_id:id,name:dr.data.name,game:dr.data.game,content_type:dr.data.content_type,image_url:dr.data.image_url,text_content:dr.data.text_content,status:newStatus,reason:reason}]);
  closeModal("reasonModal");
  pendingReasonAction = null;
  toast(act === "edit" ? "已通知用户修改" : "已通知用户不过审");
  loadReview();
});

function showAlert(title, body, onOk){
  $("alertTitle").textContent = title;
  $("alertBody").textContent = body;
  $("alertModal").classList.add("show");
  var btn = $("alertOkBtn");
  var clone = btn.cloneNode(true);
  btn.parentNode.replaceChild(clone, btn);
  clone.addEventListener("click", function(){closeModal("alertModal");if(onOk)onOk();});
}
