<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>访问被阻止 - 403 Forbidden</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background-color: #1a1a2e;
            color: #eee;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 背景动态网格 */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(rgba(255, 0, 0, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 0, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            z-index: 0;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .container {
            text-align: center;
            z-index: 1;
            padding: 20px;
        }

        .icon {
            font-size: 80px;
            color: #ff4757;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        h1 {
            font-size: 2.5em;
            color: #ff4757;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 71, 87, 0.5);
        }

        .error-code {
            font-size: 1.2em;
            color: #888;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .message {
            font-size: 1.1em;
            color: #ccc;
            line-height: 1.8;
            margin-bottom: 30px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .details {
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid rgba(255, 71, 87, 0.3);
            border-radius: 8px;
            padding: 15px 25px;
            display: inline-block;
            margin-bottom: 30px;
        }

        .details p {
            color: #aaa;
            font-size: 0.9em;
            margin: 5px 0;
        }

        .details span {
            color: #ff4757;
            font-weight: bold;
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: transparent;
            border: 2px solid #ff4757;
            color: #ff4757;
            text-decoration: none;
            border-radius: 5px;
            font-size: 1em;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn:hover {
            background: #ff4757;
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.4);
        }

        .countdown {
            margin-top: 20px;
            color: #666;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">⚠️</div>
        <h1>访问被阻止</h1>
        <div class="error-code">ERROR 403 - FORBIDDEN</div>
        
        <div class="message">
            系统检测到您的访问频率异常，为保障服务稳定，<br>
            您的 IP 地址已被临时限制访问。
        </div>

        <div class="details">
            <p>请求状态: <span>已拦截</span></p>
            <p>限制原因: <span>访问频率过高</span></p>
            <p>预计解除: <span id="timer">60</span> 秒后</p>
        </div>

        <br>
        <a href="https://tks124.github.io/tks/" class="btn">刷新重试</a>

        <div class="countdown">
            如认为误判，请联系管理员
        </div>
    </div>

    <script>
        // 倒计时功能
        let seconds = 60;
        const timerElement = document.getElementById('timer');
        
        const countdown = setInterval(() => {
            seconds--;
            timerElement.textContent = seconds;
            
            if (seconds <= 0) {
                clearInterval(countdown);
                timerElement.textContent = '限制访问可能已解除，可重试';
                timerElement.style.color = '#2ed573';
            }
        }, 1000);
    </script>
</body>
</html>
