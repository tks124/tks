    <script>
        const AUTH_KEY = "sk124_auth_token";
        const AUTH_PAGE_URL = "https://www.spacekill124/";
        const LANG_KEY = "sk124_lang";

        const WHITELIST_DOMAINS = [
            'bilibili.com',
            'foxmail.com',
            'tks124.github.io',
            'spacekill124.cn',
            'www.spacekill124.cn',
            'tks124444.github.io'
        ];

        const translations = {
    zh: {
        register: "注册",
        title: "Space Kill124",
        modSite: "改版官网",
        landlord: "斗地主",
        adminProfile: "管理员个人主页",
        officialApp: "官网软件版/v1.0.1",
        pvzCreator: "pvz2高级创作软件版/v3.2.7",
        qrcodeGen: "二维码生成",
        feedback: "意见反馈",
        credits: "制作人员名单",
        footer: "© 太空杀124拥有最终解释权与所有权。",
        safetyAlert: "当前前往的网站并非SpaceKill124名下，注意隐私安全。"
    },
    en: {
        register: "Register",
        title: "Space Kill124",
        modSite: "Redesigned Website",
        landlord: "Landlord Game",
        adminProfile: "Admin's Profile",
        officialApp: "Official App / v1.0.1",
        pvzCreator: "PVZ2 Advanced Creator / v3.2.7",
        qrcodeGen: "QR Code Generator",
        feedback: "Feedback",
        credits: "Credits",
        footer: "© SpaceKill124 owns the final interpretation rights and all rights.",
        safetyAlert: "The site you are about to visit is not owned by SpaceKill124. Please pay attention to your privacy and security."
    }
};

        let currentLang = localStorage.getItem(LANG_KEY) || 'zh';

        function updateText() {
            const t = translations[currentLang];
            document.querySelectorAll('[data-lang]').forEach(el => {
                const key = el.getAttribute('data-lang');
                if (t[key]) {
                    if (el.tagName === 'A') {
                        el.textContent = t[key];
                    } else {
                        el.innerText = t[key];
                    }
                }
            });
            document.getElementById('langBtn').textContent = currentLang === 'zh' ? 'English' : '中文';
        }

        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            localStorage.setItem(LANG_KEY, currentLang);
            updateText();
        }

        function isWhitelisted(url) {
            if (url.startsWith('mailto:')) {
                return true;
            }
            try {
                const urlObj = new URL(url);
                return WHITELIST_DOMAINS.some(domain => urlObj.hostname.includes(domain));
            } catch (e) {
                return false;
            }
        }

        function navigateWithSafetyCheck(url) {
            if (!url || url === '#') {
                return;
            }

            if (url.includes('github.com/tks124')) {
                window.location.href = url;
                return;
            }

            if (isWhitelisted(url)) {
                window.location.href = url;
                return;
            }

            if (url.includes('github.com/tks124444')) {
                window.location.href = url;
                return;
            }

            if (isWhitelisted(url)) {
                window.location.href = url;
                return;
            }

            if (url.startsWith("https://tks124.github.io/")) {
                window.location.replace(url);
                return;
            }

            const isConfirmed = confirm(translations[currentLang].safetyAlert);
            if (isConfirmed) {
                window.location.href = url;
            }
        }

        document.getElementById('langBtn').addEventListener('click', toggleLanguage);
        
        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                const targetUrl = this.getAttribute('href');
                navigateWithSafetyCheck(targetUrl);
            });
        });

        window.onload = function() {
            updateText();
            if (localStorage.getItem(AUTH_KEY) !== "true") {
                window.location.replace(AUTH_PAGE_URL);
            }
        };
    </script>
