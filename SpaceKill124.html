<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>太空杀124 - Main Page</title>
<style>
body{margin:0;padding:0;background-color:#1e90ff;font-family:'Microsoft YaHei',sans-serif;height:100vh;display:flex;justify-content:center;align-items:center;position:relative;}
.container{text-align:center;background:rgba(255,255,255,0.1);padding:40px;border-radius:15px;box-shadow:0 4px 15px rgba(0,0,0,0.2);width:90%;max-width:500px;position:relative;}
h1{color:white;margin-bottom:30px;text-shadow:1px 1px 3px rgba(0,0,0,0.2);}
.btn{display:block;width:250px;margin:15px auto;padding:15px 0;text-decoration:none;color:white;font-size:18px;font-weight:bold;border:2px solid white;border-radius:8px;transition:all 0.3s ease;background-color:transparent;cursor:pointer;}
.btn:hover{background-color:white;color:#1e90ff;transform:translateY(-3px);}
.btn-primary{background-color:#fff;color:#1e90ff;}
.btn-primary:hover{background-color:#f0f0f0;color:#0066cc;}
.btn-register{position:absolute;top:20px;right:20px;width:auto;padding:10px 20px;font-size:16px;margin:0;}
#accountDisplay{position:absolute;top:20px;right:20px;color:white;font-weight:bold;font-size:14px;display:none;background:rgba(255,255,255,0.2);padding:10px 16px;border-radius:8px;border:2px solid white;text-align:right;line-height:1.5;}
#accountDisplay .uid-line{font-size:12px;opacity:.9;font-weight:normal;}
#accountDisplay .bio-line{font-size:12px;opacity:.9;font-weight:normal;max-width:200px;word-break:break-all;}
#accountDisplay .acc-buttons{margin-top:8px;display:flex;gap:6px;justify-content:flex-end;}
#accountDisplay .acc-buttons button{padding:4px 10px;font-size:12px;border:none;border-radius:5px;cursor:pointer;color:white;}
.btn-edit{background:#8b5cf6;}.btn-friend{background:#06b6d4;}.btn-logout{background:#ef4444;}
.badge{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;font-size:9px;font-weight:700;color:#fff;line-height:1;margin-left:4px;}
.badge-author{background:#e53935;box-shadow:0 0 4px #ff5722,0 0 8px #ff9800;}
.badge-z{background:#2196f3;}.badge-s{background:#ffc107;}.badge-a{background:#e53935;}
.lang-switch{position:absolute;top:20px;left:20px;width:auto;padding:10px 20px;font-size:16px;margin:0;background-color:rgba(255,255,255,0.2);border:2px solid white;color:white;border-radius:8px;cursor:pointer;}
footer{background-color:#333;color:#fff;text-align:center;padding:15px 0;font-size:14px;position:fixed;bottom:0;width:100%;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:1000;justify-content:center;align-items:center;}
.modal-content{background:#1f2937;padding:30px;border-radius:12px;width:90%;max-width:340px;color:white;}
.modal-content h3{margin:0 0 20px;text-align:center;}
.modal-content input,.modal-content select{width:100%;padding:12px;margin-bottom:12px;border:1px solid #4b5563;border-radius:6px;background:#111827;color:white;box-sizing:border-box;font-size:14px;}
.modal-buttons{display:flex;gap:10px;}
.modal-buttons button{flex:1;padding:10px;border:none;border-radius:6px;cursor:pointer;font-size:14px;color:white;}
.btn-cancel{background:#ef4444;}.btn-confirm{background:#10b981;}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="container">
  <button class="lang-switch" id="langBtn">English</button>
  <a href="http://tks124.github.io/tks/zc" id="registerBtn" class="btn btn-register" data-lang="register">注册</a>
  <div id="accountDisplay"></div>

  <h1 data-lang="title">Space Kill124</h1>
  <a href="https://tks124.ithub.io/tks/jianyujianzhushi" class="btn btn-primary" data-lang="modSite">改版官网</a>
  <a href="https://app-d8gm4nxuj1fl.appmiaoda.com/" class="btn btn-primary" data-lang="landlord">斗地主</a>
  <a href="https://m.bilibili.com/space/482735934" class="btn" data-lang="adminProfile">管理员个人主页</a>
  <a href="https://github.com/tks124/tks124-apk/releases/download/v1.0.1/SpaceKill124_v1.0.1.APK" class="btn" data-lang="officialApp">官网软件版/v1.0.1</a>
  <a href="https://github.com/tks124/pvz2-apk/releases/download/v3.2.8/pvz2_v3.2.8.APK" class="btn" data-lang="pvzCreator">pvz2高级创作软件版/v3.2.8</a>
  <a href="https://tks124.github.io/tks/2wm" class="btn" data-lang="qrcodeGen">二维码生成</a>
  <a href="mailto:linjiayuan@spacekill124.cn" class="btn" data-lang="feedback">意见反馈</a>
  <a href="profile.html" class="btn" data-lang="personalHome">个人主页</a>
  <a href="https://tks124.github.io/tks/diy" class="btn" data-lang="diy">DIY合集</a>
  <a href="friends.html" class="btn" data-lang="friendsPage">好友</a>
  <a href="https://tks124.github.io/tks/rymd" class="btn" data-lang="credits">制作人员名单</a>
</div>
<footer data-lang="footer">© 太空杀124拥有最终解释权与所有权。</footer>

<div id="profileModal" class="modal-overlay">
  <div class="modal-content">
    <h3>编辑资料</h3>
    <input type="text" id="profileAccount" placeholder="账号名称">
    <select id="profileGender"><option value="男">男</option><option value="女">女</option><option value="保密">保密</option></select>
    <input type="text" id="profileBio" placeholder="个性签名">
    <div class="modal-buttons">
      <button class="btn-cancel" onclick="closeProfileModal()">取消</button>
      <button class="btn-confirm" onclick="saveProfile()">保存</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL="https://xryfrqxelzetzkgsaycl.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_bV150rxd0EeojJEL53Cgwg_Lc3ZUkoU";
let supabaseClient=null;
if(window.supabase)supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

const AUTH_KEY="sk124_auth_token";
const AUTH_PAGE_URL="https://tks124.github.io/tks";
const LANG_KEY="sk124_lang";
const RESERVED_NAME="太空杀124";
const RESERVED_OWNER_EMAIL="qwe18965540810@qq.com";

const translations={
  zh:{register:"注册",title:"Space Kill124",modSite:"改版官网",landlord:"斗地主",adminProfile:"管理员个人主页",officialApp:"官网软件版/v1.0.1",pvzCreator:"pvz2高级创作软件版/v3.2.8",qrcodeGen:"二维码生成",feedback:"意见反馈",personalHome:"个人主页",diy:"DIY合集",friendsPage:"好友",credits:"制作人员名单",footer:"© 太空杀124拥有最终解释权与所有权。",edit:"编辑资料",friends:"好友",logout:"退出登录",accountPrefix:"账号: ",uidPrefix:"UID: ",bioPrefix:"签名: "},
  en:{register:"Register",title:"Space Kill124",modSite:"Redesigned",landlord:"Landlord",adminProfile:"Admin's Profile",officialApp:"Official App",pvzCreator:"PVZ2 Creator",qrcodeGen:"QR Code",feedback:"Feedback",personalHome:"Profile",diy:"DIY",friendsPage:"Friends",credits:"Credits",footer:"© SpaceKill124 owns all rights.",edit:"Edit",friends:"Friends",logout:"Logout",accountPrefix:"Account: ",uidPrefix:"UID: ",bioPrefix:"Bio: "}
};
let currentLang=localStorage.getItem(LANG_KEY)||"zh";

function $(id){return document.getElementById(id);}
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function isReservedName(a,e){if(!a)return false;if(a.trim()!==RESERVED_NAME)return false;if(e&&e===RESERVED_OWNER_EMAIL)return false;return true;}
function badgeHTML(badge){
  if(!badge)return "";
  var letter=badge==="author"?"V":badge==="z"?"Z":badge==="s"?"S":badge==="a"?"A":"";
  return '<span class="badge badge-'+badge+'">'+letter+'</span>';
}

function applyLang(){
  var t=translations[currentLang];
  document.querySelectorAll("[data-lang]").forEach(function(el){
    var k=el.getAttribute("data-lang");
    if(t[k])el.textContent=t[k];
  });
  $("langBtn").textContent=currentLang==="zh"?"English":"中文";
  updateAccountDisplay();
}

function toggleLang(){
  currentLang=currentLang==="zh"?"en":"zh";
  localStorage.setItem(LANG_KEY,currentLang);
  applyLang();
}

async function updateAccountDisplay(){
  var regBtn=$("registerBtn");
  var accDisplay=$("accountDisplay");
  var email=localStorage.getItem("email");
  var t=translations[currentLang];
  if(!email){regBtn.style.display="";accDisplay.style.display="none";return;}
  var pr=await supabaseClient.from("profiles").select("*").eq("email",email).maybeSingle();
  var account=(pr.data&&pr.data.account)||localStorage.getItem("account")||email;
  var uid=(pr.data&&pr.data.uid)||localStorage.getItem("uid")||"-";
  var bio=(pr.data&&pr.data.bio)||localStorage.getItem("bio")||"";
  var badge=pr.data?pr.data.badge:"";
  localStorage.setItem("account",account);
  localStorage.setItem("uid",uid);
  localStorage.setItem("bio",bio);
  regBtn.style.display="none";
  accDisplay.innerHTML=
    '<div>'+t.accountPrefix+escapeHtml(account)+badgeHTML(badge)+'</div>'+
    '<div class="uid-line">'+t.uidPrefix+escapeHtml(uid)+'</div>'+
    '<div class="bio-line">'+t.bioPrefix+escapeHtml(bio||"—")+'</div>'+
    '<div class="acc-buttons">'+
      '<button class="btn-friend" onclick="location.href=\'friends.html\'">'+t.friends+'</button>'+
      '<button class="btn-edit" onclick="location.href=\'profile.html\'">'+t.edit+'</button>'+
      '<button class="btn-logout" onclick="doLogout()">'+t.logout+'</button>'+
    '</div>';
  accDisplay.style.display="block";
}

async function doLogout(){
  if(supabaseClient){try{await supabaseClient.auth.signOut();}catch(e){}}
  ["account","email","password","uid","gender","bio","sk124_auth_token"].forEach(function(k){localStorage.removeItem(k);});
  window.location.replace(AUTH_PAGE_URL);
}

function openProfileModal(){}
function closeProfileModal(){$("profileModal").classList.remove("show");}
async function saveProfile(){closeProfileModal();location.reload();}

$("langBtn").addEventListener("click",toggleLang);

window.addEventListener("load",function(){
  applyLang();
  if(localStorage.getItem(AUTH_KEY)!=="true"){window.location.replace(AUTH_PAGE_URL);return;}
  updateAccountDisplay();
});
</script>
</body>
</html>
