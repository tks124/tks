<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>好友 - SpaceKill124</title>
<style>
*{box-sizing:border-box;}
body{margin:0;background:#0f172a;color:#e2e8f0;font-family:'Microsoft YaHei',sans-serif;min-height:100vh;padding:20px 12px;}
.wrap{max-width:900px;margin:0 auto;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,0.1);}
.topbar h2{margin:0;font-size:20px;color:#fff;}
.topbar .me{font-size:13px;color:#94a3b8;}
.topbar button{padding:8px 16px;border:none;border-radius:8px;background:#3b82f6;color:#fff;cursor:pointer;font-size:13px;}
.grid{display:grid;grid-template-columns:320px 1fr;gap:16px;}
@media(max-width:760px){.grid{grid-template-columns:1fr;}}
.panel{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:16px;}
.panel h3{margin:0 0 12px 0;font-size:14px;color:#c4b5fd;}
.friend-item{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:rgba(255,255,255,0.03);border-radius:8px;margin-bottom:8px;font-size:14px;cursor:pointer;position:relative;}
.friend-item:hover{background:rgba(255,255,255,0.08);}
.friend-item .fname{color:#f1f5f9;font-weight:bold;display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
.friend-item .fuid{color:#94a3b8;font-size:12px;margin-left:6px;}
.dot-badge{position:absolute;left:2px;top:50%;transform:translateY(-50%);width:8px;height:8px;border-radius:50%;background:#3b82f6;}
.dot-badge.official{background:#e53935;width:10px;height:10px;box-shadow:0 0 8px #e53935;}
.friend-item.has-dot{padding-left:20px;}
.friend-item.has-dot.official{padding-left:24px;}
.empty{color:#64748b;font-size:13px;text-align:center;padding:16px 0;}
.chat-box{height:400px;overflow-y:auto;background:#0a0f1c;border-radius:8px;padding:12px;margin-bottom:10px;}
.chat-msg{margin-bottom:12px;font-size:14px;line-height:1.5;}
.chat-msg .who{color:#8b5cf6;font-weight:bold;font-size:12px;cursor:pointer;}
.chat-msg .who.other{color:#3b82f6;}
.chat-msg .who.mine{color:#10b981;}
.chat-msg .time{color:#64748b;font-size:11px;margin-left:6px;}
.chat-msg .text{color:#e2e8f0;display:block;margin-top:2px;word-break:break-word;white-space:pre-wrap;}
.chat-input{display:flex;gap:8px;}
.chat-input input{flex:1;padding:10px;border:1px solid #475569;border-radius:8px;background:#0f172a;color:#fff;font-size:14px;}
.chat-input button{padding:10px 18px;border:none;border-radius:8px;background:#10b981;color:#fff;cursor:pointer;font-size:13px;}
.official-card{background:linear-gradient(135deg,#7c2d12,#991b1b);border:1px solid #fbbf24;border-radius:10px;padding:14px;margin-bottom:10px;color:#fff;}
.official-card .oc-title{font-size:16px;font-weight:bold;margin-bottom:6px;}
.official-card .oc-body{font-size:13px;line-height:1.6;margin-bottom:8px;word-break:break-word;}
.official-card .oc-body img{max-width:100%;border-radius:8px;margin-top:6px;}
.official-card .oc-tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:rgba(255,255,255,.2);}
.official-card .oc-download{display:inline-block;margin-top:6px;padding:6px 12px;background:#fbbf24;color:#7c2d12;border-radius:6px;text-decoration:none;font-size:12px;font-weight:bold;}
.badge{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;font-size:9px;font-weight:700;color:#fff;line-height:1;}
.badge-author{background:#e53935;box-shadow:0 0 4px #ff5722,0 0 8px #ff9800;}
.badge-z{background:#2196f3;}.badge-s{background:#ffc107;}.badge-a{background:#e53935;}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h2>好友</h2>
    <div class="me" id="meInfo">—</div>
    <button onclick="location.href='SpaceKill124'">返回首页</button>
  </div>
  <div class="grid">
    <div>
      <div class="panel">
        <h3>好友列表</h3>
        <div id="friendList"><div class="empty">加载中...</div></div>
      </div>
    </div>
    <div class="panel">
      <h3 id="chatTitle">选择一个好友开始聊天</h3>
      <div class="chat-box" id="chatBox"></div>
      <div class="chat-input">
        <input type="text" id="chatInput" placeholder="输入消息..." onkeydown="if(event.key==='Enter')sendMsg()">
        <button onclick="sendMsg()">发送</button>
      </div>
    </div>
  </div>
</div>
<script>
const SUPABASE_URL="https://xryfrqxelzetzkgsaycl.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_bV150rxd0EeojJEL53Cgwg_Lc3ZUkoU";
const OFFICIAL_EMAIL="qwe18965540810@qq.com";
let supabaseClient=null;
if(window.supabase)supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

let myEmail="",myUid=null,myAccount="";
let friendsCache=[];
let currentFriend=null;
let chatTimer=null;
let officialLastSeen=parseInt(localStorage.getItem("official_last_seen")||"0",10);

function $(id){return document.getElementById(id);}
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmtTime(t){if(!t)return"";return new Date(t).toLocaleString("zh-CN");}
function badgeHTML(badge){
  if(!badge)return "";
  var letter=badge==="author"?"V":badge==="z"?"Z":badge==="s"?"S":badge==="a"?"A":"";
  return '<span class="badge badge-'+badge+'">'+letter+'</span>';
}

async function init(){
  if(!supabaseClient){document.body.innerHTML="<p style='text-align:center;padding:40px;'>Supabase 未加载</p>";return;}
  var ses=await supabaseClient.auth.getSession();
  var session=ses&&ses.data?ses.data.session:null;
  if(!session){window.location.href="SpaceKill124";return;}
  myEmail=session.user.email;
  var pr=await supabaseClient.from("profiles").select("*").eq("email",myEmail).maybeSingle();
  if(pr.data){myUid=pr.data.uid;myAccount=pr.data.account||myEmail;}
  $("meInfo").textContent=myAccount+" (UID:"+myUid+")";
  await ensureOfficialFriend();
  await loadFriends();
  if(!chatTimer)chatTimer=setInterval(function(){
    loadFriends();
    if(currentFriend)loadMessages();
  },5000);
}

async function ensureOfficialFriend(){
  var r=await supabaseClient.from("friends").select("id").or("and(requester_uid.eq."+myUid+",receiver_email.eq."+OFFICIAL_EMAIL+"),and(receiver_uid.eq."+myUid+",requester_email.eq."+OFFICIAL_EMAIL+")").maybeSingle();
  if(r.data)return;
  await supabaseClient.from("friends").insert([{requester_uid:myUid,requester_email:myEmail,receiver_email:OFFICIAL_EMAIL,status:"accepted",auto_official:true}]);
}

async function loadFriends(){
  var r=await supabaseClient.from("friends").select("*").or("requester_email.eq."+myEmail+",receiver_email.eq."+myEmail).eq("status","accepted");
  var data=r.data||[];
  if(data.length===0){$("friendList").innerHTML='<div class="empty">暂无好友</div>';return;}
  var otherEmails=data.map(function(x){return x.requester_email===myEmail?x.receiver_email:x.requester_email;});
  var pr=await supabaseClient.from("profiles").select("email,uid,account,avatar,badge").in("email",otherEmails);
  var map={};(pr.data||[]).forEach(function(p){map[p.email]=p;});
  friendsCache=otherEmails.map(function(e){return Object.assign({email:e},map[e]||{});});
  var html="";
  for(var i=0;i<friendsCache.length;i++){
    var f=friendsCache[i];
    var isOfficial=f.email===OFFICIAL_EMAIL;
    var hasDot=false;
    if(isOfficial){
      var lastPost=await supabaseClient.from("official_posts").select("created_at").order("created_at",{ascending:false}).limit(1).maybeSingle();
      if(lastPost.data){
        var t=new Date(lastPost.data.created_at).getTime();
        hasDot=t>officialLastSeen;
      }
    }
    var cls="friend-item";
    if(hasDot)cls+=" has-dot"+(isOfficial?" official":"");
    html+='<div class="'+cls+'" onclick="openFriend(\''+escapeHtml(f.email)+'\')">';
    if(hasDot)html+='<span class="dot-badge'+(isOfficial?' official':'')+'"></span>';
    html+='<div><div class="fname">'+escapeHtml(f.account||f.email)+badgeHTML(f.badge)+'</div><div class="fuid">'+(isOfficial?"官方账号":"UID: "+(f.uid||"—"))+'</div></div>';
    html+='</div>';
  }
  $("friendList").innerHTML=html;
}

async function openFriend(email){
  var f=friendsCache.find(function(x){return x.email===email;});
  if(!f)return;
  currentFriend=f;
  if(email===OFFICIAL_EMAIL){
    officialLastSeen=Date.now();
    localStorage.setItem("official_last_seen",String(officialLastSeen));
    $("chatTitle").textContent="官方账号";
    await loadOfficialPosts();
    await loadFriends();
  }else{
    $("chatTitle").textContent="与 "+(f.account||f.email)+" 聊天";
    await loadMessages();
  }
}

async function loadOfficialPosts(){
  var r=await supabaseClient.from("official_posts").select("*").order("created_at",{ascending:false}).limit(50);
  var box=$("chatBox");
  if(!r.data||r.data.length===0){box.innerHTML='<div class="empty">官方还没有发布内容</div>';return;}
  box.innerHTML=r.data.map(function(p){
    var body="";
    if(p.text_content)body+=escapeHtml(p.text_content);
    if(p.image_url)body+='<img src="'+escapeHtml(p.image_url)+'">';
    var download="";
    if(p.file_url)download='<br><a class="oc-download" href="'+escapeHtml(p.file_url)+'" download>下载 '+escapeHtml(p.file_name||"文件")+'</a>';
    var type="官方动态";
    if(p.content_type==="image")type="官方图片";
    if(p.content_type==="file")type="官方文件";
    return '<div class="official-card"><div class="oc-title">'+escapeHtml(type)+'</div><div class="oc-body">'+(body||"（仅文件）")+download+'</div><div class="oc-tag">'+fmtTime(p.created_at)+'</div></div>';
  }).join("");
}

async function loadMessages(){
  if(!currentFriend||currentFriend.email===OFFICIAL_EMAIL)return;
  var r=await supabaseClient.from("chat_messages").select("*").eq("channel","private").or("and(sender_email.eq."+myEmail+",receiver_email.eq."+currentFriend.email+"),and(sender_email.eq."+currentFriend.email+",receiver_email.eq."+myEmail+")").order("created_at",{ascending:true});
  var box=$("chatBox");
  if(!r.data||r.data.length===0){box.innerHTML='<div class="empty">还没有消息</div>';return;}
  box.innerHTML=r.data.map(function(m){
    var mine=m.sender_email===myEmail;
    var whoName=mine?myAccount:(currentFriend.account||currentFriend.email);
    return '<div class="chat-msg"><span class="who'+(mine?" mine":" other")+'">'+escapeHtml(whoName)+'</span><span class="time">'+fmtTime(m.created_at)+'</span><span class="text">'+escapeHtml(m.content)+'</span></div>';
  }).join("");
  box.scrollTop=box.scrollHeight;
}

async function sendMsg(){
  if(!currentFriend){alert("请先选择好友");return;}
  if(currentFriend.email===OFFICIAL_EMAIL){alert("官方账号为单向通知，不能回复");return;}
  var content=$("chatInput").value.trim();
  if(!content)return;
  await supabaseClient.from("chat_messages").insert([{sender_email:myEmail,sender_uid:myUid,receiver_email:currentFriend.email,channel:"private",content:content}]);
  $("chatInput").value="";
  await loadMessages();
}

window.addEventListener("DOMContentLoaded",init);
</script>
</body>
</html>
