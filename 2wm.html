<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太空杀124二维码生成器</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f4f4f9; margin: 0;}
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; width: 350px;}
        h2 { margin-top: 0; color: #333; }
        input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; font-size: 16px;}
        button { width: 100%; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin-bottom: 10px; transition: 0.3s;}
        .btn-generate { background: #4CAF50; color: white; }
        .btn-generate:hover { background: #45a049; }
        .btn-download { background: #008CBA; color: white; display: none;}
        .btn-download:hover { background: #007bb5; }
        #qrcode { margin: 20px auto; display: flex; justify-content: center; }
        #qrcode img, #qrcode canvas { border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h2 data-lang="heading">二维码生成器</h2>
        <input type="text" id="text-input" data-lang-placeholder="inputPlaceholder" placeholder="输入网址或文本内容..." value="">
        <button class="btn-generate" id="generateBtn" onclick="generateQR()" data-lang="btnGenerate">生成二维码</button>

        <div id="qrcode"></div>

        <button id="download-btn" class="btn-download" onclick="downloadQR()" data-lang="btnDownload">下载二维码图片</button>
    </div>

    <script>
        const AUTH_KEY = "sk124_auth_token";
        const AUTH_PAGE_URL = "https://tks124.github.io/tks/";
        const LANG_KEY = "sk124_lang";

        // ============ 语言支持（只读，不提供切换） ============
        const currentLang = localStorage.getItem(LANG_KEY) === 'en' ? 'en' : 'zh';

        const translations = {
            zh: {
                pageTitle: "太空杀124二维码生成器",
                heading: "二维码生成器",
                inputPlaceholder: "输入网址或文本内容...",
                btnGenerate: "生成二维码",
                btnDownload: "下载二维码图片",
                alertEmpty: "请输入内容！",
                alertNoQR: "请先生成二维码！"
            },
            en: {
                pageTitle: "SpaceKill124 QR Code Generator",
                heading: "QR Code Generator",
                inputPlaceholder: "Enter a URL or text...",
                btnGenerate: "Generate QR Code",
                btnDownload: "Download QR Code Image",
                alertEmpty: "Please enter some content!",
                alertNoQR: "Please generate a QR code first!"
            }
        };

        const t = translations[currentLang];

        function applyLanguage() {
            document.title = t.pageTitle;
            document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : 'en';

            document.querySelectorAll('[data-lang]').forEach(el => {
                const key = el.getAttribute('data-lang');
                if (t[key] !== undefined) {
                    el.textContent = t[key];
                }
            });

            document.querySelectorAll('[data-lang-placeholder]').forEach(el => {
                const key = el.getAttribute('data-lang-placeholder');
                if (t[key] !== undefined) {
                    el.setAttribute('placeholder', t[key]);
                }
            });
        }
        // ============ 语言支持结束 ============

        window.onload = function() {
            applyLanguage();
            if (localStorage.getItem(AUTH_KEY) !== "true") {
                window.location.replace(AUTH_PAGE_URL);
            } else {
                generateQR();
            }
        };

        let qrcodeInstance = null;

        function generateQR() {
            const text = document.getElementById('text-input').value.trim();
            const qrContainer = document.getElementById('qrcode');
            const downloadBtn = document.getElementById('download-btn');

            if (!text) {
                alert(t.alertEmpty);
                return;
            }

            qrContainer.innerHTML = '';

            qrcodeInstance = new QRCode(qrContainer, {
                text: text,
                width: 200,
                height: 200,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });

            downloadBtn.style.display = 'inline-block';
        }

        function downloadQR() {
            const canvas = document.querySelector('#qrcode canvas');
            const img = document.querySelector('#qrcode img');
            let dataURL = '';

            if (canvas) {
                dataURL = canvas.toDataURL('image/png');
            } else if (img) {
                dataURL = img.src;
            } else {
                alert(t.alertNoQR);
                return;
            }

            const link = document.createElement('a');
            link.download = 'qrcode.png';
            link.href = dataURL;
            link.click();
        }
    </script>
</body>
          </html>
