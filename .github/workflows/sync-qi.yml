name: sync-qi
# trigger: board-render-fix
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-qi.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch payload from Supabase
        env:
          SB_URL: https://topdhxrkknnkfkcwegxl.supabase.co
          SB_KEY: sb_publishable_U_BQvZL_ehjGkuZszGScYA_OnyExEYq
        run: |
          set -e
          mkdir -p /tmp/out
          NAMES="index.html compat.js qi_index.html 令牌介绍.html token-info.json rjyz.html jianyujianzhushi.html qita.html 2wm.html rymd.html zc.html zc2.html zc3.html jg.html cd.html yhdja.html yhdja-full.html yhdja-mods.html yhdja-sweet.html"
          for n in $NAMES; do
            echo "== $n"
            enc=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$n")
            curl -fsS "$SB_URL/rest/v1/qi_sync?name=eq.$enc&select=b64" \
              -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); sys.stdout.write(d[0]['b64'])" > "/tmp/$n.b64"
            base64 -d "/tmp/$n.b64" | gunzip > "/tmp/out/$n"
            ls -la "/tmp/out/$n"
          done
      - name: Copy into repo
        run: |
          set -e
          for n in index.html compat.js token-info.json rjyz.html jianyujianzhushi.html qita.html 2wm.html rymd.html zc.html zc2.html zc3.html jg.html cd.html yhdja.html yhdja-full.html yhdja-mods.html yhdja-sweet.html; do
            cp "/tmp/out/$n" "./$n"
          done
          cp "/tmp/out/令牌介绍.html" "./令牌介绍.html"
          mkdir -p ./qi
          cp /tmp/out/qi_index.html ./qi/index.html
          echo "--- verify ---"
          grep -c "resolveAdmin" ./index.html || true
          grep -c "initSbTks" ./qi/index.html || true
      - name: Commit
        run: |
          git config user.name "qi-sync-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "修复棋盘渲染：高度预算与线条可见度；管理员判定沿用 diy.html" || echo "no changes"
          git push
