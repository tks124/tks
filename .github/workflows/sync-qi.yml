name: sync-qi
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-qi.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch payload from Supabase
        env:
          SB_URL: https://topdhxrkknnkfkcwegxl.supabase.co
          SB_KEY: sb_publishable_U_BQvZL_ehjGkuZszGScYA_OnyExEYq
        run: |
          set -e
          mkdir -p /tmp/out/qi
          for n in compat.js SpaceKill124.html diy.html friends.html profile.html zc4.html qi_index.html; do
            echo "== $n"
            curl -fsS "$SB_URL/rest/v1/qi_sync?name=eq.$n&select=b64" \
              -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); sys.stdout.write(d[0]['b64'])" > /tmp/$n.b64
            base64 -d /tmp/$n.b64 | gunzip > /tmp/out/$n
            ls -la /tmp/out/$n
          done
          mv /tmp/out/qi_index.html /tmp/out/qi/index.html
      - name: Copy into repo
        run: |
          set -e
          cp /tmp/out/compat.js ./compat.js
          cp /tmp/out/SpaceKill124.html ./SpaceKill124.html
          cp /tmp/out/diy.html ./diy.html
          cp /tmp/out/friends.html ./friends.html
          cp /tmp/out/profile.html ./profile.html
          cp /tmp/out/zc4.html ./zc4.html
          mkdir -p ./qi
          cp /tmp/out/qi/index.html ./qi/index.html
          head -c 120 ./qi/index.html; echo
          grep -c "compat.js" ./SpaceKill124.html || true
      - name: Commit
        run: |
          git config user.name "qi-sync-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "部署 qi 棋类大全页面 + 全站兼容层（多CDN容错/老内核polyfill/安全桩），修复登录 auth of null" || echo "no changes"
          git push
