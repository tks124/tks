name: sync-qi
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-qi.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch payload from Supabase
        env:
          SB_URL: https://topdhxrkknnkfkcwegxl.supabase.co
          SB_KEY: sb_publishable_U_BQvZL_ehjGkuZszGScYA_OnyExEYq
        run: |
          set -e
          mkdir -p /tmp/out
          NAMES="index.html qi_index.html 令牌介绍.html token-info.json rjyz.html jianyujianzhushi.html qita.html 2wm.html rymd.html zc.html zc2.html zc3.html jg.html cd.html yhdja.html yhdja-full.html yhdja-mods.html yhdja-sweet.html SpaceKill124.html diy.html friends.html profile.html zc4.html"
          for n in $NAMES; do
            echo "== $n"
            enc=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$n")
            curl -fsS "$SB_URL/rest/v1/qi_sync?name=eq.$enc&select=b64" \
              -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); sys.stdout.write(d[0]['b64'])" > "/tmp/$n.b64"
            base64 -d "/tmp/$n.b64" | gunzip > "/tmp/out/$n"
            ls -la "/tmp/out/$n"
          done
      - name: Copy into repo
        run: |
          set -e
          for n in index.html token-info.json rjyz.html jianyujianzhushi.html qita.html 2wm.html rymd.html zc.html zc2.html zc3.html jg.html cd.html yhdja.html yhdja-full.html yhdja-mods.html yhdja-sweet.html SpaceKill124.html diy.html friends.html profile.html zc4.html; do
            cp "/tmp/out/$n" "./$n"
          done
          cp "/tmp/out/令牌介绍.html" "./令牌介绍.html"
          mkdir -p ./qi
          cp /tmp/out/qi_index.html ./qi/index.html
          rm -f ./compat.js
          echo "--- verify ---"
          grep -c "compat.js" ./index.html || true
          grep -o "当前版本 v[0-9.]*" ./令牌介绍.html || true
          grep -o "1\.[0-9]\.0" ./token-info.json | head -3 || true
      - name: Commit
        run: |
          git config user.name "qi-sync-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "恢复登录逻辑与服务器配置；登录失败提示规范为三句；管理员沿用 ADMIN_EMAIL 判定并加二次密码+2FA 校验" || echo "no changes"
          git push
