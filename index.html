<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaceKill124 - 官网入口</title>
    <style>
        body { margin: 0; padding: 0; background: linear-gradient(180deg, #000000 0%, #111827 100%); color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; flex-direction: column; }
        .container { text-align: center; width: 100%; max-width: 400px; padding: 20px; }
        h1 { font-size: 3rem; margin-bottom: 50px; font-weight: 700; letter-spacing: 2px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .btn { display: block; width: 100%; padding: 18px; margin: 20px 0; border: none; border-radius: 8px; font-size: 1.2rem; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 8px rgba(0,0,0,0.2); }
        .btn:active { transform: translateY(0); }
        .btn-blue { background: linear-gradient(to right, #3b82f6, #2563eb); color: white; }
        .btn-green { background: linear-gradient(to right, #10b981, #059669); color: white; }
        .btn-small { display: inline-block; width: auto; padding: 8px 16px; margin: 5px; border: none; border-radius: 6px; font-size: 0.9rem; cursor: pointer; transition: all 0.3s ease; }
        .btn-register { background: linear-gradient(to right, #8b5cf6, #7c3aed); color: white; }
        .btn-login { background: linear-gradient(to right, #f59e0b, #d97706); color: white; }
        .footer { position: absolute; bottom: 20px; font-size: 0.8rem; color: #9ca3af; width: 100%; text-align: center; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.85); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .modal-content { background: #1f2937; padding: 40px; border-radius: 12px; width: 90%; max-width: 350px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); border: 1px solid #374151; text-align: center; }
        .modal-content h2 { margin-top: 0; margin-bottom: 30px; font-size: 1.5rem; color: #f3f4f6; }
        .modal-input { width: 100%; padding: 15px; margin-bottom: 15px; border: 1px solid #4b5563; border-radius: 6px; background: #111827; color: white; box-sizing: border-box; font-size: 1rem; }
        .modal-input::placeholder { color: #6b7280; }
        .modal-input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3); }
        .modal-buttons { display: flex; gap: 15px; margin-top: 20px; }
        .modal-btn { flex: 1; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; transition: opacity 0.2s; }
        .modal-btn:hover { opacity: 0.9; }
        .modal-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-cancel { background: #ef4444; color: white; }
        .btn-confirm { background: #10b981; color: white; }
        .user-info { position: absolute; top: 20px; right: 20px; color: #9ca3af; font-size: 0.9rem; }
        .user-info span { color: #3b82f6; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="user-info" id="userInfo" style="display:none;">
        已登录: <span id="userEmail"></span>
        <button class="btn-small btn-login" onclick="logout()" style="margin-left:10px;">退出</button>
    </div>

    
    <div class="container" id="mainContainer">
        <h1>Space Kill124</h1>
        <button id="registerBtn" class="btn btn-blue">注册账号</button>
        <button id="loginBtn" class="btn btn-green">登录</button>
    </div>

    
    <div class="container" id="contentContainer" style="display:none;">
        <h1>Space Kill124</h1>
        <p style="font-size:1.2rem;color:#10b981;">欢迎回来，你已经登录成功！</p>
        <button class="btn-small btn-register" onclick="openProfileModal()" style="margin-top:20px;">编辑资料</button>
    </div>

    <div class="footer">© 太空杀124拥有最终解释权与所有权/www.spacekill124.cn</div>

    
    <div id="registerModal" class="modal-overlay">
        <div class="modal-content">
            <h2>注册账号</h2>
            
            
            <div id="regStep1">
                <input type="email" id="regEmail" class="modal-input" placeholder="邮箱地址">
                <button id="sendCodeBtn" class="modal-btn btn-confirm" style="width:100%;">获取验证码</button>
                <p id="regMsg" style="color:#9ca3af;font-size:0.9rem;margin-top:10px;min-height:20px;"></p>
            </div>
            
            
            <div id="regStep2" style="display:none;">
                <input type="text" id="regCode" class="modal-input" placeholder="输入6位验证码" maxlength="6" style="text-align:center;letter-spacing:2px;">
                <button id="verifyCodeBtn" class="modal-btn btn-confirm" style="width:100%;">验证并注册</button>
                <button class="modal-btn btn-cancel" onclick="closeModal('registerModal')" style="width:100%;margin-top:10px;">取消</button>
            </div>
            
            
            <div id="regStep3" style="display:none;">
                <p style="color:#10b981;margin-bottom:15px;">邮箱验证通过！</p>
                <input type="text" id="regAccount" class="modal-input" placeholder="设置账号名">
                <input type="password" id="regPassword" class="modal-input" placeholder="设置密码（至少6位）">
                <button id="completeRegBtn" class="modal-btn btn-confirm" style="width:100%;">完成注册</button>
                <button class="modal-btn btn-cancel" onclick="closeModal('registerModal')" style="width:100%;margin-top:10px;">取消</button>
            </div>
        </div>
    </div>

    
    <div id="loginModal" class="modal-overlay">
        <div class="modal-content">
            <h2>登录账号</h2>
            <input type="email" id="loginEmail" class="modal-input" placeholder="邮箱地址">
            <input type="password" id="loginPassword" class="modal-input" placeholder="密码">
            <div class="modal-buttons">
                <button class="modal-btn btn-cancel" onclick="closeModal('loginModal')">取消</button>
                <button class="modal-btn btn-confirm" onclick="handleLogin()">登录</button>
            </div>
        </div>
    </div>
    
    <div id="profileModal" class="modal-overlay">
        <div class="modal-content">
            <h2>编辑资料</h2>
            <input type="text" id="profileAccount" class="modal-input" placeholder="账号名称">
            <select id="profileGender" class="modal-input">
                <option value="男">男</option>
                <option value="女">女</option>
                <option value="保密">保密</option>
            </select>
            <input type="text" id="profileBio" class="modal-input" placeholder="个人简介">
            <div class="modal-buttons">
                <button class="modal-btn btn-cancel" onclick="closeProfileModal()">取消</button>
                <button class="modal-btn btn-confirm" onclick="saveProfile()">保存</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://xryfrqxelzetzkgsaycl.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_bV150rxd0EeojJEL53Cgwg_Lc3ZUkoU";

        let supabaseClient = null;

        if (window.supabase) {
            try {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            } catch (error) {
                console.error("Supabase 初始化失败:", error);
            }
        } else {
            console.error("Supabase 脚本未加载");
        }

        document.addEventListener("DOMContentLoaded", function() {
            checkAuthState();


            document.getElementById("registerBtn").addEventListener("click", function() {
                openModal("registerModal");

                document.getElementById("regStep1").style.display = "block";
                document.getElementById("regStep2").style.display = "none";
                document.getElementById("regStep3").style.display = "none";
                document.getElementById("regEmail").value = "";
                document.getElementById("regMsg").textContent = "";
            });


            document.getElementById("loginBtn").addEventListener("click", function() {
                openModal("loginModal");
            });


            window.addEventListener("click", (e) => {
                if (e.target === document.getElementById("registerModal")) {
                    closeModal("registerModal");
                }
                if (e.target === document.getElementById("loginModal")) {
                    closeModal("loginModal");
                }
            });
        });

        function openModal(id) {
            document.getElementById(id).style.display = "flex";
        }

        function closeModal(id) {
            document.getElementById(id).style.display = "none";
        }


        let pendingEmail = "";


        document.getElementById("sendCodeBtn").addEventListener("click", async () => {
            const email = document.getElementById("regEmail").value.trim();
            if (!email) {
                document.getElementById("regMsg").textContent = "请先输入邮箱！";
                document.getElementById("regMsg").style.color = "#ef4444";
                return;
            }

            const btn = document.getElementById("sendCodeBtn");
            btn.disabled = true;
            btn.textContent = "发送中...";
            document.getElementById("regMsg").textContent = "";

            try {

                const { error } = await supabaseClient.auth.signInWithOtp({
                    email: email,
                    options: {
                        emailRedirectTo: window.location.origin,
                    }
                });

                if (error) {
                    document.getElementById("regMsg").textContent = "发送失败: " + error.message;
                    document.getElementById("regMsg").style.color = "#ef4444";
                    btn.disabled = false;
                    btn.textContent = "获取验证码";
                } else {
                    pendingEmail = email;
                    document.getElementById("regMsg").textContent = "验证码已发送至邮箱，请查收！";
                    document.getElementById("regMsg").style.color = "#10b981";

                    document.getElementById("regStep1").style.display = "none";
                    document.getElementById("regStep2").style.display = "block";
                    document.getElementById("regCode").focus();
                }
            } catch (err) {
                document.getElementById("regMsg").textContent = "系统错误: " + err.message;
                document.getElementById("regMsg").style.color = "#ef4444";
                btn.disabled = false;
                btn.textContent = "获取验证码";
            }
        });


        document.getElementById("verifyCodeBtn").addEventListener("click", async () => {
            const email = pendingEmail;
            const token = document.getElementById("regCode").value.trim();

            if (!token || token.length !== 6) {
                alert("请输入6位验证码！");
                return;
            }

            const btn = document.getElementById("verifyCodeBtn");
            btn.disabled = true;
            btn.textContent = "验证中...";

            try {

                const { data, error } = await supabaseClient.auth.verifyOtp({
                    email: email,
                    token: token,
                    type: "email"
                });

                if (error) {
                    alert("验证失败: " + error.message);
                    btn.disabled = false;
                    btn.textContent = "验证并注册";
                } else {

                    if (data.user && !data.user.email_confirmed_at) {

                        document.getElementById("regStep2").style.display = "none";
                        document.getElementById("regStep3").style.display = "block";
                    } else {

                        alert("验证成功！欢迎回来！");
                        closeModal("registerModal");
                        checkAuthState();
                    }
                    btn.disabled = false;
                    btn.textContent = "验证并注册";
                }
            } catch (err) {
                alert("验证出错: " + err.message);
                btn.disabled = false;
                btn.textContent = "验证并注册";
            }
        });


        document.getElementById("completeRegBtn").addEventListener("click", async () => {
            const account = document.getElementById("regAccount").value.trim();
            const password = document.getElementById("regPassword").value;

            if (!account) {
                alert("请输入账号名！");
                return;
            }

            if (!password || password.length < 6) {
                alert("密码长度至少6位！");
                return;
            }

            const btn = document.getElementById("completeRegBtn");
            btn.disabled = true;
            btn.textContent = "注册中...";

            try {

                const { error } = await supabaseClient.auth.updateUser({
                    password: password,
                    data: {
                        account: account
                    }
                });

                if (error) {
                    alert("注册完成失败: " + error.message);
                } else {

                    try {
                        const { error: signInError } = await supabaseClient.auth.signInWithPassword({
                            email: pendingEmail,
                            password: password
                        });
                        if (signInError) {
                            localStorage.setItem("email", pendingEmail);
                            localStorage.setItem("password", password);
                            localStorage.setItem("account", account);
                            alert("密码已设置成功！请重新登录。");
                        } else {
                            localStorage.setItem("email", pendingEmail);
                            localStorage.setItem("password", password);
                            localStorage.setItem("account", account);
                            alert("注册成功！");
                            closeModal("registerModal");
                            window.location.href = "rjyz.html";
                        }
                    } catch (err) {
                        localStorage.setItem("email", pendingEmail);
                        localStorage.setItem("password", password);
                        localStorage.setItem("account", account);
                        alert("注册成功但自动登录失败，请手动登录。");
                    }
                }
                btn.disabled = false;
                btn.textContent = "完成注册";
            } catch (err) {
                alert("注册出错: " + err.message);
                btn.disabled = false;
                btn.textContent = "完成注册";
            }
        });


        async function handleLogin() {
            const email = document.getElementById("loginEmail").value.trim();
            const password = document.getElementById("loginPassword").value;

            if (!email || !password) {
                alert("请填写邮箱和密码");
                return;
            }

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    alert("登录失败: " + error.message);
                } else {

                    localStorage.setItem("email", email);
                    alert("登录成功！");
                    closeModal("loginModal");
                    document.getElementById("loginEmail").value = "";
                    document.getElementById("loginPassword").value = "";
                    window.location.href = "rjyz.html";
                }
            } catch (err) {
                alert("登录出错: " + err.message);
            }
        }


        async function logout() {
            await supabaseClient.auth.signOut();
            checkAuthState();
            alert("已退出登录");
        }


        async function checkAuthState() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            const mainContainer = document.getElementById("mainContainer");
            const contentContainer = document.getElementById("contentContainer");
            const userInfo = document.getElementById("userInfo");
            const userEmail = document.getElementById("userEmail");

            if (session) {

                mainContainer.style.display = "none";
                contentContainer.style.display = "block";
                userInfo.style.display = "block";
                const savedAccount = localStorage.getItem("account");
                userEmail.textContent = savedAccount ? savedAccount : session.user.email;
            } else {

                mainContainer.style.display = "block";
                contentContainer.style.display = "none";
                userInfo.style.display = "none";
            }
        }
        function openProfileModal() {
            document.getElementById("profileModal").style.display = "flex";
            var savedAccount = localStorage.getItem("account");
            var savedGender = localStorage.getItem("gender");
            var savedBio = localStorage.getItem("bio");
            if (savedAccount) document.getElementById("profileAccount").value = savedAccount;
            if (savedGender) document.getElementById("profileGender").value = savedGender;
            if (savedBio) document.getElementById("profileBio").value = savedBio;
        }

        function closeProfileModal() {
            document.getElementById("profileModal").style.display = "none";
        }

        function saveProfile() {
            var account = document.getElementById("profileAccount").value.trim();
            var gender = document.getElementById("profileGender").value;
            var bio = document.getElementById("profileBio").value.trim();
            if (!account) { alert("请输入账号名称！"); return; }
            localStorage.setItem("account", account);
            localStorage.setItem("gender", gender);
            localStorage.setItem("bio", bio);
            var userEmailSpan = document.getElementById("userEmail");
            if (userEmailSpan) { userEmailSpan.textContent = account; }
            alert("资料已保存！");
            closeProfileModal();
        }

        document.addEventListener("DOMContentLoaded", function() {
            var savedAccount = localStorage.getItem("account");
            if (savedAccount) {
                var userEmailSpan = document.getElementById("userEmail");
                if (userEmailSpan) { userEmailSpan.textContent = savedAccount; }
            }
        });
    </script>
</body>
</html>
