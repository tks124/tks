<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Kill124 - 官网入口</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        h1 {
            margin-bottom: 40px;
            font-size: 2.5rem;
            letter-spacing: 2px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 300px;
        }
        button {
            padding: 15px 20px;
            font-size: 1.1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s;
            font-weight: bold;
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn-secret {
            background-color: #28a745;
            color: white;
            font-size: 0.9rem;
            opacity: 0.8;
        }
        .footer {
            margin-top: 50px;
            font-size: 0.8rem;
            color: #666;
        }

        /* --- 模态框（弹窗）的样式 --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: #2a2a2a;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 350px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
        }
        .modal-content h2 {
            margin-top: 0;
            font-size: 1.5rem;
            margin-bottom: 20px;
        }
        .modal-input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 6px;
            border: 1px solid #444;
            background-color: #1a1a1a;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
        }
        .modal-btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .modal-btn {
            padding: 10px 20px;
            font-size: 1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            flex: 1;
        }
        .btn-confirm {
            background-color: #28a745;
            color: white;
        }
        .btn-cancel {
            background-color: #dc3545;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Space Kill124</h1>
    <div class="btn-group">
        <button class="btn-secondary" onclick="alert('打开邮箱，向该tks124@foxmail.com邮箱发送申请二字  管理员上班时间7:00~9:00，时间可能变动，请耐心等待')">获取专属邀请码</button>
        <button class="btn-secret" onclick="openModal()">输入邀请码进入</button>
    </div>
    <div class="footer">© 太空杀124拥有最终解释权与所有权。</div>

    <!-- 模态框的HTML结构 -->
    <div id="codeModal" class="modal-overlay">
        <div class="modal-content">
            <h2>请输入邀请码</h2>
            <input type="text" id="inviteInput" class="modal-input" placeholder="请输入四至六位数邀请码...." autofocus>
            <div class="modal-btn-group">
                <button class="modal-btn btn-cancel" onclick="closeModal()">取消</button>
                <button class="modal-btn btn-confirm" onclick="verifyCode()">确定进入</button>
            </div>
        </div>
    </div>

    <script>
        const FULL_URL = "https://tks124.github.io/rjyz/";
        const BLOCK_URL = "https://tks124.github.io/jg/";
        const AUTH_KEY = "sk124_auth_token";
        
        const MAX_VISITS = 20;      // 允许的最大访问次数
        const TIME_WINDOW = 60000;  // 时间窗口 (毫秒)，例如 60000 = 1分钟
        const VISIT_COUNT_KEY = "sk124_visit_count";
        const VISIT_TIME_KEY = "sk124_visit_time";

        const validCodes = [
            "1939", 
            "0124", 
            "tks124",
           "3120",
            "3434",
            "12grr",
            "3412"
        ];
        
        function securityCheck() {
            const now = Date.now();
            let count = parseInt(localStorage.getItem(VISIT_COUNT_KEY)) || 0;
            let lastTime = parseInt(localStorage.getItem(VISIT_TIME_KEY)) || 0;

            if (now - lastTime > TIME_WINDOW) {
                count = 1;
                localStorage.setItem(VISIT_TIME_KEY, now.toString());
            } else {
                count++;
            }

            localStorage.setItem(VISIT_COUNT_KEY, count.toString());

            if (count > MAX_VISITS) {
                window.location.replace(BLOCK_URL);
            }
        }

        securityCheck();

        window.onload = function() {
            if (localStorage.getItem(AUTH_KEY) === "true") {
                window.location.replace(FULL_URL);
            }
        };

        function openModal() {
            document.getElementById('codeModal').style.display = 'flex';
            setTimeout(() => {
                document.getElementById('inviteInput').focus();
            }, 100);
        }

        function closeModal() {
            document.getElementById('codeModal').style.display = 'none';
            document.getElementById('inviteInput').value = '';
        }

        function verifyCode() {
            const inputElement = document.getElementById('inviteInput');
            const userInput = inputElement.value.trim();

            if (!userInput) {
                alert("请输入邀请码！");
                return;
            }

            if (validCodes.includes(userInput)) {
                localStorage.setItem(AUTH_KEY, "true");
                alert("验证成功！正在跳转...");
                closeModal();
                setTimeout(() => {
                    window.location.reload();
                }, 2000);
            } else {
                alert("邀请码无效，请核对后重试。");
                inputElement.value = '';
                inputElement.focus();
            }
        }

        document.getElementById('inviteInput').addEventListener("keypress", function(e) {
            if (e.key === "Enter") {
                verifyCode();
            }
        });
    </script>
    <meta name="robots" content="index, follow">
<link rel="sitemap" type="application/xml" href="/sitemap.xml">
</body>
</html>
