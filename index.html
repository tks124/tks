<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Kill124 - 官网入口</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        h1 { margin-bottom: 40px; font-size: 2.5rem; letter-spacing: 2px; }
        .btn-group { display: flex; flex-direction: column; gap: 20px; width: 300px; }
        button {
            padding: 15px 20px; font-size: 1.1rem; border: none; border-radius: 8px;
            cursor: pointer; transition: transform 0.1s; font-weight: bold;
        }
        button:active { transform: scale(0.98); }
        .btn-primary { background-color: #007bff; color: white; }
        .btn-secondary { background-color: #6c757d; color: white; }
        .btn-secret { background-color: #28a745; color: white; font-size: 0.9rem; opacity: 0.8; }
        .footer { margin-top: 50px; font-size: 0.8rem; color: #666; }
    </style>
</head>
<body>

    <h1>Space Kill124</h1>

    <div class="btn-group">
        <button class="btn-primary" onclick="window.location.href='https://tks124.github.io/Space-Kill-124/'">改版官网</button>
        <button class="btn-secondary" onclick="alert('请发送邮件反馈,官方邮箱tks124@foxmail.com')">意见反馈</button>
        <button class="btn-secret" onclick="checkInviteCode()">输入邀请码进入</button>
    </div>

    <div class="footer">© 太空杀124拥有最终解释权与所有权。</div>

    <script>
        const FULL_URL = "https://tks124.github.io/Space-Kill-124/";
        const AUTH_KEY = "sk124_auth_token";
        const JSON_FILE = "codes.json"; // 存放加密后邀请码的文件

        // 页面加载时检查本地标记
        window.onload = function() {
            if (localStorage.getItem(AUTH_KEY) === "true") {
                window.location.replace(FULL_URL);
            }
        };

        // 核心加密比对函数 (使用 SHA-256 算法)
        async function getHash(str) {
            const buffer = new TextEncoder().encode(str);
            const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // 验证逻辑
        async function checkInviteCode() {
            let inputCode = prompt("请输入访问邀请码：");
            if (!inputCode) return;

            try {
                const response = await fetch(JSON_FILE);
                if (!response.ok) throw new Error("无法加载配置文件");
                
                const data = await response.json();
                const encryptedList = data.encrypted_codes; // 获取密文列表

                // 将用户输入的明文进行加密，然后比对
                const inputHash = await getHash(inputCode.trim());
                
                if (encryptedList.includes(inputHash)) {
                    localStorage.setItem(AUTH_KEY, "true");
                    alert("验证成功！正在跳转...");
                    window.location.href = FULL_URL;
                } else {
                    alert("邀请码无效，请核对后重试。");
                }
            } catch (error) {
                alert("网络错误或文件配置有误。");
            }
        }
    </script>
</body>
</html>
