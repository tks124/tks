    var _q7 = [10, 15, 109, 104, 30, 9, 19, 31, 8, 10, 8, 28, 23, 18, 110, 111];

    function _r4(a) {
        var s = '';
        for (var i = 0; i < a.length; i++) {
            s += String.fromCharCode(a[i] ^ 0x5a);
        }
        return s;
    }

    function _base32Decode(base32) {
        var alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
        var cleaned = base32.toUpperCase().replace(/=+$/, '');
        var bits = 0;
        var value = 0;
        var bytes = [];
        for (var i = 0; i < cleaned.length; i++) {
            var idx = alphabet.indexOf(cleaned[i]);
            if (idx === -1) continue;
            value = (value << 5) | idx;
            bits += 5;
            if (bits >= 8) {
                bytes.push((value >>> (bits - 8)) & 0xff);
                bits -= 8;
            }
        }
        return new Uint8Array(bytes);
    }

    function _v9() {
        return _base32Decode(_r4(_q7));
    }

    async function _t0(secretBytes, step) {
        try {
            const key = await crypto.subtle.importKey(
                'raw',
                secretBytes,
                { name: 'HMAC', hash: 'SHA-1' },
                false,
                ['sign']
            );
            const timeBytes = new Uint8Array(8);
            let temp = step;
            for (let i = 7; i >= 0; i--) {
                timeBytes[i] = temp & 0xff;
                temp = temp >> 8;
            }
            const sig = await crypto.subtle.sign('HMAC', key, timeBytes);
            const hash = new Uint8Array(sig);
            const offset = hash[hash.length - 1] & 0x0f;
            const code = ((hash[offset] & 0x7f) << 24) |
                         ((hash[offset + 1] & 0xff) << 16) |
                         ((hash[offset + 2] & 0xff) << 8) |
                         (hash[offset + 3] & 0xff);
            return (code % 1000000).toString().padStart(6, '0');
        } catch (e) {
            return null;
        }
    }

                2031: [8,27], 2032: [9,15], 2033: [9,4], 2034: [9,23], 2035: [9,12]
            },
            doubleNine: {
                2024: [10,11], 2025: [10,9], 2026: [10,28], 2027: [10,17], 2028: [9,27], 2029: [10,15], 2030: [10,5],
                2031: [9,24], 2032: [10,12], 2033: [10,1], 2034: [10,20], 2035: [10,9]
            }
        };
        
        var now = new Date();
        var year = now.getFullYear();
        var month = now.getMonth() + 1;
        var day = now.getDate();
        
        if (year < 2024 || year > 2035) return null;
        var lunarKeys = ['springFestival','lanternFestival','dragonBoat','qixi','ghostFestival','midAutumn','doubleNine'];
        for (var k = 0; k < lunarKeys.length; k++) {
            var key = lunarKeys[k];
            if (lunarHolidays[key] && lunarHolidays[key][year]) {
                var d = lunarHolidays[key][year];
                if (d[0] === month && d[1] === day) {
                    var map = {
                        springFestival: 'spring-festival',
                        lanternFestival: 'lantern-festival',
                        dragonBoat: 'dragon-boat',
                        qixi: 'qixi',
                        ghostFestival: 'ghost-festival',
                        midAutumn: 'mid-autumn',
                        doubleNine: 'double-nine'
                    };
                    return map[key];
                }
            }
        }
        var fixedHolidays = {
            '1-1': 'new-year',
            '1-14': 'valentine',
            '3-8': 'womens-day',
            '3-12': 'arbor-day',
            '4-1': 'fools-day',
            '4-4': 'qingming', '4-5': 'qingming', '4-6': 'qingming',
            '5-1': 'labor-day',

            '10-1': 'national-day', '10-2': 'national-day', '10-3': 'national-day',
            '10-4': 'national-day', '10-5': 'national-day', '10-6': 'national-day',
            '10-7': 'national-day',
            '10-31': 'halloween',
            '12-25': 'christmas'
        };
        
        var key2 = month + '-' + day;
        if (fixedHolidays[key2]) {
            return fixedHolidays[key2];
        }
        
        return null;
    }
    
    function applyHolidayTheme() {
        var holiday = getLunarInfo();
        var body = document.body;
        if (holiday) {
            body.setAttribute('data-holiday', holiday);
        } else {
            body.removeAttribute('data-holiday');
        }
    }
    window.addEventListener('load', applyHolidayTheme);
    setInterval(applyHolidayTheme, 60000);
