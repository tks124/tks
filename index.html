        const now = Date.now();
        let count = parseInt(localStorage.getItem(VISIT_COUNT_KEY)) || 0;

        if (now - lastTime > TIME_WINDOW) {

        if (fixedHolidays[key2]) { return fixedHolidays[key2]; }
        return null;
    }

    function applyHolidayTheme() {
        var holiday = getLunarInfo();
        var body = document.body;
        if (holiday) { body.setAttribute('data-holiday', holiday); }
        else { body.removeAttribute('data-holiday'); }
    }

    window.addEventListener('load', applyHolidayTheme);
    setInterval(applyHolidayTheme, 60000);

    window.onload = function() {
        securityCheck();
        applyHolidayTheme();
        updateClock();
        setInterval(async () => { await updateClock(); }, 1000);
        updateText();
        if (localStorage.getItem(AUTH_KEY) === "true") { showSafetyWarning(FULL_URL); }
    };
