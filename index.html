        function isReservedName(account, email) {
            if (!account) return false;

        function base32Decode(str){
            const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
            let bits = "";
            str = String(str||"").replace(/=+$/,"").toUpperCase();
            for(let i=0;i<str.length;i++){
                const v = alphabet.indexOf(str.charAt(i));
                if(v<0) continue;
                bits += v.toString(2).padStart(5,"0");
            }
            const bytes = [];
            for(let j=0;j+8<=bits.length;j+=8){
                bytes.push(parseInt(bits.substring(j,j+8),2));
            }
            return bytes;
        }
        function genTOTP(secret, timeSec){
            const t0 = timeSec!==undefined?timeSec:Math.floor(Date.now()/1000);
            const keyBytes = base32Decode(secret);
            const counter = Math.floor(t0/30);
            const high = Math.floor(counter/0x100000000);
            const low = counter - high*0x100000000;
            const msgBytes = [(high>>>24)&255,(high>>>16)&255,(high>>>8)&255,high&255,(low>>>24)&255,(low>>>16)&255,(low>>>8)&255,low&255];
            const keyHex = keyBytes.map(b=>("0"+b.toString(16)).slice(-2)).join("");
            const msgHex = msgBytes.map(b=>("0"+b.toString(16)).slice(-2)).join("");
            const hmac = CryptoJS.HmacSHA1(CryptoJS.enc.Hex.parse(msgHex), CryptoJS.enc.Hex.parse(keyHex));
            const hmacArray = Array.from(CryptoJS.enc.Hex.parse(hmac.toString()).words).reduce((acc,w)=>{
                return acc.concat([(w>>>24)&255,(w>>>16)&255,(w>>>8)&255,w&255]);
            },[]);
            const offset = hmacArray[hmacArray.length-1]&15;
            const code = ((hmacArray[offset]&127)<<24)|((hmacArray[offset+1]&255)<<16)|((hmacArray[offset+2]&255)<<8)|(hmacArray[offset+3]&255);
            return String(code%1000000).padStart(6,"0");
        }
        function verifyTOTP(secret, code){
            const now = Math.floor(Date.now()/1000);
            for(let i=-1;i<=1;i++){
                if(genTOTP(secret, now+i*30) === code) return true;
            }
            return false;
        }

        async function checkBan(uid){
            if(!uid) return false;
            try{
                const { data, error } = await supabaseClient
                    .from("bans")
                    .select("*")
                    .eq("target_uid", uid);
                if (error || !data || data.length === 0) return false;
                const now = Date.now();
                for (const b of data) {
                    if (b.ban_type === "permanent") return b;
                    if (b.expires_at && new Date(b.expires_at).getTime() > now) return b;
                }
                return false;
            }catch(e){ return false; }
        }

        async function ensureProfile(email, account) {
            if (!supabaseClient || !email) return null;
            try {
                const { data, error } = await supabaseClient.from("profiles").select("*").eq("email", email).maybeSingle();
                if (error) { console.error("查询资料失败:", error); return null; }
                if (data) return data;
                const { data: inserted, error: insErr } = await supabaseClient.from("profiles")
                    .insert([{ email: email, account: account || email }]).select().single();
                if (insErr) { console.error("创建资料失败:", insErr); return null; }
                return inserted;
            } catch (e) { console.error("ensureProfile 异常:", e); return null; }
        }

                .update({ account: account, gender: gender, bio: bio }).eq("email", email);

            const { data, error } = await query;

            if (!account) { alert("请输入账号名！"); return; }
            if (!password || password.length < 6) { alert("密码长度至少6位！"); return; }
            if (isReservedName(account, pendingEmail)) { alert("该账号名为保留名称，仅限指定邮箱使用！"); return; }
            const btn = document.getElementById("completeRegBtn");
            btn.disabled = true; btn.textContent = "注册中...";
            try {
                const taken = await isAccountTaken(account, null);
                if (taken) { alert("账号名已被占用，请换一个！"); btn.disabled = false; btn.textContent = "完成注册"; return; }
                const { error } = await supabaseClient.auth.updateUser({ password: password, data: { account: account } });
                if (error) { alert("注册失败: " + error.message); btn.disabled = false; btn.textContent = "完成注册"; return; }
                const { error: signInError } = await supabaseClient.auth.signInWithPassword({ email: pendingEmail, password: password });
                if (signInError) {
                    localStorage.setItem("email", pendingEmail);
                    alert("密码已设置成功！请重新登录。");
                    btn.disabled = false; btn.textContent = "完成注册";
                    return;
                }
                const profile = await ensureProfile(pendingEmail, account);
                localStorage.setItem("email", pendingEmail);
                localStorage.setItem("password", password);
                localStorage.setItem("sk124_auth_token", "true");
                if (profile) renderUserInfo(profile, pendingEmail);
                alert("注册成功！你的 UID 是 " + (profile ? profile.uid : "-"));
                closeModal("registerModal");
                window.location.href = "rjyz.html";
            } catch (err) {
                alert("注册出错: " + err.message);
                btn.disabled = false; btn.textContent = "完成注册";
            }
        });

        document.getElementById("loginSendCodeBtn").addEventListener("click", async () => {
            const email = document.getElementById("loginCodeEmail").value.trim();
            if (!email) { alert("请先输入邮箱！"); return; }
            const btn = document.getElementById("loginSendCodeBtn");
            btn.disabled = true; btn.textContent = "发送中...";
            try {
                const { error } = await supabaseClient.auth.signInWithOtp({ email: email, options: { emailRedirectTo: window.location.origin } });
                if (error) {
                    alert("发送失败: " + error.message);
                    btn.disabled = false; btn.textContent = "获取验证码";
                } else {
                    alert("验证码已发送至邮箱，请查收！");
                    btn.disabled = false; btn.textContent = "重新发送";
                    document.getElementById("loginCode").focus();
                }
            } catch (err) {
                alert("系统错误: " + err.message);
                btn.disabled = false; btn.textContent = "获取验证码";
            }
        });

        async function handleLogin() {
            if (loginMode === "pwd") await loginWithPassword();
            else await loginWithCode();
        }

        async function loginWithPassword() {
            const email = document.getElementById("loginEmail").value.trim();
            const password = document.getElementById("loginPassword").value;
            if (!email || !password) { alert("请填写邮箱和密码"); return; }
            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email: email, password: password });
                if (error) { alert("登录失败: " + error.message); return; }
                await finishLoginAfterAuth(data.user, email, password);
            } catch (err) { alert("登录出错: " + err.message); }
        }

        async function loginWithCode() {
            const email = document.getElementById("loginCodeEmail").value.trim();
            const token = document.getElementById("loginCode").value.trim();
            if (!email) { alert("请输入邮箱地址！"); return; }
            if (!token || token.length !== 6) { alert("请输入6位验证码！"); return; }
            try {
                const { data, error } = await supabaseClient.auth.verifyOtp({ email: email, token: token, type: "email" });
                if (error) { alert("登录失败: " + error.message); return; }
                await finishLoginAfterAuth(data.user, email, "");
            } catch (err) { alert("登录出错: " + err.message); }
        }

        async function finishLoginAfterAuth(user, email, password) {
            let profile = await ensureProfile(email, user.user_metadata ? user.user_metadata.account : "");
            if (profile) {
                const banned = await enforceBan(profile.uid, email, profile.account);
                if (banned) return;
            }
            if (profile && profile.two_factor_secret) {
                pendingLoginInfo = { email: email, password: password, profile: profile };
                closeModal("loginModal");
                document.getElementById("twoFACode").value = "";
                document.getElementById("twoFAMsg").textContent = "";
                openModal("twoFAModal");
                document.getElementById("twoFACode").focus();
                return;
            }
            await completeLogin(email, password, profile);
        }

        async function completeLogin(email, password, profile) {
            if (profile) {
                const banned = await enforceBan(profile.uid, email, profile.account);
                if (banned) return;
            }
            localStorage.setItem("email", email);
            if (password) localStorage.setItem("password", password);
            localStorage.setItem("sk124_auth_token", "true");
            if (profile) renderUserInfo(profile, email);
            alert("登录成功！你的 UID 是 " + (profile ? profile.uid : "-"));
            closeModal("twoFAModal");
            closeModal("loginModal");
            window.location.href = "rjyz.html";
        }

        async function confirm2FALogin() {
            const code = document.getElementById("twoFACode").value.trim();
            const msg = document.getElementById("twoFAMsg");
            if (!code || code.length !== 6) { msg.textContent = "请输入6位动态验证码"; return; }
            if (!pendingLoginInfo) { msg.textContent = "会话已过期，请重新登录"; return; }
            const secret = pendingLoginInfo.profile.two_factor_secret;
            const ok = verifyTOTP(secret, code);
            if (!ok) { msg.textContent = "验证码错误，请重试"; return; }
            await completeLogin(pendingLoginInfo.email, pendingLoginInfo.password, pendingLoginInfo.profile);
            pendingLoginInfo = null;
        }

        async function cancel2FALogin() {
            pendingLoginInfo = null;
            closeModal("twoFAModal");
            if (supabaseClient) { try { await supabaseClient.auth.signOut(); } catch (e) {} }
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            localStorage.removeItem("account");
            localStorage.removeItem("email");
            localStorage.removeItem("password");
            localStorage.removeItem("uid");
            localStorage.removeItem("gender");
            localStorage.removeItem("bio");
            localStorage.removeItem("sk124_auth_token");
            checkAuthState();
            alert("已退出登录");
        }

        function enterSite() {
            localStorage.setItem("sk124_auth_token", "true");
            window.location.href = "rjyz.html";
        }

        async function checkAuthState() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            const mainContainer = document.getElementById("mainContainer");
            const contentContainer = document.getElementById("contentContainer");
            const userInfo = document.getElementById("userInfo");
            if (session) {
                const profile = await ensureProfile(session.user.email, session.user.user_metadata ? session.user.user_metadata.account : "");
                if (profile) {
                    const banned = await enforceBan(profile.uid, session.user.email, profile.account);
                    if (banned) {
                        mainContainer.style.display = "block";
                        contentContainer.style.display = "none";
                        userInfo.style.display = "none";
                        return;
                    }
                }
                mainContainer.style.display = "none";
                contentContainer.style.display = "block";
                userInfo.style.display = "block";
                if (profile) renderUserInfo(profile, session.user.email);
            } else {
                mainContainer.style.display = "block";
                contentContainer.style.display = "none";
                userInfo.style.display = "none";
            }
        }

        function openProfileModal() {
            document.getElementById("profileModal").style.display = "flex";
            document.getElementById("profileAccount").value = localStorage.getItem("account") || "";
            document.getElementById("profileGender").value = localStorage.getItem("gender") || "保密";
            document.getElementById("profileBio").value = localStorage.getItem("bio") || "";
        }
        function closeProfileModal() { document.getElementById("profileModal").style.display = "none"; }

        async function saveProfile() {
            const account = document.getElementById("profileAccount").value.trim();
            const gender = document.getElementById("profileGender").value;
            const bio = document.getElementById("profileBio").value.trim();
            if (!account) { alert("请输入账号名称！"); return; }
            const email = localStorage.getItem("email");
            if (isReservedName(account, email)) { alert("该账号名为保留名称，仅限指定邮箱使用！"); return; }
            const taken = await isAccountTaken(account, email);
            if (taken) { alert("该账号名已被使用，请换一个！"); return; }
            const res = await saveProfileToDB(email, account, gender, bio);
            if (!res.ok) { alert("保存失败: " + res.msg); return; }
            localStorage.setItem("account", account);
            localStorage.setItem("gender", gender);
            localStorage.setItem("bio", bio);
            const uid = localStorage.getItem("uid") || "-";
            document.getElementById("userEmail").textContent = "UID:" + uid + " " + account;
            document.getElementById("userUid").textContent = uid;
            document.getElementById("userBio").textContent = bio || "还没有个性签名";
            alert("资料已保存！");
            closeProfileModal();
        }
</script>
</body>
</html>
