<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>彩蛋</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            padding: 20px;
        }

        .content {
            text-align: center;
        }

        .text-line {
            color: #ffffff;
            font-size: 28px;
            line-height: 1.8;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="content">
        <p class="text-line" data-lang="hint">你有注意过pvz2高级创作地图ID查询网站的通知公告吗🤔</p>
    </div>

    <script>
        const LANG_KEY = "sk124_lang";
        const currentLang = localStorage.getItem(LANG_KEY) === 'en' ? 'en' : 'zh';

        const translations = {
            zh: {
                pageTitle: "彩蛋",
                hint: "你有注意过pvz2高级创作地图ID查询网站的通知公告吗🤔"
            },
            en: {
                pageTitle: "Easter Egg",
                hint: "Have you ever noticed the announcement on the PVZ2 Advanced Creator map ID lookup website? 🤔"
            }
        };

        const t = translations[currentLang];

        document.title = t.pageTitle;
        document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : 'en';

        document.querySelectorAll('[data-lang]').forEach(el => {
            const key = el.getAttribute('data-lang');
            if (t[key] !== undefined) {
                el.textContent = t[key];
            }
        });
    </script>
</body>
</html>
