<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人主页 - SpaceKill124</title>
<style>
*{box-sizing:border-box;}
body{margin:0;padding:0;background:linear-gradient(180deg,#0f172a 0%,#1e293b 100%);font-family:'Microsoft YaHei',sans-serif;min-height:100vh;color:#e2e8f0;display:flex;justify-content:center;align-items:flex-start;padding:40px 15px;}
body.light{background:linear-gradient(180deg,#f1f5f9 0%,#e2e8f0 100%);color:#0f172a;}
.card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:18px;width:100%;max-width:560px;padding:36px 30px;box-shadow:0 20px 50px rgba(0,0,0,0.4);}
body.light .card{background:#fff;border-color:#e2e8f0;}
.avatar{width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#3b82f6);display:flex;justify-content:center;align-items:center;font-size:38px;font-weight:bold;color:white;margin:0 auto 18px auto;box-shadow:0 8px 20px rgba(139,92,246,0.4);overflow:hidden;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.account-name{text-align:center;font-size:24px;font-weight:bold;margin-bottom:6px;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:6px;}
.uid-badge{display:block;text-align:center;font-size:13px;color:#94a3b8;margin-bottom:25px;}
.uid-badge span{background:rgba(139,92,246,0.2);border:1px solid rgba(139,92,246,0.5);padding:3px 12px;border-radius:20px;color:#c4b5fd;font-weight:bold;}
.stats-row{display:flex;justify-content:center;gap:30px;margin-bottom:20px;}
.stat{text-align:center;cursor:pointer;padding:6px 14px;border-radius:10px;transition:background .2s;}
.stat:hover{background:rgba(255,255,255,0.06);}
body.light .stat:hover{background:rgba(0,0,0,0.04);}
.stat-num{font-size:20px;font-weight:bold;color:#8b5cf6;}
.stat-label{font-size:12px;color:#94a3b8;margin-top:2px;}
.info-row{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid rgba(255,255,255,0.08);font-size:15px;}
body.light .info-row{border-color:rgba(0,0,0,0.06);}
.info-row:last-child{border-bottom:none;}
.info-label{color:#94a3b8;}
.info-value{color:#f1f5f9;font-weight:500;text-align:right;max-width:65%;word-break:break-all;}
body.light .info-value{color:#0f172a;}
.bio-box{margin-top:18px;background:rgba(255,255,255,0.04);border-left:3px solid #8b5cf6;border-radius:8px;padding:14px 16px;font-size:14px;color:#cbd5e1;line-height:1.6;min-height:50px;word-break:break-word;}
body.light .bio-box{background:rgba(0,0,0,0.03);color:#334155;}
.bio-title{font-size:12px;color:#94a3b8;margin-bottom:6px;letter-spacing:1px;}
.actions{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap;}
.actions button{flex:1;min-width:100px;padding:13px;border:none;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer;color:white;}
.btn-edit{background:linear-gradient(to right,#8b5cf6,#7c3aed);}
.btn-friend{background:linear-gradient(to right,#06b6d4,#0891b2);}
.btn-back{background:linear-gradient(to right,#3b82f6,#2563eb);}
.btn-logout{background:linear-gradient(to right,#ef4444,#dc2626);}
.btn-report{background:linear-gradient(to right,#ef4444,#dc2626);}
.btn-setting{background:linear-gradient(to right,#64748b,#475569);}
.btn-verify{background:linear-gradient(to right,#f59e0b,#d97706);}
.btn-follow{background:linear-gradient(to right,#8b5cf6,#7c3aed);}
.btn-follow.followed{background:#475569;}
.badge{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;font-size:10px;font-weight:700;color:#fff;line-height:1;}
.badge-author{background:#e53935;box-shadow:0 0 4px #ff5722,0 0 8px #ff9800;}
.badge-z{background:#2196f3;}
.badge-s{background:#ffc107;}
.badge-a{background:#e53935;}
.badge-text{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:#f0f7ff;color:#2196f3;margin-left:4px;}
.badge-text-author{background:#fff3e0;color:#e65100;}
.loading{text-align:center;color:#94a3b8;padding:60px 0;font-size:15px;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:1000;justify-content:center;align-items:center;padding:20px;}
.modal-overlay.show{display:flex;}
.modal-content{background:#1e293b;border:1px solid #334155;padding:30px;border-radius:14px;width:100%;max-width:400px;color:white;max-height:80vh;overflow-y:auto;}
body.light .modal-content{background:#fff;color:#0f172a;border-color:#e2e8f0;}
.modal-content h3{margin:0 0 20px 0;text-align:center;}
.modal-content input,.modal-content select,.modal-content textarea{width:100%;padding:12px;margin-bottom:12px;border:1px solid #475569;border-radius:8px;background:#0f172a;color:white;font-size:14px;box-sizing:border-box;font-family:inherit;}
body.light .modal-content input,body.light .modal-content select,body.light .modal-content textarea{background:#f1f5f9;color:#0f172a;border-color:#cbd5e1;}
.modal-content textarea{min-height:100px;resize:vertical;}
.modal-buttons{display:flex;gap:10px;margin-top:10px;}
.modal-buttons button{flex:1;padding:11px;border:none;border-radius:8px;font-size:14px;cursor:pointer;color:white;font-weight:bold;}
.btn-cancel{background:#64748b;}
.btn-confirm{background:#10b981;}
.modal-status{font-size:12px;text-align:center;margin-top:8px;min-height:16px;}
.verify-item{background:rgba(255,255,255,0.05);border-radius:10px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
body.light .verify-item{background:rgba(0,0,0,0.03);}
.verify-item.locked{opacity:0.45;}
.verify-item-title{font-size:14px;font-weight:bold;}
.verify-item-desc{font-size:12px;color:#94a3b8;margin-top:4px;}
.verify-item button{padding:8px 14px;border:none;border-radius:8px;background:linear-gradient(to right,#f59e0b,#d97706);color:#fff;font-size:12px;font-weight:bold;cursor:pointer;flex-shrink:0;}
.verify-item button:disabled{background:#475569;cursor:not-allowed;}
.user-list-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(255,255,255,0.03);border-radius:8px;margin-bottom:8px;}
body.light .user-list-item{background:rgba(0,0,0,0.03);}
.user-list-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#3b82f6);display:flex;align-items:center;justify-content:center;font-weight:bold;color:#fff;font-size:14px;flex-shrink:0;overflow:hidden;}
.user-list-avatar img{width:100%;height:100%;object-fit:cover;}
.user-list-name{flex:1;font-size:14px;}
.toast-fixed{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;z-index:9999;max-width:80vw;text-align:center;}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="card">
  <div id="loadingBox" class="loading">加载中...</div>
  <div id="profileBox" style="display:none;">
    <div class="avatar" id="avatarBox">?</div>
    <div class="account-name" id="nameBox">—</div>
    <div class="uid-badge">UID: <span id="uidBox">—</span></div>
    <div class="stats-row">
      <div class="stat" onclick="openFollowingList()">
        <div class="stat-num" id="followingCount">0</div>
        <div class="stat-label">关注</div>
      </div>
      <div class="stat" onclick="openFollowersList()">
        <div class="stat-num" id="followersCount">0</div>
        <div class="stat-label">粉丝</div>
      </div>
    </div>
    <div class="info-row"><span class="info-label">邮箱</span><span class="info-value" id="emailBox">—</span></div>
    <div class="info-row"><span class="info-label">性别</span><span class="info-value" id="genderBox">—</span></div>
    <div class="bio-box"><div class="bio-title">个性签名</div><div id="bioBox">这个人很懒，什么都没留下。</div></div>
    <div class="actions" id="actionsBox"></div>
  </div>
</div>

<div id="editModal" class="modal-overlay" onclick="if(event.target===this)closeModal('editModal')">
  <div class="modal-content">
    <h3>编辑资料</h3>
    <input type="text" id="editAccount" placeholder="账号名称">
    <select id="editGender"><option value="男">男</option><option value="女">女</option><option value="保密">保密</option></select>
    <input type="text" id="editBio" placeholder="个性签名">
    <div class="modal-buttons">
      <button class="btn-cancel" onclick="closeModal('editModal')">取消</button>
      <button class="btn-confirm" onclick="saveEdit()">保存</button>
    </div>
    <p class="modal-status" id="editStatus"></p>
  </div>
</div>

<div id="reportModal" class="modal-overlay" onclick="if(event.target===this)closeModal('reportModal')">
  <div class="modal-content">
    <h3>举报用户</h3>
    <textarea id="reportReason" placeholder="请填写举报理由..."></textarea>
    <div class="modal-buttons">
      <button class="btn-cancel" onclick="closeModal('reportModal')">取消</button>
      <button class="btn-confirm" onclick="submitReport()">提交举报</button>
    </div>
    <p class="modal-status" id="reportStatus"></p>
  </div>
</div>

<div id="verifyModal" class="modal-overlay" onclick="if(event.target===this)closeModal('verifyModal')">
  <div class="modal-content">
    <h3>认证中心</h3>
    <div id="verifyList"></div>
    <p class="modal-status" id="verifyStatus"></p>
    <div class="modal-buttons">
      <button class="btn-cancel" onclick="closeModal('verifyModal')">关闭</button>
    </div>
  </div>
</div>

<div id="listModal" class="modal-overlay" onclick="if(event.target===this)closeModal('listModal')">
  <div class="modal-content">
    <h3 id="listTitle">列表</h3>
    <div id="listBody"></div>
    <div class="modal-buttons">
      <button class="btn-cancel" onclick="closeModal('listModal')">关闭</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL="https://xryfrqxelzetzkgsaycl.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_bV150rxd0EeojJEL53Cgwg_Lc3ZUkoU";
let supabaseClient=null;
if(window.supabase)supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

const AUTH_KEY="sk124_auth_token";
const AUTH_PAGE_URL="https://tks124.github.io/tks";
const RESERVED_NAME="太空杀124";
const RESERVED_OWNER_EMAIL="qwe18965540810@qq.com";

let currentEmail="",myEmail="",myUid=null,myAccount="",targetProfile=null,isSelf=true;

function $(id){return document.getElementById(id);}
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toast(msg){
  var el=document.createElement("div");
  el.className="toast-fixed";
  el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(function(){document.body.removeChild(el);},2200);
}
function openModal(id){$(id).classList.add("show");}
function closeModal(id){$(id).classList.remove("show");}
function maskEmail(e){
  if(!e)return"—";
  var at=e.indexOf("@");
  if(at<0)return e;
  var pre=e.substring(0,at),suf=e.substring(at);
  if(pre.length<=4)return pre+"***"+suf;
  return pre.substring(0,4)+"***"+suf;
}
function isReservedName(account,email){
  if(!account)return false;
  if(account.trim()!==RESERVED_NAME)return false;
  if(email&&email===RESERVED_OWNER_EMAIL)return false;
  return true;
}
function getTargetUidFromUrl(){
  var params=new URLSearchParams(window.location.search);
  var uid=params.get("uid");
  if(uid&&/^\d+$/.test(uid))return parseInt(uid,10);
  return null;
}
function badgeHTML(badge,badgeText){
  if(!badge)return "";
  var letter = badge==="author"?"V":badge==="z"?"Z":badge==="s"?"S":badge==="a"?"A":"";
  var textMap={author:"官方",z:"10万粉认证",s:"百万粉认证",a:"企业认证"};
  return '<span class="badge badge-'+badge+'">'+letter+'</span><span class="badge-text badge-text-'+badge+'">'+escapeHtml(textMap[badge]||"")+'</span>';
}

async function loadProfile(){
  if(!supabaseClient){$("loadingBox").textContent="Supabase 未加载";return;}
  var ses=await supabaseClient.auth.getSession();
  var session=ses&&ses.data?ses.data.session:null;
  if(!session){window.location.replace(AUTH_PAGE_URL);return;}
  myEmail=session.user.email;
  var spr=await supabaseClient.from("profiles").select("*").eq("email",myEmail).maybeSingle();
  if(!spr.data){$("loadingBox").textContent="无法获取自己的资料";return;}
  myUid=spr.data.uid;
  myAccount=spr.data.account||myEmail;

  var targetUid=getTargetUidFromUrl();
  if(targetUid&&targetUid!==myUid){
    isSelf=false;
    var opr=await supabaseClient.from("profiles").select("*").eq("uid",targetUid).maybeSingle();
    if(!opr.data){$("loadingBox").textContent="未找到该用户";return;}
    targetProfile=opr.data;currentEmail=opr.data.email;
  }else{
    isSelf=true;targetProfile=spr.data;currentEmail=spr.data.email;
  }

  $("loadingBox").style.display="none";
  $("profileBox").style.display="block";

  var account=targetProfile.account||currentEmail;
  var uid=targetProfile.uid||"-";
  var gender=targetProfile.gender||"保密";
  var bio=targetProfile.bio||"";
  var avatar=targetProfile.avatar||"";

  var av=$("avatarBox");
  if(avatar){av.innerHTML='<img src="'+escapeHtml(avatar)+'">';}
  else{av.textContent=account.charAt(0).toUpperCase();}

  $("nameBox").innerHTML=escapeHtml(account)+badgeHTML(targetProfile.badge,targetProfile.badge_text);
  $("uidBox").textContent=uid;
  $("emailBox").textContent=isSelf?currentEmail:maskEmail(currentEmail);
  $("genderBox").textContent=gender;
  $("bioBox").textContent=bio||"这个人很懒，什么都没留下。";

  var fr=await supabaseClient.from("diy_follows").select("*",{count:"exact",head:true}).eq("target_email",currentEmail);
  $("followersCount").textContent=(fr.count||0);
  var fg=await supabaseClient.from("diy_follows").select("*",{count:"exact",head:true}).eq("follower_email",currentEmail);
  $("followingCount").textContent=(fg.count||0);

  if(isSelf){
    localStorage.setItem("account",account);
    localStorage.setItem("uid",uid);
    localStorage.setItem("email",currentEmail);
    renderSelfActions();
    await checkVerifyNotification();
  }else{
    renderOtherActions();
  }
}

function renderSelfActions(){
  $("actionsBox").innerHTML=
    '<button class="btn-edit" onclick="openEdit()">编辑资料</button>'+
    '<button class="btn-verify" onclick="openVerify()">认证</button>'+
    '<button class="btn-friend" onclick="location.href=\'friends.html\'">好友</button>'+
    '<button class="btn-back" onclick="location.href=\'SpaceKill124_源代码.html\'">返回首页</button>';
}

function renderOtherActions(){
  var followed=localStorage.getItem("follow_"+currentEmail)==="1";
  $("actionsBox").innerHTML=
    '<button class="btn-follow'+(followed?' followed':'')+'" id="followBtn" onclick="toggleFollow()">'+(followed?'已关注':'关注')+'</button>'+
    '<button class="btn-report" onclick="openModal(\'reportModal\')">举报</button>'+
    '<button class="btn-back" onclick="history.back()">返回</button>';
}

async function toggleFollow(){
  if(!myEmail){toast("请先登录");return;}
  var followed=localStorage.getItem("follow_"+currentEmail)==="1";
  var newFollowed=!followed;
  if(newFollowed){
    await supabaseClient.from("diy_follows").insert([{follower_email:myEmail,target_email:currentEmail}]);
  }else{
    await supabaseClient.from("diy_follows").delete().eq("follower_email",myEmail).eq("target_email",currentEmail);
  }
  localStorage.setItem("follow_"+currentEmail,newFollowed?"1":"0");
  var btn=$("followBtn");
  btn.textContent=newFollowed?"已关注":"关注";
  btn.classList.toggle("followed",newFollowed);
  var fr=await supabaseClient.from("diy_follows").select("*",{count:"exact",head:true}).eq("target_email",currentEmail);
  $("followersCount").textContent=(fr.count||0);
}

async function openFollowersList(){
  $("listTitle").textContent="粉丝";
  $("listBody").innerHTML='<div class="loading" style="padding:20px;">加载中...</div>';
  openModal("listModal");
  var r=await supabaseClient.from("diy_follows").select("follower_email").eq("target_email",currentEmail);
  if(!r.data||r.data.length===0){$("listBody").innerHTML='<div style="text-align:center;color:#94a3b8;padding:20px;">还没有粉丝</div>';return;}
  var emails=r.data.map(function(x){return x.follower_email;});
  var pr=await supabaseClient.from("profiles").select("email,account,avatar").in("email",emails);
  var map={};(pr.data||[]).forEach(function(p){map[p.email]=p;});
  $("listBody").innerHTML=emails.map(function(e){
    var p=map[e]||{};
    var name=p.account||maskEmail(e);
    var av=p.avatar?'<img src="'+escapeHtml(p.avatar)+'">':escapeHtml(name.charAt(0).toUpperCase());
    return '<div class="user-list-item"><div class="user-list-avatar">'+av+'</div><div class="user-list-name">'+escapeHtml(name)+'</div></div>';
  }).join("");
}

async function openFollowingList(){
  $("listTitle").textContent="关注";
  $("listBody").innerHTML='<div class="loading" style="padding:20px;">加载中...</div>';
  openModal("listModal");
  var r=await supabaseClient.from("diy_follows").select("target_email").eq("follower_email",currentEmail);
  if(!r.data||r.data.length===0){$("listBody").innerHTML='<div style="text-align:center;color:#94a3b8;padding:20px;">还没有关注任何人</div>';return;}
  var emails=r.data.map(function(x){return x.target_email;});
  var pr=await supabaseClient.from("profiles").select("email,account,avatar").in("email",emails);
  var map={};(pr.data||[]).forEach(function(p){map[p.email]=p;});
  $("listBody").innerHTML=emails.map(function(e){
    var p=map[e]||{};
    var name=p.account||maskEmail(e);
    var av=p.avatar?'<img src="'+escapeHtml(p.avatar)+'">':escapeHtml(name.charAt(0).toUpperCase());
    return '<div class="user-list-item"><div class="user-list-avatar">'+av+'</div><div class="user-list-name">'+escapeHtml(name)+'</div></div>';
  }).join("");
}

async function openVerify(){
  openModal("verifyModal");
  $("verifyStatus").textContent="";
  $("verifyList").innerHTML='<div style="text-align:center;padding:20px;color:#94a3b8;">加载中...</div>';
  var fr=await supabaseClient.from("diy_follows").select("*",{count:"exact",head:true}).eq("target_email",myEmail);
  var followers=fr.count||0;
  var pend=await supabaseClient.from("verify_requests").select("badge").eq("user_email",myEmail).eq("status","pending");
  var pendingBadges={};(pend.data||[]).forEach(function(x){pendingBadges[x.badge]=true;});
  var items=[
    {badge:"z",name:"10万粉认证",need:100000,desc:"需要粉丝数 ≥ 100,000"},
    {badge:"s",name:"百万粉认证",need:1000000,desc:"需要粉丝数 ≥ 1,000,000"},
    {badge:"a",name:"企业认证",need:1000,desc:"需要管理员审核，粉丝数 ≥ 1,000"}
  ];
  var html="";
  items.forEach(function(it){
    var unlocked=followers>=it.need;
    var pending=!!pendingBadges[it.badge];
    var btnText=pending?"审核中":(unlocked?"申请认证":"未达标");
    var disabled=pending||!unlocked;
    html+='<div class="verify-item'+(unlocked?'':' locked')+'"><div><div class="verify-item-title">'+escapeHtml(it.name)+'</div><div class="verify-item-desc">'+escapeHtml(it.desc)+'</div></div><button '+(disabled?'disabled':'')+' onclick="applyVerify(\''+it.badge+'\')">'+btnText+'</button></div>';
  });
  $("verifyList").innerHTML=html;
  $("verifyStatus").textContent="当前粉丝数："+followers;
}

async function applyVerify(badge){
  var statusEl=$("verifyStatus");
  statusEl.textContent="提交中...";
  statusEl.style.color="#94a3b8";
  var existing=await supabaseClient.from("verify_requests").select("id").eq("user_email",myEmail).eq("status","pending").maybeSingle();
  if(existing.data){statusEl.textContent="你已有待审核的认证申请";statusEl.style.color="#f59e0b";return;}
  var fr=await supabaseClient.from("diy_follows").select("*",{count:"exact",head:true}).eq("target_email",myEmail);
  var followers=fr.count||0;
  var r=await supabaseClient.from("verify_requests").insert([{
    user_email:myEmail,
    user_uid:myUid,
    user_account:myAccount,
    badge:badge,
    followers:followers,
    status:"pending"
  }]);
  if(r.error){statusEl.textContent="提交失败: "+r.error.message;statusEl.style.color="#ef4444";return;}
  statusEl.textContent="已提交申请，请等待审核";
  statusEl.style.color="#10b981";
  setTimeout(function(){closeModal("verifyModal");loadProfile();},1200);
}

async function checkVerifyNotification(){
  var r=await supabaseClient.from("verify_notifications").select("*").eq("user_email",myEmail).eq("read",false).order("created_at",{ascending:false}).limit(1);
  if(!r.data||r.data.length===0)return;
  var n=r.data[0];
  var msg=n.status==="approved"?"你的认证申请已通过！":"你的认证申请未通过。理由："+(n.reason||"无");
  setTimeout(function(){toast(msg);},800);
  await supabaseClient.from("verify_notifications").update({read:true}).eq("id",n.id);
}

function openEdit(){
  openModal("editModal");
  $("editAccount").value=localStorage.getItem("account")||"";
  $("editGender").value=localStorage.getItem("gender")||"保密";
  $("editBio").value=localStorage.getItem("bio")||"";
  $("editStatus").textContent="";
}

async function saveEdit(){
  var account=$("editAccount").value.trim();
  var gender=$("editGender").value;
  var bio=$("editBio").value.trim();
  if(!account){$("editStatus").textContent="账号名不能为空";$("editStatus").style.color="#ef4444";return;}
  if(isReservedName(account,myEmail)){$("editStatus").textContent="保留名称";$("editStatus").style.color="#ef4444";return;}
  var ck=await supabaseClient.from("profiles").select("uid").eq("account",account).neq("email",myEmail);
  if(ck.data&&ck.data.length>0){$("editStatus").textContent="该账号名已被使用";$("editStatus").style.color="#ef4444";return;}
  $("editStatus").textContent="保存中...";
  var r=await supabaseClient.from("profiles").update({account:account,gender:gender,bio:bio}).eq("email",myEmail);
  if(r.error){$("editStatus").textContent="保存失败: "+r.error.message;$("editStatus").style.color="#ef4444";return;}
  localStorage.setItem("account",account);
  localStorage.setItem("gender",gender);
  localStorage.setItem("bio",bio);
  $("editStatus").textContent="保存成功！";
  $("editStatus").style.color="#10b981";
  setTimeout(function(){closeModal("editModal");location.reload();},600);
}

async function submitReport(){
  var reason=$("reportReason").value.trim();
  if(!reason){$("reportStatus").textContent="请填写举报理由";$("reportStatus").style.color="#ef4444";return;}
  $("reportStatus").textContent="提交中...";
  var r=await supabaseClient.from("reports").insert([{reporter_uid:myUid,reporter_email:myEmail,target_uid:targetProfile.uid,target_email:targetProfile.email,reason:reason}]).select().single();
  if(r.error){$("reportStatus").textContent="提交失败: "+r.error.message;$("reportStatus").style.color="#ef4444";return;}
  try{
    await fetch(SUPABASE_URL+"/functions/v1/report_handler",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({report_id:r.data.id,target_uid:targetProfile.uid})});
  }catch(e){}
  $("reportStatus").textContent="举报已提交";
  $("reportStatus").style.color="#10b981";
  setTimeout(function(){closeModal("reportModal");},1000);
}

window.addEventListener("DOMContentLoaded",function(){
  if(localStorage.getItem(AUTH_KEY)!=="true"){window.location.replace(AUTH_PAGE_URL);return;}
  loadProfile();
});
</script>
