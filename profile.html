<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页 - SpaceKill124</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%); font-family: 'Microsoft YaHei', sans-serif; min-height: 100vh; color: #e2e8f0; display: flex; justify-content: center; align-items: flex-start; padding: 40px 15px; }
        .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 18px; width: 100%; max-width: 560px; padding: 36px 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.4); }
        .avatar { width: 90px; height: 90px; border-radius: 50%; background: linear-gradient(135deg, #8b5cf6, #3b82f6); display: flex; justify-content: center; align-items: center; font-size: 38px; font-weight: bold; color: white; margin: 0 auto 18px auto; box-shadow: 0 8px 20px rgba(139,92,246,0.4); }
        .account-name { text-align: center; font-size: 24px; font-weight: bold; color: #ffffff; margin-bottom: 6px; }
        .uid-badge { display: block; text-align: center; font-size: 13px; color: #94a3b8; margin-bottom: 25px; }
        .uid-badge span { background: rgba(139,92,246,0.2); border: 1px solid rgba(139,92,246,0.5); padding: 3px 12px; border-radius: 20px; color: #c4b5fd; font-weight: bold; }
        .info-row { display: flex; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 15px; }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: #94a3b8; }
        .info-value { color: #f1f5f9; font-weight: 500; text-align: right; max-width: 65%; word-break: break-all; }
        .bio-box { margin-top: 18px; background: rgba(255,255,255,0.04); border-left: 3px solid #8b5cf6; border-radius: 8px; padding: 14px 16px; font-size: 14px; color: #cbd5e1; line-height: 1.6; min-height: 50px; word-break: break-word; }
        .bio-title { font-size: 12px; color: #94a3b8; margin-bottom: 6px; letter-spacing: 1px; }
        .my-messages-box { margin-top: 18px; background: rgba(255,255,255,0.04); border-left: 3px solid #3b82f6; border-radius: 8px; padding: 14px 16px; }
        .my-messages-list { max-height: 260px; overflow-y: auto; margin-top: 8px; }
        .my-message-item { background: rgba(255,255,255,0.03); border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; font-size: 13px; color: #cbd5e1; line-height: 1.5; word-break: break-word; }
        .my-message-item .msg-time { font-size: 11px; color: #64748b; margin-top: 4px; }
        .no-msg { font-size: 13px; color: #64748b; text-align: center; padding: 12px 0; }
        .actions { display: flex; gap: 10px; margin-top: 28px; flex-wrap: wrap; }
        .actions button { flex: 1; min-width: 110px; padding: 13px; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; transition: all 0.25s; color: white; }
        .btn-edit { background: linear-gradient(to right, #8b5cf6, #7c3aed); }
        .btn-friend { background: linear-gradient(to right, #06b6d4, #0891b2); }
        .btn-back { background: linear-gradient(to right, #3b82f6, #2563eb); }
        .btn-logout { background: linear-gradient(to right, #ef4444, #dc2626); }
        .btn-report { background: linear-gradient(to right, #ef4444, #dc2626); }
        .loading { text-align: center; color: #94a3b8; padding: 60px 0; font-size: 15px; }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #1e293b; border: 1px solid #334155; padding: 30px; border-radius: 14px; width: 90%; max-width: 360px; color: white; }
        .modal-content h3 { margin: 0 0 20px 0; color: #f1f5f9; text-align: center; }
        .modal-content input, .modal-content select, .modal-content textarea { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #475569; border-radius: 8px; background: #0f172a; color: white; font-size: 14px; box-sizing: border-box; font-family: inherit; }
        .modal-content textarea { min-height: 100px; resize: vertical; }
        .modal-buttons { display: flex; gap: 10px; margin-top: 10px; }
        .modal-buttons button { flex: 1; padding: 11px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; color: white; font-weight: bold; }
        .btn-cancel { background: #64748b; }
        .btn-confirm { background: #10b981; }
        .modal-status { font-size: 12px; text-align: center; margin-top: 8px; min-height: 16px; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="card">
        <div id="loadingBox" class="loading">加载中...</div>
        <div id="profileBox" style="display:none;">
            <div class="avatar" id="avatarBox">?</div>
            <div class="account-name" id="nameBox">—</div>
            <div class="uid-badge">UID: <span id="uidBox">—</span></div>
            <div class="info-row"><span class="info-label">邮箱</span><span class="info-value" id="emailBox">—</span></div>
            <div class="info-row"><span class="info-label">性别</span><span class="info-value" id="genderBox">—</span></div>
            <div class="bio-box"><div class="bio-title">个性签名</div><div id="bioBox">这个人很懒，什么都没留下。</div></div>
            <div class="my-messages-box" id="myMessagesBox">
                <div class="bio-title">我的留言 <span id="msgCount">(0)</span></div>
                <div id="myMessagesList" class="my-messages-list"><div class="no-msg">还没有发表过留言。</div></div>
            </div>
            <div class="actions" id="actionsBox"></div>
        </div>
    </div>

    <div id="editModal" class="modal-overlay" onclick="if(event.target===this)closeEdit()">
        <div class="modal-content">
            <h3>编辑资料</h3>
            <input type="text" id="editAccount" placeholder="账号名称">
            <select id="editGender">
                <option value="男">男</option>
                <option value="女">女</option>
                <option value="保密">保密</option>
            </select>
            <input type="text" id="editBio" placeholder="个性签名">
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeEdit()">取消</button>
                <button class="btn-confirm" onclick="saveEdit()">保存</button>
            </div>
            <p class="modal-status" id="editStatus"></p>
        </div>
    </div>

    <div id="reportModal" class="modal-overlay" onclick="if(event.target===this)closeReport()">
        <div class="modal-content">
            <h3>举报用户</h3>
            <textarea id="reportReason" placeholder="请填写举报理由..."></textarea>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeReport()">取消</button>
                <button class="btn-confirm" onclick="submitReport()">提交举报</button>
            </div>
            <p class="modal-status" id="reportStatus"></p>
        </div>
    </div>

<script>
    const SUPABASE_URL = "https://xryfrqxelzetzkgsaycl.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_bV150rxd0EeojJEL53Cgwg_Lc3ZUkoU";
    let supabaseClient = null;
    if (window.supabase) supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const AUTH_KEY = "sk124_auth_token";
    const AUTH_PAGE_URL = "https://tks124.github.io/tks";
    const RESERVED_NAME = "太空杀124";
    const RESERVED_OWNER_EMAIL = "qwe18965540810@qq.com";

    let currentEmail = "", myEmail = "", myUid = null, targetProfile = null, isSelf = true;

    function escapeHtml(str) {
        return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
    }

    function isReservedName(account, email) {
        if (!account) return false;
        if (account.trim() !== RESERVED_NAME) return false;
        if (email && email === RESERVED_OWNER_EMAIL) return false;
        return true;
    }

    async function isAccountTaken(account, excludeEmail) {
        if (!supabaseClient || !account) return false;
        let query = supabaseClient.from("profiles").select("uid, email").eq("account", account);
        if (excludeEmail) query = query.neq("email", excludeEmail);
        const { data, error } = await query;
        if (error) return false;
        return data && data.length > 0;
    }

    function getTargetUidFromUrl() {
        const params = new URLSearchParams(window.location.search);
        const uid = params.get("uid");
        if (uid && /^\d+$/.test(uid)) return parseInt(uid, 10);
        return null;
    }

    async function loadProfile() {
        if (!supabaseClient) { document.getElementById("loadingBox").textContent = "Supabase 未加载"; return; }
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) { window.location.replace(AUTH_PAGE_URL); return; }

        myEmail = session.user.email;
        const { data: selfProfile } = await supabaseClient.from("profiles").select("*").eq("email", myEmail).maybeSingle();
        if (!selfProfile) { document.getElementById("loadingBox").textContent = "无法获取自己的资料"; return; }
        myUid = selfProfile.uid;

        const targetUid = getTargetUidFromUrl();
        if (targetUid && targetUid !== myUid) {
            isSelf = false;
            const { data: other } = await supabaseClient.from("profiles").select("*").eq("uid", targetUid).maybeSingle();
            if (!other) { document.getElementById("loadingBox").textContent = "未找到该用户"; return; }
            targetProfile = other; currentEmail = other.email;
        } else {
            isSelf = true; targetProfile = selfProfile; currentEmail = selfProfile.email;
        }

        document.getElementById("loadingBox").style.display = "none";
        document.getElementById("profileBox").style.display = "block";

        const account = targetProfile.account || currentEmail;
        const uid = targetProfile.uid || "-";
        const gender = targetProfile.gender || "保密";
        const bio = targetProfile.bio || "";

        document.getElementById("avatarBox").textContent = account.charAt(0).toUpperCase();
        document.getElementById("nameBox").textContent = account;
        document.getElementById("uidBox").textContent = uid;
        document.getElementById("emailBox").textContent = currentEmail;
        document.getElementById("genderBox").textContent = gender;
        document.getElementById("bioBox").textContent = bio || "这个人很懒，什么都没留下。";

        if (isSelf) {
            localStorage.setItem("account", account); localStorage.setItem("uid", uid);
            localStorage.setItem("gender", gender); localStorage.setItem("bio", bio);
            localStorage.setItem("email", currentEmail);
            document.getElementById("myMessagesBox").style.display = "block";
            await loadMyMessages();
            renderSelfActions();
        } else {
            document.getElementById("myMessagesBox").style.display = "none";
            renderOtherActions();
        }
    }

    function renderSelfActions() {
        document.getElementById("actionsBox").innerHTML =
            '<button class="btn-edit" onclick="openEdit()">编辑资料</button>' +
            '<button class="btn-friend" onclick="goFriends()">好友</button>' +
            '<button class="btn-back" onclick="goBack()">返回首页</button>' +
            '<button class="btn-logout" onclick="doLogout()">退出登录</button>';
    }

    function renderOtherActions() {
        document.getElementById("actionsBox").innerHTML =
            '<button class="btn-report" onclick="openReport()">举报</button>' +
            '<button class="btn-back" onclick="goBack()">返回</button>';
    }

    async function loadMyMessages() {
        const list = document.getElementById("myMessagesList");
        const count = document.getElementById("msgCount");
        const { data, error } = await supabaseClient.from("my_messages").select("*").eq("user_email", currentEmail);
        if (error) { list.innerHTML = '<div class="no-msg">加载失败</div>'; count.textContent = "(0)"; return; }
        if (!data || data.length === 0) { list.innerHTML = '<div class="no-msg">还没有发表过留言。</div>'; count.textContent = "(0)"; return; }
        count.textContent = "(" + data.length + ")";
        list.innerHTML = data.map(function(m) {
            const content = escapeHtml(m.content || "");
            const time = m.created_at ? new Date(m.created_at).toLocaleString("zh-CN") : "";
            return '<div class="my-message-item"><div>' + content + '</div><div class="msg-time">' + escapeHtml(time) + '</div></div>';
        }).join("");
    }

    function openEdit() {
        document.getElementById("editModal").style.display = "flex";
        document.getElementById("editAccount").value = localStorage.getItem("account") || "";
        document.getElementById("editGender").value = localStorage.getItem("gender") || "保密";
        document.getElementById("editBio").value = localStorage.getItem("bio") || "";
        document.getElementById("editStatus").textContent = "";
    }
    function closeEdit() { document.getElementById("editModal").style.display = "none"; }

    async function saveEdit() {
        const account = document.getElementById("editAccount").value.trim();
        const gender = document.getElementById("editGender").value;
        const bio = document.getElementById("editBio").value.trim();
        const status = document.getElementById("editStatus");
        if (!account) { status.textContent = "账号名不能为空！"; status.style.color = "#ef4444"; return; }
        if (isReservedName(account, myEmail)) { status.textContent = "保留名称，仅限指定邮箱使用"; status.style.color = "#ef4444"; return; }
        status.textContent = "保存中..."; status.style.color = "#94a3b8";
        const taken = await isAccountTaken(account, myEmail);
        if (taken) { status.textContent = "该账号名已被使用"; status.style.color = "#ef4444"; return; }
        const { error } = await supabaseClient.from("profiles").update({ account: account, gender: gender, bio: bio }).eq("email", myEmail);
        if (error) { status.textContent = "保存失败: " + error.message; status.style.color = "#ef4444"; return; }
        status.textContent = "保存成功！"; status.style.color = "#10b981";
        document.getElementById("avatarBox").textContent = account.charAt(0).toUpperCase();
        document.getElementById("nameBox").textContent = account;
        document.getElementById("genderBox").textContent = gender;
        document.getElementById("bioBox").textContent = bio || "这个人很懒，什么都没留下。";
        localStorage.setItem("account", account); localStorage.setItem("gender", gender); localStorage.setItem("bio", bio);
        setTimeout(closeEdit, 500);
    }

    function openReport() {
        document.getElementById("reportModal").style.display = "flex";
        document.getElementById("reportReason").value = "";
        document.getElementById("reportStatus").textContent = "";
    }
    function closeReport() { document.getElementById("reportModal").style.display = "none"; }

    async function submitReport() {
        const reason = document.getElementById("reportReason").value.trim();
        const status = document.getElementById("reportStatus");
        if (!reason) { status.textContent = "请填写举报理由！"; status.style.color = "#ef4444"; return; }
        if (!targetProfile) { status.textContent = "找不到被举报的用户"; status.style.color = "#ef4444"; return; }
        if (targetProfile.uid === myUid) { status.textContent = "不能举报自己"; status.style.color = "#ef4444"; return; }
        status.textContent = "提交中..."; status.style.color = "#94a3b8";
        const { data: reportData, error } = await supabaseClient.from("reports").insert([{
            reporter_uid: myUid, reporter_email: myEmail,
            target_uid: targetProfile.uid, target_email: targetProfile.email, reason: reason
        }]).select().single();
        if (error) { status.textContent = "提交失败: " + error.message; status.style.color = "#ef4444"; return; }
        try {
            await fetch(SUPABASE_URL + "/functions/v1/report_handler", {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ report_id: reportData.id, target_uid: targetProfile.uid })
            });
        } catch (e) { console.error(e); }
        status.textContent = "举报已提交，正在审核中"; status.style.color = "#10b981";
        setTimeout(closeReport, 1200);
    }

    function goFriends() { window.location.href = "friends.html"; }
    function goBack() { window.location.href = isSelf ? "SpaceKill124_源代码.html" : "friends.html"; }

    async function doLogout() {
        if (supabaseClient) { try { await supabaseClient.auth.signOut(); } catch (e) {} }
        ["account","email","password","uid","gender","bio","sk124_auth_token"].forEach(k => localStorage.removeItem(k));
        window.location.replace(AUTH_PAGE_URL);
    }

    window.addEventListener("DOMContentLoaded", async function() {
        if (localStorage.getItem(AUTH_KEY) !== "true") { window.location.replace(AUTH_PAGE_URL); return; }
        await loadProfile();
    });
</script>
</body>
      </html>
