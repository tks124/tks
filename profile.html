function genBase32(len){
  var chars="ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
  var s="";
  for(var i=0;i<len;i++)s+=chars.charAt(Math.floor(Math.random()*chars.length));
  return s;
}
function base32Decode(str){
  var alphabet="ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
  var bits="";
  str=String(str||"").replace(/=+$/,"").toUpperCase();
  for(var i=0;i<str.length;i++){
    var v=alphabet.indexOf(str.charAt(i));
    if(v<0)continue;
    bits+=v.toString(2).padStart(5,"0");
  }
  var bytes=[];
  for(var j=0;j+8<=bits.length;j+=8){
    bytes.push(parseInt(bits.substring(j,j+8),2));
  }
  return bytes;
}
function genTOTP(secret,timeSec){
  var t0=timeSec!==undefined?timeSec:Math.floor(Date.now()/1000);
  var keyBytes=base32Decode(secret);
  var counter=Math.floor(t0/30);
  var high=Math.floor(counter/0x100000000);
  var low=counter-high*0x100000000;
  var msgBytes=[(high>>>24)&255,(high>>>16)&255,(high>>>8)&255,high&255,(low>>>24)&255,(low>>>16)&255,(low>>>8)&255,low&255];
  var keyHex=keyBytes.map(function(b){return("0"+b.toString(16)).slice(-2);}).join("");
  var msgHex=msgBytes.map(function(b){return("0"+b.toString(16)).slice(-2);}).join("");
  var hmac=CryptoJS.HmacSHA1(CryptoJS.enc.Hex.parse(msgHex),CryptoJS.enc.Hex.parse(keyHex));
  var hmacArray=Array.from(CryptoJS.enc.Hex.parse(hmac.toString()).words).reduce(function(acc,w){
    return acc.concat([(w>>>24)&255,(w>>>16)&255,(w>>>8)&255,w&255]);
  },[]);
  var offset=hmacArray[hmacArray.length-1]&15;
  var code=((hmacArray[offset]&127)<<24)|((hmacArray[offset+1]&255)<<16)|((hmacArray[offset+2]&255)<<8)|(hmacArray[offset+3]&255);
  return String(code%1000000).padStart(6,"0");
}
function verifyTOTP(secret,code){
  var now=Math.floor(Date.now()/1000);
  for(var i=-1;i<=1;i++){
    if(genTOTP(secret,now+i*30)===code)return true;
  }
  return false;
}

  var r=await supabaseClient.from("reports").insert([{reporter_uid:myUid,reporter_email:myEmail,target_uid:targetProfile.uid,target_email:targetProfile.email,reason:reason}]).select().single();
  if(r.error){$("reportStatus").textContent="提交失败: "+r.error.message;$("reportStatus").style.color="#ef4444";return;}
  try{await fetch(SUPABASE_URL+"/functions/v1/report_handler",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({report_id:r.data.id,target_uid:targetProfile.uid})});}catch(e){}
  $("reportStatus").textContent="举报已提交";$("reportStatus").style.color="#10b981";
  setTimeout(function(){closeModal("reportModal");},1000);
}
async function doLogout(){
  if(supabaseClient){try{await supabaseClient.auth.signOut();}catch(e){}}
  ["account","email","password","uid","gender","bio","sk124_auth_token"].forEach(function(k){localStorage.removeItem(k);});
  window.location.replace(AUTH_PAGE_URL);
}

window.addEventListener("DOMContentLoaded",function(){
  if(localStorage.getItem(AUTH_KEY)!=="true"){window.location.replace(AUTH_PAGE_URL);return;}
  if(localStorage.getItem("profile_light")==="1")document.body.classList.add("light");
  loadProfile();
});
</script>
